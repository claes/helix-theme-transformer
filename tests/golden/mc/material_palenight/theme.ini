[skin]
    description = material_palenight - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #a6accd;#292d3e
    selected = #a6accd;#444267
    marked = #ffcb6b;#292d3e;bold
    markselect = #ffcb6b;#444267;bold
    gauge = #a6accd;#292d3e
    input = #a6accd;#292d3e
    inputmark = #a6accd;#444267
    inputunchanged = #676e95;#292d3e
    disabled = #676e95;#292d3e
    reverse = #292d3e;#a6accd
    commandlinemark = #a6accd;#444267
    header = #c792ea;#292d3e;bold
    shadow = #676e95;#292d3e

[dialog]
    _default_ = #acb2d0;#444267
    dfocus = #292d3e;#82aaff
    dhotnormal = #acb2d0;#444267;underline
    dhotfocus = #292d3e;#82aaff;underline
    dtitle = #acb2d0;#444267;bold

[error]
    _default_ = #a6accd;#ff5370
    errdfocus = #292d3e;#ffcb6b;bold
    errdhotnormal = #ffcb6b;#ff5370
    errdhotfocus = #ffcb6b;#444267;bold
    errdtitle = #ffcb6b;#ff5370;bold

[filehighlight]
