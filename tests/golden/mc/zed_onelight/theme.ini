[skin]
    description = zed_onelight - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #383a41;#fafafa
    selected = #383a41;#efefef
    marked = #dabb7e;#fafafa;bold
    markselect = #dabb7e;#efefef;bold
    gauge = #383a41;#eaeaed
    input = #383a41;#eaeaed
    inputmark = #383a41;#efefef
    inputunchanged = #a2a3a7;#eaeaed
    disabled = #a2a3a7;#eaeaed
    reverse = #fafafa;#383a41
    commandlinemark = #383a41;#efefef
    header = #3882b7;#fafafa;bold
    shadow = #a2a3a7;#fafafa

[dialog]
    _default_ = #383a41;#ebebec
    dfocus = #383a41;#c1c1c3;bold
    dhotnormal = #383a41;#ebebec;underline
    dhotfocus = #383a41;#c1c1c3;bold+underline
    dtitle = #383a41;#ebebec;bold

[error]
    _default_ = #383a41;#d36151
    errdfocus = #fafafa;#dabb7e;bold
    errdhotnormal = #dabb7e;#d36151
    errdhotfocus = #dabb7e;#efefef;bold
    errdtitle = #dabb7e;#d36151;bold

[filehighlight]
    directory = #5b79e3;#fafafa;bold
    executable = #649f57;#fafafa;bold
    symlink = #383a41;#fafafa
    hardlink = #383a41;#fafafa
    stalelink = #d36151;#fafafa
    device = #dabb7e;#fafafa
    special = #383a41;#fafafa
    core = #d36151;#fafafa
    temp = #a2a3a7;#fafafa
    archive = #ad6e25;#fafafa
    doc = #649f57;#fafafa
    source = #a449ab;#fafafa
    media = #a449ab;#fafafa
    graph = #a449ab;#fafafa
    database = #3882b7;#fafafa

[menu]
    _default_ = #383a41;#eaeaed
    menusel = #171717;#5b79e3
    menuhot = #383a41;#eaeaed;underline
    menuhotsel = #171717;#5b79e3;underline
    menuinactive = #85868a;#eaeaed

[popupmenu]
    _default_ = #383a41;#eaeaed
    menusel = #171717;#5b79e3
    menutitle = #383a41;#eaeaed;bold

[buttonbar]
    hotkey = #dabb7e;#eaeaed;bold
    button = #383a41;#eaeaed

[statusbar]
    _default_ = #fafafa;#383a41

[help]
    _default_ = #383a41;#eaeaed
    helpitalic = #dabb7e;#eaeaed;italic
    helpbold = #3882b7;#eaeaed;bold
    helplink = #383a41;#eaeaed;underline
    helpslink = #383a41;#383a41
    helptitle = #3882b7;#eaeaed;bold

[editor]
    _default_ = #383a41;#fafafa
    editbold = #dabb7e;#fafafa;bold
    editmarked = #383a41;#efefef
    editwhitespace = #a2a3a7;#fafafa
    editnonprintable = #a2a3a7;#fafafa
    editlinestate = #fafafa;#eaeaed
    bookmark = #383a41;#d36151
    bookmarkfound = #fafafa;#649f57
    editrightmargin = #a2a3a7;#eaeaed
    editbg = #383a41;#fafafa
    editframe = #a2a3a7;#fafafa
    editframeactive = #42444a;#fafafa
    editframedrag = #d36151;#fafafa

[viewer]
    _default_ = #383a41;#fafafa
    viewbold = #dabb7e;#fafafa;bold
    viewunderline = #383a41;#fafafa;underline
    viewselected = #383a41;#efefef

[diffviewer]
    added = #fafafa;#649f57
    changedline = #fafafa;#dabb7e
    changednew = #fafafa;#649f57
    changed = #fafafa;#dabb7e
    removed = #383a41;#d36151
    error = #383a41;#d36151
