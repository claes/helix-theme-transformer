[skin]
    description = catppuccin_latte - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #4c4f69;#eff1f5
    selected = #4c4f69;#bcc0cc
    marked = #df8e1d;#eff1f5;bold
    markselect = #df8e1d;#bcc0cc;bold
    gauge = #4c4f69;#e6e9ef
    input = #4c4f69;#e6e9ef
    inputmark = #4c4f69;#bcc0cc
    inputunchanged = #7c7f93;#e6e9ef
    disabled = #7c7f93;#e6e9ef
    reverse = #eff1f5;#4c4f69
    commandlinemark = #4c4f69;#bcc0cc
    header = #df8e1d;#eff1f5;bold
    shadow = #7c7f93;#eff1f5

[dialog]
    _default_ = #4c4f69;#ccd0da
    dfocus = #3c3e53;#a7aab3;bold
    dhotnormal = #4c4f69;#ccd0da;underline
    dhotfocus = #3c3e53;#a7aab3;bold+underline
    dtitle = #4c4f69;#ccd0da;bold

[error]
    _default_ = #4c4f69;#d20f39
    errdfocus = #eff1f5;#df8e1d;bold
    errdhotnormal = #df8e1d;#d20f39
    errdhotfocus = #df8e1d;#bcc0cc;bold
    errdtitle = #df8e1d;#d20f39;bold

[filehighlight]
    directory = #1e66f5;#eff1f5;bold
    executable = #40a02b;#eff1f5;bold
    symlink = #1e66f5;#eff1f5
    hardlink = #1e66f5;#eff1f5
    stalelink = #d20f39;#eff1f5
    device = #df8e1d;#eff1f5
    special = #1e66f5;#eff1f5
    core = #d20f39;#eff1f5
    temp = #7c7f93;#eff1f5
    archive = #fe640b;#eff1f5
    doc = #40a02b;#eff1f5
    source = #8839ef;#eff1f5
    media = #8839ef;#eff1f5
    graph = #8839ef;#eff1f5
    database = #df8e1d;#eff1f5

[menu]
    _default_ = #565866;#ccd0da
    menusel = #3c3e53;#a7aab5;bold
    menuhot = #565866;#ccd0da;underline
    menuhotsel = #3c3e53;#a7aab5;bold+underline
    menuinactive = #717482;#ccd0da

[popupmenu]
    _default_ = #565866;#ccd0da
    menusel = #3c3e53;#a7aab5;bold
    menutitle = #565866;#ccd0da;bold

[buttonbar]
    hotkey = #df8e1d;#e6e9ef;bold
    button = #4c4f69;#e6e9ef

[statusbar]
    _default_ = #eff1f5;#1e66f5

[help]
    _default_ = #4c4f69;#e6e9ef
    helpitalic = #df8e1d;#e6e9ef;italic
    helpbold = #df8e1d;#e6e9ef;bold
    helplink = #1e66f5;#e6e9ef;underline
    helpslink = #4c4f69;#1e66f5
    helptitle = #df8e1d;#e6e9ef;bold

[editor]
    _default_ = #4c4f69;#eff1f5
    editbold = #df8e1d;#eff1f5;bold
    editmarked = #4c4f69;#bcc0cc
    editwhitespace = #7c7f93;#eff1f5
    editnonprintable = #7c7f93;#eff1f5
    editlinestate = #eff1f5;#e6e9ef
    bookmark = #4c4f69;#d20f39
    bookmarkfound = #eff1f5;#40a02b
    editrightmargin = #7c7f93;#e6e9ef
    editbg = #4c4f69;#eff1f5
    editframe = #7c7f93;#eff1f5
    editframeactive = #545770;#eff1f5
    editframedrag = #d20f39;#eff1f5

[viewer]
    _default_ = #4c4f69;#eff1f5
    viewbold = #df8e1d;#eff1f5;bold
    viewunderline = #1e66f5;#eff1f5;underline
    viewselected = #4c4f69;#bcc0cc

[diffviewer]
    added = #eff1f5;#40a02b
    changedline = #eff1f5;#1e66f5
    changednew = #eff1f5;#40a02b
    changed = #eff1f5;#1e66f5
    removed = #4c4f69;#d20f39
    error = #4c4f69;#d20f39
