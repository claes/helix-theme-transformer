[skin]
    description = material_darker - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #b0bec5;#212121
    selected = #b0bec5;#404040
    marked = #ffcb6b;#212121;bold
    markselect = #ffcb6b;#404040;bold
    gauge = #b0bec5;#212121
    input = #b0bec5;#212121
    inputmark = #b0bec5;#404040
    inputunchanged = #616161;#212121
    disabled = #616161;#212121
    reverse = #212121;#b0bec5
    commandlinemark = #b0bec5;#404040
    header = #c792ea;#212121;bold
    shadow = #616161;#212121

[dialog]
    _default_ = #b0bec5;#3f3f3f
    dfocus = #212121;#82aaff
    dhotnormal = #b0bec5;#3f3f3f;underline
    dhotfocus = #212121;#82aaff;underline
    dtitle = #b0bec5;#3f3f3f;bold

[error]
    _default_ = #b0bec5;#ff5370
    errdfocus = #212121;#ffcb6b;bold
    errdhotnormal = #ffcb6b;#ff5370
    errdhotfocus = #ffcb6b;#404040;bold
    errdtitle = #ffcb6b;#ff5370;bold

[filehighlight]
    directory = #82aaff;#212121;bold
    executable = #c3e88d;#212121;bold
    symlink = #89ddff;#212121
    hardlink = #89ddff;#212121
    stalelink = #ff5370;#212121
    device = #ffcb6b;#212121
    special = #89ddff;#212121
    core = #ff5370;#212121
    temp = #616161;#212121
    archive = #ffcb6b;#212121
    doc = #c3e88d;#212121
    source = #c792ea;#212121
    media = #c792ea;#212121
    graph = #c792ea;#212121
    database = #c792ea;#212121

[menu]
    _default_ = #b0bec5;#3f3f3f
    menusel = #212121;#82aaff
    menuhot = #b0bec5;#3f3f3f;underline
    menuhotsel = #212121;#82aaff;underline
    menuinactive = #898989;#3f3f3f

[popupmenu]
    _default_ = #b0bec5;#3f3f3f
    menusel = #212121;#82aaff
    menutitle = #b0bec5;#3f3f3f;bold

[buttonbar]
    hotkey = #ffcb6b;#212121;bold
    button = #b0bec5;#212121

[statusbar]
    _default_ = #212121;#89ddff

[help]
    _default_ = #b0bec5;#212121
    helpitalic = #ffcb6b;#212121;italic
    helpbold = #c792ea;#212121;bold
    helplink = #89ddff;#212121;underline
    helpslink = #b0bec5;#89ddff
    helptitle = #c792ea;#212121;bold

[editor]
    _default_ = #b0bec5;#212121
    editbold = #ffcb6b;#212121;bold
    editmarked = #b0bec5;#404040
    editwhitespace = #616161;#212121
    editnonprintable = #616161;#212121
    editlinestate = #212121;#212121
    bookmark = #b0bec5;#ff5370
    bookmarkfound = #212121;#c3e88d
    editrightmargin = #616161;#212121
    editbg = #b0bec5;#212121
    editframe = #616161;#212121
    editframeactive = #a9b6bd;#212121
    editframedrag = #ff5370;#212121

[viewer]
    _default_ = #b0bec5;#212121
    viewbold = #ffcb6b;#212121;bold
    viewunderline = #89ddff;#212121;underline
