name: Release generated themes

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Release tag for the generated themes archive
        required: true
        default: generated-themes-latest

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate theme files
        run: make generate-themes

      - name: Package generated themes
        run: zip -r generated-themes.zip generated-themes

      - name: Upload generated themes artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-themes
          path: generated-themes.zip

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" generated-themes.zip --clobber
          else
            gh release create "$RELEASE_TAG" generated-themes.zip \
              --title "$RELEASE_TAG" \
              --notes "Generated theme files."
          fi
