    inputunchanged = #627d9d;#c7c7ba
    disabled = #627d9d;#c7c7ba
    reverse = #f6fbd6;#161c23
    commandlinemark = #161c23;#c7c7ba
    header = #dc597f;#f6fbd6;bold
    shadow = #627d9d;#f6fbd6

[dialog]
    _default_ = #161c23;#c7c7ba
    dfocus = #f6fbd6;#c7c7ba;bold
    dhotnormal = #dc7759;#c7c7ba
    dhotfocus = #dc7759;#c7c7ba;bold
    dtitle = #dc597f;#c7c7ba;bold

[error]
