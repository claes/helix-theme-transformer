[skin]
    description = cyan_light - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #434b6c;#f2f3f7
    selected = #434b6c;#d0eaff
    marked = #f49810;#f2f3f7;bold
    markselect = #f49810;#d0eaff;bold
    gauge = #434b6c;#dadde8
    input = #434b6c;#dadde8
    inputmark = #434b6c;#d0eaff
    inputunchanged = #808080;#dadde8
    disabled = #808080;#dadde8
    reverse = #f2f3f7;#434b6c
    commandlinemark = #434b6c;#d0eaff
    header = #25293c;#f2f3f7;bold
    shadow = #808080;#f2f3f7

[dialog]
    _default_ = #434b6c;#dadde8
    dfocus = #f2f3f7;#d0eaff;bold
    dhotnormal = #f49810;#dadde8
    dhotfocus = #f49810;#d0eaff;bold
    dtitle = #25293c;#dadde8;bold

[error]
    _default_ = #434b6c;#d90016
    errdfocus = #f2f3f7;#f49810;bold
    errdhotnormal = #f49810;#d90016
    errdhotfocus = #f49810;#d0eaff;bold
    errdtitle = #f49810;#d90016;bold

[filehighlight]
    directory = #25293c;#f2f3f7;bold
    executable = #00733b;#f2f3f7;bold
    symlink = #343a54;#f2f3f7
    hardlink = #343a54;#f2f3f7
    stalelink = #d90016;#f2f3f7
    device = #f49810;#f2f3f7
    special = #343a54;#f2f3f7
    core = #d90016;#f2f3f7
    temp = #808080;#f2f3f7
    archive = #0073e6;#f2f3f7
    doc = #00733b;#f2f3f7
    source = #000080;#f2f3f7
    media = #000080;#f2f3f7
    graph = #000080;#f2f3f7
    database = #25293c;#f2f3f7

[menu]
    _default_ = #434b6c;#dadde8
    menusel = #434b6c;#d0eaff
    menuhot = #f49810;#dadde8
    menuhotsel = #f49810;#d0eaff
    menuinactive = #808080;#dadde8

[popupmenu]
    _default_ = #434b6c;#dadde8
    menusel = #434b6c;#d0eaff
    menutitle = #25293c;#dadde8;bold

[buttonbar]
    hotkey = #f49810;#dadde8;bold
    button = #434b6c;#dadde8

[statusbar]
    _default_ = #f2f3f7;#343a54

[help]
    _default_ = #434b6c;#dadde8
    helpitalic = #f49810;#dadde8;italic
    helpbold = #25293c;#dadde8;bold
    helplink = #343a54;#dadde8;underline
    helpslink = #434b6c;#343a54
    helptitle = #25293c;#dadde8;bold

[editor]
    _default_ = #434b6c;#f2f3f7
    editbold = #f49810;#f2f3f7;bold
    editmarked = #434b6c;#d0eaff
    editwhitespace = #808080;#f2f3f7
    editnonprintable = #808080;#f2f3f7
    editlinestate = #f2f3f7;#dadde8
    bookmark = #434b6c;#d90016
    bookmarkfound = #f2f3f7;#00733b
    editrightmargin = #808080;#dadde8
    editbg = #434b6c;#f2f3f7
    editframe = #808080;#f2f3f7
    editframeactive = #25293c;#f2f3f7
    editframedrag = #d90016;#f2f3f7

[viewer]
    _default_ = #434b6c;#f2f3f7
    viewbold = #f49810;#f2f3f7;bold
    viewunderline = #343a54;#f2f3f7;underline
    viewselected = #434b6c;#d0eaff

[diffviewer]
    added = #f2f3f7;#00733b
    changedline = #f2f3f7;#0073e6
    changednew = #f2f3f7;#00733b
    changed = #f2f3f7;#0073e6
    removed = #434b6c;#d90016
    error = #434b6c;#d90016
