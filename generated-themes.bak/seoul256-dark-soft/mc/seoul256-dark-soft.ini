[skin]
    description = seoul256-dark-soft - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #d0d0d0;#4e4e4e
    selected = #d0d0d0;#875f5f
    marked = #ffd787;#4e4e4e;bold
    markselect = #ffd787;#875f5f;bold
    gauge = #d0d0d0;#d7d7af
    input = #d0d0d0;#d7d7af
    inputmark = #d0d0d0;#875f5f
    inputunchanged = #5f875f;#d7d7af
    disabled = #5f875f;#d7d7af
    reverse = #4e4e4e;#d0d0d0
    commandlinemark = #d0d0d0;#875f5f
    header = #d8af5f;#4e4e4e;bold
    shadow = #5f875f;#4e4e4e

[dialog]
    _default_ = #d0d0d0;#d7d7af
    dfocus = #4e4e4e;#875f5f;bold
    dhotnormal = #ffd787;#d7d7af
    dhotfocus = #ffd787;#875f5f;bold
    dtitle = #d8af5f;#d7d7af;bold

[error]
    _default_ = #d0d0d0;#d70000
    errdfocus = #4e4e4e;#ffd787;bold
    errdhotnormal = #ffd787;#d70000
    errdhotfocus = #ffd787;#875f5f;bold
    errdtitle = #ffd787;#d70000;bold

[filehighlight]
    directory = #d7d7af;#4e4e4e;bold
    executable = #87afaf;#4e4e4e;bold
    symlink = #d7d7af;#4e4e4e
    hardlink = #d7d7af;#4e4e4e
    stalelink = #d70000;#4e4e4e
    device = #ffd787;#4e4e4e
    special = #d7d7af;#4e4e4e
    core = #d70000;#4e4e4e
    temp = #5f875f;#4e4e4e
    archive = #ffd787;#4e4e4e
    doc = #87afaf;#4e4e4e
    source = #d75f87;#4e4e4e
    media = #d75f87;#4e4e4e
    graph = #d75f87;#4e4e4e
    database = #d8af5f;#4e4e4e

[menu]
    _default_ = #d0d0d0;#d7d7af
    menusel = #d0d0d0;#875f5f
    menuhot = #ffd787;#d7d7af
    menuhotsel = #ffd787;#875f5f
    menuinactive = #5f875f;#d7d7af

[popupmenu]
    _default_ = #d0d0d0;#d7d7af
    menusel = #d0d0d0;#875f5f
    menutitle = #d8af5f;#d7d7af;bold

[buttonbar]
    hotkey = #ffd787;#d7d7af;bold
    button = #d0d0d0;#d7d7af

[statusbar]
    _default_ = #4e4e4e;#d7d7af

[help]
    _default_ = #d0d0d0;#d7d7af
    helpitalic = #ffd787;#d7d7af;italic
    helpbold = #d8af5f;#d7d7af;bold
    helplink = #d7d7af;#d7d7af;underline
    helpslink = #d0d0d0;#d7d7af
    helptitle = #d8af5f;#d7d7af;bold

[editor]
    _default_ = #d0d0d0;#4e4e4e
    editbold = #ffd787;#4e4e4e;bold
    editmarked = #d0d0d0;#875f5f
    editwhitespace = #5f875f;#4e4e4e
    editnonprintable = #5f875f;#4e4e4e
    editlinestate = #4e4e4e;#d7d7af
    bookmark = #d0d0d0;#d70000
    bookmarkfound = #4e4e4e;#87af87
    editrightmargin = #5f875f;#d7d7af
    editbg = #d0d0d0;#4e4e4e
    editframe = #5f875f;#4e4e4e
    editframeactive = #d0d0d0;#4e4e4e
    editframedrag = #d70000;#4e4e4e

[viewer]
    _default_ = #d0d0d0;#4e4e4e
    viewbold = #ffd787;#4e4e4e;bold
    viewunderline = #d7d7af;#4e4e4e;underline
    viewselected = #d0d0d0;#875f5f

[diffviewer]
    added = #4e4e4e;#87af87
    changedline = #4e4e4e;#5f87d7
    changednew = #4e4e4e;#87af87
    changed = #4e4e4e;#5f87d7
    removed = #d0d0d0;#d7005f
    error = #d0d0d0;#d70000
