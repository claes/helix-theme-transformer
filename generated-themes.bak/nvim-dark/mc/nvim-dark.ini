[skin]
    description = nvim-dark - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #e0e2ea;#14161b
    selected = #e0e2ea;#0d2847
    marked = #fce094;#14161b;bold
    markselect = #fce094;#0d2847;bold
    gauge = #e0e2ea;#2c2e33
    input = #e0e2ea;#2c2e33
    inputmark = #e0e2ea;#0d2847
    inputunchanged = #9b9ea4;#2c2e33
    disabled = #9b9ea4;#2c2e33
    reverse = #14161b;#e0e2ea
    commandlinemark = #e0e2ea;#0d2847
    header = #e0e2ea;#14161b;bold
    shadow = #9b9ea4;#14161b

[dialog]
    _default_ = #e0e2ea;#2c2e33
    dfocus = #14161b;#0d2847;bold
    dhotnormal = #fce094;#2c2e33
    dhotfocus = #fce094;#0d2847;bold
    dtitle = #e0e2ea;#2c2e33;bold

[error]
