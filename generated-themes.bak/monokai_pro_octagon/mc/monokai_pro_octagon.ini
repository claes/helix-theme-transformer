[skin]
    description = monokai_pro_octagon - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #eaf2f1;#282a3a
    selected = #eaf2f1;#535763
    marked = #ff9b5e;#282a3a;bold
    markselect = #ff9b5e;#535763;bold
    gauge = #eaf2f1;#535763
    input = #eaf2f1;#535763
    inputmark = #eaf2f1;#535763
    inputunchanged = #696d77;#535763
    disabled = #696d77;#535763
    reverse = #282a3a;#eaf2f1
    commandlinemark = #eaf2f1;#535763
    header = #bad761;#282a3a;bold
    shadow = #696d77;#282a3a

[dialog]
    _default_ = #eaf2f1;#535763
    dfocus = #282a3a;#535763;bold
    dhotnormal = #ff9b5e;#535763
    dhotfocus = #ff9b5e;#535763;bold
    dtitle = #bad761;#535763;bold

[error]
    _default_ = #eaf2f1;#ff657a
    errdfocus = #282a3a;#ff9b5e;bold
    errdhotnormal = #ff9b5e;#ff657a
    errdhotfocus = #ff9b5e;#535763;bold
