[skin]
    description = modus_operandi_tinted - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #000000;#ffffff
    selected = #000000;#e0e0e0
    marked = #808000;#ffffff;bold
    markselect = #808000;#e0e0e0;bold
    gauge = #000000;#c8c8c8
    input = #000000;#c8c8c8
    inputmark = #000000;#e0e0e0
    inputunchanged = #7f0000;#c8c8c8
    disabled = #7f0000;#c8c8c8
    reverse = #ffffff;#000000
    commandlinemark = #000000;#e0e0e0
    header = #005f5f;#ffffff;bold
    shadow = #7f0000;#ffffff

[dialog]
    _default_ = #000000;#c8c8c8
    dfocus = #ffffff;#e0e0e0;bold
    dhotnormal = #808000;#c8c8c8
    dhotfocus = #808000;#e0e0e0;bold
    dtitle = #005f5f;#c8c8c8;bold

[error]
    _default_ = #000000;#d00000
    errdfocus = #ffffff;#808000;bold
    errdhotnormal = #808000;#d00000
    errdhotfocus = #808000;#e0e0e0;bold
    errdtitle = #808000;#d00000;bold

[filehighlight]
    directory = #721045;#ffffff;bold
    executable = #3548cf;#ffffff;bold
    symlink = #a0132f;#ffffff
    hardlink = #a0132f;#ffffff
    stalelink = #d00000;#ffffff
    device = #808000;#ffffff
    special = #a0132f;#ffffff
    core = #d00000;#ffffff
    temp = #7f0000;#ffffff
    archive = #0000b0;#ffffff
    doc = #3548cf;#ffffff
    source = #531ab6;#ffffff
    media = #531ab6;#ffffff
    graph = #531ab6;#ffffff
    database = #005f5f;#ffffff

[menu]
    _default_ = #000000;#c8c8c8
    menusel = #000000;#e0e0e0
    menuhot = #808000;#c8c8c8
    menuhotsel = #808000;#e0e0e0
    menuinactive = #7f0000;#c8c8c8

[popupmenu]
    _default_ = #000000;#c8c8c8
    menusel = #000000;#e0e0e0
    menutitle = #005f5f;#c8c8c8;bold

[buttonbar]
    hotkey = #808000;#c8c8c8;bold
    button = #000000;#c8c8c8

[statusbar]
    _default_ = #ffffff;#a0132f

[help]
    _default_ = #000000;#c8c8c8
    helpitalic = #808000;#c8c8c8;italic
    helpbold = #005f5f;#c8c8c8;bold
    helplink = #a0132f;#c8c8c8;underline
    helpslink = #000000;#a0132f
    helptitle = #005f5f;#c8c8c8;bold

[editor]
    _default_ = #000000;#ffffff
    editbold = #808000;#ffffff;bold
    editmarked = #000000;#e0e0e0
    editwhitespace = #7f0000;#ffffff
    editnonprintable = #7f0000;#ffffff
    editlinestate = #ffffff;#c8c8c8
    bookmark = #000000;#d00000
    bookmarkfound = #ffffff;#005000
    editrightmargin = #7f0000;#c8c8c8
    editbg = #000000;#ffffff
    editframe = #7f0000;#ffffff
    editframeactive = #ffffff;#ffffff
    editframedrag = #d00000;#ffffff

[viewer]
    _default_ = #000000;#ffffff
    viewbold = #808000;#ffffff;bold
    viewunderline = #a0132f;#ffffff;underline
    viewselected = #000000;#e0e0e0

[diffviewer]
    added = #ffffff;#005000
    changedline = #ffffff;#553d00
    changednew = #ffffff;#005000
    changed = #ffffff;#553d00
    removed = #000000;#8f1313
    error = #000000;#d00000
