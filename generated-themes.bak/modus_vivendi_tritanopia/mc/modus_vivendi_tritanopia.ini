[skin]
    description = modus_vivendi_tritanopia - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #ffffff;#000000
    selected = #ffffff;#303030
    marked = #feacd0;#000000;bold
    markselect = #feacd0;#303030;bold
    gauge = #ffffff;#505050
    input = #ffffff;#505050
    inputmark = #ffffff;#303030
    inputunchanged = #ff9070;#505050
    disabled = #ff9070;#505050
    reverse = #000000;#ffffff
    commandlinemark = #ffffff;#303030
    header = #79a8ff;#000000;bold
    shadow = #ff9070;#000000

[dialog]
    _default_ = #ffffff;#505050
    dfocus = #000000;#303030;bold
    dhotnormal = #feacd0;#505050
    dhotfocus = #feacd0;#303030;bold
    dtitle = #79a8ff;#505050;bold

[error]
    _default_ = #ffffff;#ff6740
    errdfocus = #000000;#feacd0;bold
    errdhotnormal = #feacd0;#ff6740
    errdhotfocus = #feacd0;#303030;bold
    errdtitle = #feacd0;#ff6740;bold

[filehighlight]
    directory = #4ae2ff;#000000;bold
    executable = #00d3d0;#000000;bold
    symlink = #ff7f86;#000000
    hardlink = #ff7f86;#000000
    stalelink = #ff6740;#000000
    device = #feacd0;#000000
    special = #ff7f86;#000000
    core = #ff6740;#000000
    temp = #ff9070;#000000
    archive = #88ca9f;#000000
    doc = #00d3d0;#000000
    source = #ff7f86;#000000
    media = #ff7f86;#000000
    graph = #ff7f86;#000000
    database = #79a8ff;#000000

[menu]
    _default_ = #ffffff;#505050
    menusel = #ffffff;#303030
    menuhot = #feacd0;#505050
    menuhotsel = #feacd0;#303030
    menuinactive = #ff9070;#505050

[popupmenu]
    _default_ = #ffffff;#505050
    menusel = #ffffff;#303030
    menutitle = #79a8ff;#505050;bold

[buttonbar]
    hotkey = #feacd0;#505050;bold
    button = #ffffff;#505050

[statusbar]
    _default_ = #000000;#ff7f86

[help]
    _default_ = #ffffff;#505050
    helpitalic = #feacd0;#505050;italic
    helpbold = #79a8ff;#505050;bold
    helplink = #ff7f86;#505050;underline
    helpslink = #ffffff;#ff7f86
    helptitle = #79a8ff;#505050;bold

[editor]
    _default_ = #ffffff;#000000
    editbold = #feacd0;#000000;bold
    editmarked = #ffffff;#303030
    editwhitespace = #ff9070;#000000
    editnonprintable = #ff9070;#000000
    editlinestate = #000000;#505050
    bookmark = #ffffff;#ff6740
    bookmarkfound = #000000;#a0e0a0
    editrightmargin = #ff9070;#505050
    editbg = #ffffff;#000000
    editframe = #ff9070;#000000
    editframeactive = #000000;#000000
    editframedrag = #ff6740;#000000

[viewer]
    _default_ = #ffffff;#000000
    viewbold = #feacd0;#000000;bold
    viewunderline = #ff7f86;#000000;underline
    viewselected = #ffffff;#303030

[diffviewer]
    added = #000000;#a0e0a0
    changedline = #000000;#efef80
    changednew = #000000;#a0e0a0
    changed = #000000;#efef80
    removed = #ffffff;#ffbfbf
    error = #ffffff;#ff6740
