[skin]
    description = nyxvamp-transparent - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #1e1e2e;#000000
    selected = #1e1e2e;#483d8b
    marked = #c2410c;#000000;bold
    markselect = #c2410c;#483d8b;bold
    gauge = #1e1e2e;#0d0d0d
    input = #1e1e2e;#0d0d0d
    inputmark = #1e1e2e;#483d8b
    inputunchanged = #5a5570;#0d0d0d
    disabled = #5a5570;#0d0d0d
    reverse = #000000;#1e1e2e
    commandlinemark = #1e1e2e;#483d8b
    header = #6b46c1;#000000;bold
    shadow = #5a5570;#000000

[dialog]
    _default_ = #1e1e2e;#0d0d0d
    dfocus = #000000;#483d8b;bold
    dhotnormal = #c2410c;#0d0d0d
    dhotfocus = #c2410c;#483d8b;bold
    dtitle = #6b46c1;#0d0d0d;bold

[error]
