    helptitle = #7a3e9d;#705697;bold

[editor]
    _default_ = #333333;#f5f5f5
    editbold = #b58900;#f5f5f5;bold
    editmarked = #333333;#c9d0d9
    editwhitespace = #aaaaaa;#f5f5f5
    editnonprintable = #aaaaaa;#f5f5f5
    editlinestate = #f5f5f5;#705697
    bookmark = #333333;#cd3131
    bookmarkfound = #f5f5f5;#448c27
    editrightmargin = #aaaaaa;#705697
    editbg = #333333;#f5f5f5
    editframe = #aaaaaa;#f5f5f5
