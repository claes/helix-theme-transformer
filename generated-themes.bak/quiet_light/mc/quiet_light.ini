[skin]
    description = quiet_light - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #333333;#f5f5f5
    selected = #333333;#c9d0d9
    marked = #b58900;#f5f5f5;bold
    markselect = #b58900;#c9d0d9;bold
    gauge = #333333;#705697
    input = #333333;#705697
    inputmark = #333333;#c9d0d9
    inputunchanged = #aaaaaa;#705697
    disabled = #aaaaaa;#705697
    reverse = #f5f5f5;#333333
    commandlinemark = #333333;#c9d0d9
    header = #7a3e9d;#f5f5f5;bold
    shadow = #aaaaaa;#f5f5f5

[dialog]
    _default_ = #333333;#705697
    dfocus = #f5f5f5;#c9d0d9;bold
    dhotnormal = #b58900;#705697
    dhotfocus = #b58900;#c9d0d9;bold
    dtitle = #7a3e9d;#705697;bold

[error]
    _default_ = #333333;#cd3131
    errdfocus = #f5f5f5;#b58900;bold
    errdhotnormal = #b58900;#cd3131
    errdhotfocus = #b58900;#c9d0d9;bold
    errdtitle = #b58900;#cd3131;bold

[filehighlight]
    directory = #aa3731;#f5f5f5;bold
    executable = #448c27;#f5f5f5;bold
    symlink = #9c5d27;#f5f5f5
    hardlink = #9c5d27;#f5f5f5
    stalelink = #cd3131;#f5f5f5
    device = #b58900;#f5f5f5
    special = #9c5d27;#f5f5f5
    core = #cd3131;#f5f5f5
    temp = #aaaaaa;#f5f5f5
    archive = #9c5d27;#f5f5f5
    doc = #448c27;#f5f5f5
    source = #4b69c6;#f5f5f5
    media = #4b69c6;#f5f5f5
    graph = #4b69c6;#f5f5f5
    database = #7a3e9d;#f5f5f5

[menu]
    _default_ = #333333;#705697
    menusel = #333333;#c9d0d9
    menuhot = #b58900;#705697
    menuhotsel = #b58900;#c9d0d9
    menuinactive = #aaaaaa;#705697

[popupmenu]
    _default_ = #333333;#705697
    menusel = #333333;#c9d0d9
    menutitle = #7a3e9d;#705697;bold

[buttonbar]
    hotkey = #b58900;#705697;bold
    button = #333333;#705697

[statusbar]
    _default_ = #f5f5f5;#9c5d27

[help]
    _default_ = #333333;#705697
    helpitalic = #b58900;#705697;italic
    helpbold = #7a3e9d;#705697;bold
    helplink = #9c5d27;#705697;underline
