[skin]
    description = vesper-transparent - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #ffffff;#ffffff
    selected = #ffffff;#666666
    marked = #ffc799;#ffffff;bold
    markselect = #ffc799;#666666;bold
    gauge = #ffffff;#1c1c1c
    input = #ffffff;#1c1c1c
    inputmark = #ffffff;#666666
    inputunchanged = #8b8b8b;#1c1c1c
    disabled = #8b8b8b;#1c1c1c
    reverse = #ffffff;#ffffff
    commandlinemark = #ffffff;#666666
    header = #ffc799;#ffffff;bold
    shadow = #8b8b8b;#ffffff

[dialog]
    _default_ = #ffffff;#1c1c1c
    dfocus = #ffffff;#666666;bold
    dhotnormal = #ffc799;#1c1c1c
    dhotfocus = #ffc799;#666666;bold
    dtitle = #ffc799;#1c1c1c;bold

[error]
    _default_ = #ffffff;#ff8080
    errdfocus = #ffffff;#ffc799;bold
    errdhotnormal = #ffc799;#ff8080
    errdhotfocus = #ffc799;#666666;bold
    errdtitle = #ffc799;#ff8080;bold

[filehighlight]
    directory = #ffc799;#ffffff;bold
    executable = #99ffe4;#ffffff;bold
    symlink = #ffc799;#ffffff
    hardlink = #ffc799;#ffffff
    stalelink = #ff8080;#ffffff
    device = #ffc799;#ffffff
    special = #ffc799;#ffffff
    core = #ff8080;#ffffff
    temp = #8b8b8b;#ffffff
    archive = #ffc799;#ffffff
    doc = #99ffe4;#ffffff
    source = #a0a0a0;#ffffff
    media = #a0a0a0;#ffffff
    graph = #a0a0a0;#ffffff
    database = #ffc799;#ffffff

[menu]
    _default_ = #ffffff;#1c1c1c
    menusel = #ffffff;#666666
    menuhot = #ffc799;#1c1c1c
    menuhotsel = #ffc799;#666666
    menuinactive = #8b8b8b;#1c1c1c

[popupmenu]
    _default_ = #ffffff;#1c1c1c
    menusel = #ffffff;#666666
    menutitle = #ffc799;#1c1c1c;bold

[buttonbar]
    hotkey = #ffc799;#1c1c1c;bold
    button = #ffffff;#1c1c1c

[statusbar]
    _default_ = #ffffff;#ffc799

[help]
    _default_ = #ffffff;#1c1c1c
    helpitalic = #ffc799;#1c1c1c;italic
    helpbold = #ffc799;#1c1c1c;bold
    helplink = #ffc799;#1c1c1c;underline
    helpslink = #ffffff;#ffc799
    helptitle = #ffc799;#1c1c1c;bold

[editor]
    _default_ = #ffffff;#ffffff
    editbold = #ffc799;#ffffff;bold
    editmarked = #ffffff;#666666
    editwhitespace = #8b8b8b;#ffffff
    editnonprintable = #8b8b8b;#ffffff
    editlinestate = #ffffff;#1c1c1c
    bookmark = #ffffff;#ff8080
    bookmarkfound = #ffffff;#99ffe4
    editrightmargin = #8b8b8b;#1c1c1c
    editbg = #ffffff;#ffffff
    editframe = #8b8b8b;#ffffff
    editframeactive = #ffffff;#ffffff
    editframedrag = #ff8080;#ffffff

[viewer]
    _default_ = #ffffff;#ffffff
    viewbold = #ffc799;#ffffff;bold
    viewunderline = #ffc799;#ffffff;underline
    viewselected = #ffffff;#666666

[diffviewer]
    added = #ffffff;#99ffe4
    changedline = #ffffff;#ffc799
    changednew = #ffffff;#99ffe4
    changed = #ffffff;#ffc799
    removed = #ffffff;#ff8080
    error = #ffffff;#ff8080
