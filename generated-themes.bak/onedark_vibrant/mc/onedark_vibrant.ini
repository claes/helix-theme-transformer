[skin]
    description = onedark_vibrant - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #e6efff;#282c34
    selected = #e6efff;#e455ff
    marked = #ffd93d;#282c34;bold
    markselect = #ffd93d;#e455ff;bold
    gauge = #e6efff;#21252b
    input = #e6efff;#21252b
    inputmark = #e6efff;#e455ff
    inputunchanged = #c5d1e4;#21252b
    disabled = #c5d1e4;#21252b
    reverse = #282c34;#e6efff
    commandlinemark = #e6efff;#e455ff
    header = #ffd93d;#282c34;bold
    shadow = #c5d1e4;#282c34

[dialog]
    _default_ = #e6efff;#21252b
    dfocus = #282c34;#e455ff;bold
    dhotnormal = #ffd93d;#21252b
    dhotfocus = #ffd93d;#e455ff;bold
    dtitle = #ffd93d;#21252b;bold

[error]
    _default_ = #e6efff;#ff6ba7
    errdfocus = #282c34;#ffd93d;bold
    errdhotnormal = #ffd93d;#ff6ba7
    errdhotfocus = #ffd93d;#e455ff;bold
    errdtitle = #ffd93d;#ff6ba7;bold

[filehighlight]
    directory = #3fb8ff;#282c34;bold
    executable = #6ee76e;#282c34;bold
    symlink = #2dd4da;#282c34
    hardlink = #2dd4da;#282c34
    stalelink = #ff6ba7;#282c34
    device = #ffd93d;#282c34
    special = #2dd4da;#282c34
    core = #ff6ba7;#282c34
    temp = #c5d1e4;#282c34
    archive = #ffd93d;#282c34
    doc = #6ee76e;#282c34
    source = #ff6ba7;#282c34
    media = #ff6ba7;#282c34
    graph = #ff6ba7;#282c34
    database = #ffd93d;#282c34

[menu]
    _default_ = #e6efff;#21252b
    menusel = #e6efff;#e455ff
    menuhot = #ffd93d;#21252b
    menuhotsel = #ffd93d;#e455ff
    menuinactive = #c5d1e4;#21252b

[popupmenu]
    _default_ = #e6efff;#21252b
    menusel = #e6efff;#e455ff
    menutitle = #ffd93d;#21252b;bold

[buttonbar]
    hotkey = #ffd93d;#21252b;bold
    button = #e6efff;#21252b

[statusbar]
    _default_ = #282c34;#2dd4da

[help]
    _default_ = #e6efff;#21252b
    helpitalic = #ffd93d;#21252b;italic
    helpbold = #ffd93d;#21252b;bold
    helplink = #2dd4da;#21252b;underline
    helpslink = #e6efff;#2dd4da
    helptitle = #ffd93d;#21252b;bold

[editor]
    _default_ = #e6efff;#282c34
    editbold = #ffd93d;#282c34;bold
    editmarked = #e6efff;#e455ff
    editwhitespace = #c5d1e4;#282c34
    editnonprintable = #c5d1e4;#282c34
    editlinestate = #282c34;#21252b
    bookmark = #e6efff;#ff6ba7
    bookmarkfound = #282c34;#6ee76e
    editrightmargin = #c5d1e4;#21252b
    editbg = #e6efff;#282c34
    editframe = #c5d1e4;#282c34
    editframeactive = #282c34;#282c34
    editframedrag = #ff6ba7;#282c34

[viewer]
    _default_ = #e6efff;#282c34
    viewbold = #ffd93d;#282c34;bold
    viewunderline = #2dd4da;#282c34;underline
    viewselected = #e6efff;#e455ff

[diffviewer]
    added = #282c34;#6ee76e
    changedline = #282c34;#3fb8ff
    changednew = #282c34;#6ee76e
    changed = #282c34;#3fb8ff
    removed = #e6efff;#ff6ba7
    error = #e6efff;#ff6ba7
