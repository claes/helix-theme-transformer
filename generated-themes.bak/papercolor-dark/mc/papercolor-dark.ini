[skin]
    description = papercolor-dark - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #444444;#eeeeee
    selected = #444444;#2c687a
    marked = #bcbcbc;#eeeeee;bold
    markselect = #bcbcbc;#2c687a;bold
    gauge = #444444;#005f87
    input = #444444;#005f87
    inputmark = #444444;#2c687a
    inputunchanged = #878787;#005f87
    disabled = #878787;#005f87
    reverse = #eeeeee;#444444
    commandlinemark = #444444;#2c687a
    header = #d70087;#eeeeee;bold
    shadow = #878787;#eeeeee

[dialog]
    _default_ = #444444;#005f87
    dfocus = #eeeeee;#2c687a;bold
    dhotnormal = #bcbcbc;#005f87
    dhotfocus = #bcbcbc;#2c687a;bold
    dtitle = #d70087;#005f87;bold

[error]
    _default_ = #444444;#d70000
    errdfocus = #eeeeee;#bcbcbc;bold
    errdhotnormal = #bcbcbc;#d70000
    errdhotfocus = #bcbcbc;#2c687a;bold
    errdtitle = #bcbcbc;#d70000;bold

[filehighlight]
    directory = #444444;#eeeeee;bold
    executable = #5f8700;#eeeeee;bold
    symlink = #3e999f;#eeeeee
    hardlink = #3e999f;#eeeeee
    stalelink = #d70000;#eeeeee
    device = #bcbcbc;#eeeeee
    special = #3e999f;#eeeeee
    core = #d70000;#eeeeee
    temp = #878787;#eeeeee
    archive = #d75f00;#eeeeee
    doc = #5f8700;#eeeeee
    source = #d70087;#eeeeee
    media = #d70087;#eeeeee
    graph = #d70087;#eeeeee
    database = #d70087;#eeeeee

[menu]
    _default_ = #444444;#005f87
    menusel = #444444;#2c687a
    menuhot = #bcbcbc;#005f87
    menuhotsel = #bcbcbc;#2c687a
    menuinactive = #878787;#005f87

[popupmenu]
    _default_ = #444444;#005f87
    menusel = #444444;#2c687a
    menutitle = #d70087;#005f87;bold

[buttonbar]
    hotkey = #bcbcbc;#005f87;bold
    button = #444444;#005f87

[statusbar]
    _default_ = #eeeeee;#3e999f

[help]
    _default_ = #444444;#005f87
    helpitalic = #bcbcbc;#005f87;italic
    helpbold = #d70087;#005f87;bold
    helplink = #3e999f;#005f87;underline
    helpslink = #444444;#3e999f
    helptitle = #d70087;#005f87;bold

[editor]
    _default_ = #444444;#eeeeee
    editbold = #bcbcbc;#eeeeee;bold
    editmarked = #444444;#2c687a
    editwhitespace = #878787;#eeeeee
    editnonprintable = #878787;#eeeeee
    editlinestate = #eeeeee;#005f87
    bookmark = #444444;#d70000
    bookmarkfound = #eeeeee;#008700
    editrightmargin = #878787;#005f87
    editbg = #444444;#eeeeee
    editframe = #878787;#eeeeee
    editframeactive = #eeeeee;#eeeeee
    editframedrag = #d70000;#eeeeee

[viewer]
    _default_ = #444444;#eeeeee
    viewbold = #bcbcbc;#eeeeee;bold
    viewunderline = #3e999f;#eeeeee;underline
    viewselected = #444444;#2c687a

[diffviewer]
    added = #eeeeee;#008700
    changedline = #eeeeee;#005faf
    changednew = #eeeeee;#008700
    changed = #eeeeee;#005faf
    removed = #444444;#af0000
    error = #444444;#d70000
