    editnonprintable = #ffffff;#000000
    editlinestate = #000000;#142743
    bookmark = #ffffff;#b65f5f
    bookmarkfound = #000000;#427a2d
    editrightmargin = #ffffff;#142743
    editbg = #ffffff;#000000
    editframe = #ffffff;#000000
    editframeactive = #000000;#000000
    editframedrag = #b65f5f;#000000

[viewer]
