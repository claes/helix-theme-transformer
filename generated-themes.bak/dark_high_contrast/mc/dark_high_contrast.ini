[skin]
    description = dark_high_contrast - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #ffffff;#000000
    selected = #ffffff;#ffffff
    marked = #f38518;#000000;bold
    markselect = #f38518;#ffffff;bold
    gauge = #ffffff;#142743
    input = #ffffff;#142743
    inputmark = #ffffff;#ffffff
    inputunchanged = #ffffff;#142743
    disabled = #ffffff;#142743
    reverse = #000000;#ffffff
    commandlinemark = #ffffff;#ffffff
    header = #4ec9b0;#000000;bold
    shadow = #ffffff;#000000

[dialog]
    _default_ = #ffffff;#142743
    dfocus = #000000;#ffffff;bold
    dhotnormal = #f38518;#142743
    dhotfocus = #f38518;#ffffff;bold
    dtitle = #4ec9b0;#142743;bold

[error]
    _default_ = #ffffff;#b65f5f
    errdfocus = #000000;#f38518;bold
    errdhotnormal = #f38518;#b65f5f
    errdhotfocus = #f38518;#ffffff;bold
    errdtitle = #f38518;#b65f5f;bold

[filehighlight]
    directory = #cedc84;#000000;bold
    executable = #ce9178;#000000;bold
    symlink = #f38518;#000000
    hardlink = #f38518;#000000
    stalelink = #b65f5f;#000000
    device = #f38518;#000000
    special = #f38518;#000000
    core = #b65f5f;#000000
    temp = #ffffff;#000000
    archive = #4ec9b0;#000000
    doc = #ce9178;#000000
    source = #66a4ff;#000000
    media = #66a4ff;#000000
    graph = #66a4ff;#000000
    database = #4ec9b0;#000000

[menu]
    _default_ = #ffffff;#142743
    menusel = #ffffff;#ffffff
    menuhot = #f38518;#142743
    menuhotsel = #f38518;#ffffff
    menuinactive = #ffffff;#142743

[popupmenu]
    _default_ = #ffffff;#142743
    menusel = #ffffff;#ffffff
    menutitle = #4ec9b0;#142743;bold

[buttonbar]
    hotkey = #f38518;#142743;bold
    button = #ffffff;#142743

[statusbar]
    _default_ = #000000;#f38518

[help]
    _default_ = #ffffff;#142743
    helpitalic = #f38518;#142743;italic
    helpbold = #4ec9b0;#142743;bold
    helplink = #f38518;#142743;underline
