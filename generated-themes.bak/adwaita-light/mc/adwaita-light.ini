[skin]
    description = adwaita-light - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #3d3846;#ffffff
    selected = #3d3846;#d3e4f9
    marked = #f5c211;#ffffff;bold
    markselect = #f5c211;#d3e4f9;bold
    gauge = #3d3846;#deddda
    input = #3d3846;#deddda
    inputmark = #3d3846;#d3e4f9
    inputunchanged = #b0afac;#deddda
    disabled = #b0afac;#deddda
    reverse = #ffffff;#3d3846
    commandlinemark = #3d3846;#d3e4f9
    header = #26a1a2;#ffffff;bold
    shadow = #b0afac;#ffffff

[dialog]
    _default_ = #3d3846;#deddda
    dfocus = #ffffff;#d3e4f9;bold
    dhotnormal = #f5c211;#deddda
    dhotfocus = #f5c211;#d3e4f9;bold
    dtitle = #26a1a2;#deddda;bold

[error]
    _default_ = #3d3846;#a51d2d
    errdfocus = #ffffff;#f5c211;bold
    errdhotnormal = #f5c211;#a51d2d
    errdhotfocus = #f5c211;#d3e4f9;bold
    errdtitle = #f5c211;#a51d2d;bold

[filehighlight]
    directory = #1c71d8;#ffffff;bold
    executable = #33b2a4;#ffffff;bold
    symlink = #26a1a2;#ffffff
    hardlink = #26a1a2;#ffffff
    stalelink = #a51d2d;#ffffff
    device = #f5c211;#ffffff
    special = #26a1a2;#ffffff
    core = #a51d2d;#ffffff
    temp = #b0afac;#ffffff
    archive = #218787;#ffffff
    doc = #33b2a4;#ffffff
    source = #e66100;#ffffff
    media = #e66100;#ffffff
    graph = #e66100;#ffffff
    database = #26a1a2;#ffffff

[menu]
    _default_ = #3d3846;#deddda
    menusel = #3d3846;#d3e4f9
    menuhot = #f5c211;#deddda
    menuhotsel = #f5c211;#d3e4f9
    menuinactive = #b0afac;#deddda

[popupmenu]
    _default_ = #3d3846;#deddda
    menusel = #3d3846;#d3e4f9
    menutitle = #26a1a2;#deddda;bold

[buttonbar]
    hotkey = #f5c211;#deddda;bold
    button = #3d3846;#deddda

[statusbar]
    _default_ = #ffffff;#26a1a2

[help]
    _default_ = #3d3846;#deddda
    helpitalic = #f5c211;#deddda;italic
    helpbold = #26a1a2;#deddda;bold
    helplink = #26a1a2;#deddda;underline
    helpslink = #3d3846;#26a1a2
    helptitle = #26a1a2;#deddda;bold

[editor]
    _default_ = #3d3846;#ffffff
    editbold = #f5c211;#ffffff;bold
    editmarked = #3d3846;#d3e4f9
    editwhitespace = #b0afac;#ffffff
    editnonprintable = #b0afac;#ffffff
    editlinestate = #ffffff;#deddda
    bookmark = #3d3846;#a51d2d
    bookmarkfound = #ffffff;#218787
    editrightmargin = #b0afac;#deddda
    editbg = #3d3846;#ffffff
    editframe = #b0afac;#ffffff
    editframeactive = #fcfcfc;#ffffff
    editframedrag = #a51d2d;#ffffff

[viewer]
    _default_ = #3d3846;#ffffff
    viewbold = #f5c211;#ffffff;bold
    viewunderline = #26a1a2;#ffffff;underline
    viewselected = #3d3846;#d3e4f9

[diffviewer]
    added = #ffffff;#218787
    changedline = #ffffff;#c64600
    changednew = #ffffff;#218787
    changed = #ffffff;#c64600
    removed = #3d3846;#e01b24
    error = #3d3846;#a51d2d
