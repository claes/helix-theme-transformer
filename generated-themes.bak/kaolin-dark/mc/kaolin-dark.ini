    editwhitespace = #545c5e;#18181b
    editnonprintable = #545c5e;#18181b
    editlinestate = #18181b;#222225
    bookmark = #adadb9;#cd5c60
    bookmarkfound = #18181b;#6fb593
    editrightmargin = #545c5e;#222225
    editbg = #adadb9;#18181b
    editframe = #545c5e;#18181b
