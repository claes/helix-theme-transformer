[skin]
    description = kaolin-dark - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #adadb9;#18181b
    selected = #adadb9;#2e403b
    marked = #dbac66;#18181b;bold
    markselect = #dbac66;#2e403b;bold
    gauge = #adadb9;#222225
    input = #adadb9;#222225
    inputmark = #adadb9;#2e403b
    inputunchanged = #545c5e;#222225
    disabled = #545c5e;#222225
    reverse = #18181b;#adadb9
    commandlinemark = #adadb9;#2e403b
    header = #cd9575;#18181b;bold
    shadow = #545c5e;#18181b

[dialog]
    _default_ = #adadb9;#222225
    dfocus = #18181b;#2e403b;bold
    dhotnormal = #dbac66;#222225
    dhotfocus = #dbac66;#2e403b;bold
    dtitle = #cd9575;#222225;bold

[error]
    _default_ = #adadb9;#cd5c60
    errdfocus = #18181b;#dbac66;bold
    errdhotnormal = #dbac66;#cd5c60
    errdhotfocus = #dbac66;#2e403b;bold
    errdtitle = #dbac66;#cd5c60;bold

[filehighlight]
    directory = #80bcb6;#18181b;bold
    executable = #4d9391;#18181b;bold
    symlink = #ab98b5;#18181b
    hardlink = #ab98b5;#18181b
    stalelink = #cd5c60;#18181b
    device = #dbac66;#18181b
    special = #ab98b5;#18181b
    core = #cd5c60;#18181b
    temp = #545c5e;#18181b
    archive = #80bcb6;#18181b
    doc = #4d9391;#18181b
    source = #4d9391;#18181b
    media = #4d9391;#18181b
    graph = #4d9391;#18181b
    database = #cd9575;#18181b

[menu]
    _default_ = #adadb9;#222225
    menusel = #adadb9;#2e403b
    menuhot = #dbac66;#222225
    menuhotsel = #dbac66;#2e403b
    menuinactive = #545c5e;#222225

[popupmenu]
    _default_ = #adadb9;#222225
    menusel = #adadb9;#2e403b
    menutitle = #cd9575;#222225;bold

[buttonbar]
    hotkey = #dbac66;#222225;bold
