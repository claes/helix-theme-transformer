[skin]
    description = onelight - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #282c34;#fafafa
    selected = #282c34;#e0e0e0
    marked = #ff6f00;#fafafa;bold
    markselect = #ff6f00;#e0e0e0;bold
    gauge = #282c34;#e0e0e0
    input = #282c34;#e0e0e0
    inputmark = #282c34;#e0e0e0
    inputunchanged = #5c6370;#e0e0e0
    disabled = #5c6370;#e0e0e0
    reverse = #fafafa;#282c34
    commandlinemark = #282c34;#e0e0e0
    header = #d35400;#fafafa;bold
    shadow = #5c6370;#fafafa

[dialog]
    _default_ = #282c34;#e0e0e0
    dfocus = #fafafa;#e0e0e0;bold
    dhotnormal = #ff6f00;#e0e0e0
    dhotfocus = #ff6f00;#e0e0e0;bold
    dtitle = #d35400;#e0e0e0;bold

[error]
    _default_ = #282c34;#d50000
    errdfocus = #fafafa;#ff6f00;bold
    errdhotnormal = #ff6f00;#d50000
    errdhotfocus = #ff6f00;#e0e0e0;bold
    errdtitle = #ff6f00;#d50000;bold

[filehighlight]
    directory = #0061ff;#fafafa;bold
    executable = #24a443;#fafafa;bold
    symlink = #651fff;#fafafa
    hardlink = #651fff;#fafafa
    stalelink = #d50000;#fafafa
    device = #ff6f00;#fafafa
    special = #651fff;#fafafa
    core = #d50000;#fafafa
    temp = #5c6370;#fafafa
    archive = #795548;#fafafa
    doc = #24a443;#fafafa
    source = #b500a9;#fafafa
    media = #b500a9;#fafafa
    graph = #b500a9;#fafafa
    database = #d35400;#fafafa

[menu]
    _default_ = #282c34;#e0e0e0
    menusel = #282c34;#e0e0e0
    menuhot = #ff6f00;#e0e0e0
    menuhotsel = #ff6f00;#e0e0e0
    menuinactive = #5c6370;#e0e0e0

[popupmenu]
    _default_ = #282c34;#e0e0e0
    menusel = #282c34;#e0e0e0
    menutitle = #d35400;#e0e0e0;bold

[buttonbar]
    hotkey = #ff6f00;#e0e0e0;bold
    button = #282c34;#e0e0e0

[statusbar]
    _default_ = #fafafa;#651fff

[help]
    _default_ = #282c34;#e0e0e0
    helpitalic = #ff6f00;#e0e0e0;italic
    helpbold = #d35400;#e0e0e0;bold
    helplink = #651fff;#e0e0e0;underline
    helpslink = #282c34;#651fff
    helptitle = #d35400;#e0e0e0;bold

[editor]
    _default_ = #282c34;#fafafa
    editbold = #ff6f00;#fafafa;bold
    editmarked = #282c34;#e0e0e0
    editwhitespace = #5c6370;#fafafa
    editnonprintable = #5c6370;#fafafa
    editlinestate = #fafafa;#e0e0e0
    bookmark = #282c34;#d50000
    bookmarkfound = #fafafa;#24a443
    editrightmargin = #5c6370;#e0e0e0
    editbg = #282c34;#fafafa
    editframe = #5c6370;#fafafa
    editframeactive = #fafafa;#fafafa
    editframedrag = #d50000;#fafafa

[viewer]
    _default_ = #282c34;#fafafa
    viewbold = #ff6f00;#fafafa;bold
    viewunderline = #651fff;#fafafa;underline
    viewselected = #282c34;#e0e0e0

[diffviewer]
    added = #fafafa;#24a443
    changedline = #fafafa;#0086c1
    changednew = #fafafa;#24a443
    changed = #fafafa;#0086c1
    removed = #282c34;#d50000
    error = #282c34;#d50000
