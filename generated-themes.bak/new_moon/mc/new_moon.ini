[skin]
    description = new_moon - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #d4d4d4;#2d2d2d
    selected = #d4d4d4;#3a3d41
    marked = #ffd479;#2d2d2d;bold
    markselect = #ffd479;#3a3d41;bold
    gauge = #d4d4d4;#007acc
    input = #d4d4d4;#007acc
    inputmark = #d4d4d4;#3a3d41
    inputunchanged = #777c85;#007acc
    disabled = #777c85;#007acc
    reverse = #2d2d2d;#d4d4d4
    commandlinemark = #d4d4d4;#3a3d41
    header = #6ab0f3;#2d2d2d;bold
    shadow = #777c85;#2d2d2d

[dialog]
    _default_ = #d4d4d4;#007acc
    dfocus = #2d2d2d;#3a3d41;bold
    dhotnormal = #ffd479;#007acc
    dhotfocus = #ffd479;#3a3d41;bold
    dtitle = #6ab0f3;#007acc;bold

[error]
    _default_ = #d4d4d4;#f2777a
    errdfocus = #2d2d2d;#ffd479;bold
    errdhotnormal = #ffd479;#f2777a
    errdhotfocus = #ffd479;#3a3d41;bold
    errdtitle = #ffd479;#f2777a;bold

[filehighlight]
    directory = #ffffff;#2d2d2d;bold
    executable = #92d192;#2d2d2d;bold
    symlink = #ffffff;#2d2d2d
    hardlink = #ffffff;#2d2d2d
    stalelink = #f2777a;#2d2d2d
    device = #ffd479;#2d2d2d
    special = #ffffff;#2d2d2d
    core = #f2777a;#2d2d2d
    temp = #777c85;#2d2d2d
    archive = #fca369;#2d2d2d
    doc = #92d192;#2d2d2d
    source = #ffeea6;#2d2d2d
    media = #ffeea6;#2d2d2d
    graph = #ffeea6;#2d2d2d
    database = #6ab0f3;#2d2d2d

[menu]
    _default_ = #d4d4d4;#007acc
    menusel = #d4d4d4;#3a3d41
    menuhot = #ffd479;#007acc
    menuhotsel = #ffd479;#3a3d41
    menuinactive = #777c85;#007acc

[popupmenu]
    _default_ = #d4d4d4;#007acc
    menusel = #d4d4d4;#3a3d41
    menutitle = #6ab0f3;#007acc;bold

[buttonbar]
    hotkey = #ffd479;#007acc;bold
    button = #d4d4d4;#007acc

[statusbar]
    _default_ = #2d2d2d;#ffffff

[help]
    _default_ = #d4d4d4;#007acc
    helpitalic = #ffd479;#007acc;italic
    helpbold = #6ab0f3;#007acc;bold
    helplink = #ffffff;#007acc;underline
    helpslink = #d4d4d4;#ffffff
    helptitle = #6ab0f3;#007acc;bold

[editor]
    _default_ = #d4d4d4;#2d2d2d
    editbold = #ffd479;#2d2d2d;bold
    editmarked = #d4d4d4;#3a3d41
    editwhitespace = #777c85;#2d2d2d
    editnonprintable = #777c85;#2d2d2d
    editlinestate = #2d2d2d;#007acc
    bookmark = #d4d4d4;#f2777a
    bookmarkfound = #2d2d2d;#92d192
    editrightmargin = #777c85;#007acc
    editbg = #d4d4d4;#2d2d2d
    editframe = #777c85;#2d2d2d
    editframeactive = #a6a6a6;#2d2d2d
    editframedrag = #f2777a;#2d2d2d

[viewer]
    _default_ = #d4d4d4;#2d2d2d
    viewbold = #ffd479;#2d2d2d;bold
    viewunderline = #ffffff;#2d2d2d;underline
    viewselected = #d4d4d4;#3a3d41

[diffviewer]
    added = #2d2d2d;#92d192
    changedline = #2d2d2d;#6ab0f3
    changednew = #2d2d2d;#92d192
    changed = #2d2d2d;#6ab0f3
    removed = #d4d4d4;#f2777a
    error = #d4d4d4;#f2777a
