    selected = #1a1512;#e5dfd0
    marked = #ba6836;#fffcef;bold
    markselect = #ba6836;#e5dfd0;bold
    gauge = #1a1512;#f2edde
    input = #1a1512;#f2edde
    inputmark = #1a1512;#e5dfd0
    inputunchanged = #b2a899;#f2edde
    disabled = #b2a899;#f2edde
    reverse = #fffcef;#1a1512
    commandlinemark = #1a1512;#e5dfd0
    header = #60a848;#fffcef;bold
    shadow = #b2a899;#fffcef

[dialog]
    _default_ = #1a1512;#f2edde
    dfocus = #fffcef;#e5dfd0;bold
    dhotnormal = #ba6836;#f2edde
    dhotfocus = #ba6836;#e5dfd0;bold
    dtitle = #60a848;#f2edde;bold

[error]
