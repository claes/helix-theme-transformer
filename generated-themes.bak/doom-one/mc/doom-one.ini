    inputmark = #bbc2cf;#3c4048
    inputunchanged = #5b6268;#282c34
    disabled = #5b6268;#282c34
    reverse = #282c34;#bbc2cf
    commandlinemark = #bbc2cf;#3c4048
    header = #ecbe7b;#282c34;bold
    shadow = #5b6268;#282c34

[dialog]
