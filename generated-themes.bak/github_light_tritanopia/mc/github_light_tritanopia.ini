[skin]
    description = github_light_tritanopia - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #57606a;#ffffff
    selected = #57606a;#ddf4ff
    marked = #9a6700;#ffffff;bold
    markselect = #9a6700;#ddf4ff;bold
    gauge = #57606a;#eaeef2
    input = #57606a;#eaeef2
    inputmark = #57606a;#ddf4ff
    inputunchanged = #57606a;#eaeef2
    disabled = #57606a;#eaeef2
    reverse = #ffffff;#57606a
    commandlinemark = #57606a;#ddf4ff
    header = #953800;#ffffff;bold
    shadow = #57606a;#ffffff

[dialog]
    _default_ = #57606a;#eaeef2
    dfocus = #ffffff;#ddf4ff;bold
    dhotnormal = #9a6700;#eaeef2
    dhotfocus = #9a6700;#ddf4ff;bold
    dtitle = #953800;#eaeef2;bold

[error]
    _default_ = #57606a;#cf222e
    errdfocus = #ffffff;#9a6700;bold
    errdhotnormal = #9a6700;#cf222e
    errdhotfocus = #9a6700;#ddf4ff;bold
    errdtitle = #9a6700;#cf222e;bold

[filehighlight]
    directory = #8250df;#ffffff;bold
    executable = #0a3069;#ffffff;bold
    symlink = #0a3069;#ffffff
    hardlink = #0a3069;#ffffff
    stalelink = #cf222e;#ffffff
    device = #9a6700;#ffffff
    special = #0a3069;#ffffff
    core = #cf222e;#ffffff
    temp = #57606a;#ffffff
    archive = #0550ae;#ffffff
    doc = #0a3069;#ffffff
    source = #cf222e;#ffffff
    media = #cf222e;#ffffff
    graph = #cf222e;#ffffff
    database = #953800;#ffffff

[menu]
    _default_ = #57606a;#eaeef2
    menusel = #57606a;#ddf4ff
    menuhot = #9a6700;#eaeef2
    menuhotsel = #9a6700;#ddf4ff
    menuinactive = #57606a;#eaeef2

[popupmenu]
    _default_ = #57606a;#eaeef2
    menusel = #57606a;#ddf4ff
    menutitle = #953800;#eaeef2;bold

[buttonbar]
    hotkey = #9a6700;#eaeef2;bold
    button = #57606a;#eaeef2

[statusbar]
    _default_ = #ffffff;#0a3069

[help]
    _default_ = #57606a;#eaeef2
    helpitalic = #9a6700;#eaeef2;italic
    helpbold = #953800;#eaeef2;bold
    helplink = #0a3069;#eaeef2;underline
    helpslink = #57606a;#0a3069
    helptitle = #953800;#eaeef2;bold

[editor]
    _default_ = #57606a;#ffffff
    editbold = #9a6700;#ffffff;bold
    editmarked = #57606a;#ddf4ff
    editwhitespace = #57606a;#ffffff
    editnonprintable = #57606a;#ffffff
    editlinestate = #ffffff;#eaeef2
    bookmark = #57606a;#cf222e
    bookmarkfound = #ffffff;#1a7f37
    editrightmargin = #57606a;#eaeef2
    editbg = #57606a;#ffffff
    editframe = #57606a;#ffffff
    editframeactive = #24292f;#ffffff
    editframedrag = #cf222e;#ffffff

[viewer]
    _default_ = #57606a;#ffffff
    viewbold = #9a6700;#ffffff;bold
    viewunderline = #0a3069;#ffffff;underline
    viewselected = #57606a;#ddf4ff

[diffviewer]
    added = #ffffff;#1a7f37
    changedline = #ffffff;#9a6700
    changednew = #ffffff;#1a7f37
    changed = #ffffff;#9a6700
    removed = #57606a;#cf222e
    error = #57606a;#cf222e
