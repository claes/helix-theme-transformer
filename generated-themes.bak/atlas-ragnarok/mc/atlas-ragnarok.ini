[skin]
    description = atlas-ragnarok - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #ffffff;#000000
    selected = #ffffff;#1e3a5f
    marked = #2563eb;#000000;bold
    markselect = #2563eb;#1e3a5f;bold
    gauge = #ffffff;#000000
    input = #ffffff;#000000
    inputmark = #ffffff;#1e3a5f
    inputunchanged = #505050;#000000
    disabled = #505050;#000000
    reverse = #000000;#ffffff
    commandlinemark = #ffffff;#1e3a5f
    header = #3b82f6;#000000;bold
    shadow = #505050;#000000

[dialog]
    _default_ = #ffffff;#000000
    dfocus = #000000;#1e3a5f;bold
    dhotnormal = #2563eb;#000000
    dhotfocus = #2563eb;#1e3a5f;bold
    dtitle = #3b82f6;#000000;bold

[error]
    _default_ = #ffffff;#ff8080
    errdfocus = #000000;#2563eb;bold
    errdhotnormal = #2563eb;#ff8080
    errdhotfocus = #2563eb;#1e3a5f;bold
    errdtitle = #2563eb;#ff8080;bold

[filehighlight]
    directory = #3b82f6;#000000;bold
    executable = #99ffe4;#000000;bold
    symlink = #93c5fd;#000000
    hardlink = #93c5fd;#000000
    stalelink = #ff8080;#000000
    device = #2563eb;#000000
    special = #93c5fd;#000000
    core = #ff8080;#000000
    temp = #505050;#000000
    archive = #2563eb;#000000
    doc = #99ffe4;#000000
    source = #a0a0a0;#000000
    media = #a0a0a0;#000000
    graph = #a0a0a0;#000000
    database = #3b82f6;#000000

[menu]
    _default_ = #ffffff;#000000
    menusel = #ffffff;#1e3a5f
    menuhot = #2563eb;#000000
    menuhotsel = #2563eb;#1e3a5f
    menuinactive = #505050;#000000

[popupmenu]
    _default_ = #ffffff;#000000
    menusel = #ffffff;#1e3a5f
    menutitle = #3b82f6;#000000;bold

[buttonbar]
    hotkey = #2563eb;#000000;bold
    button = #ffffff;#000000

[statusbar]
    _default_ = #000000;#93c5fd

[help]
    _default_ = #ffffff;#000000
    helpitalic = #2563eb;#000000;italic
    helpbold = #3b82f6;#000000;bold
    helplink = #93c5fd;#000000;underline
    helpslink = #ffffff;#93c5fd
    helptitle = #3b82f6;#000000;bold

[editor]
    _default_ = #ffffff;#000000
    editbold = #2563eb;#000000;bold
    editmarked = #ffffff;#1e3a5f
    editwhitespace = #505050;#000000
    editnonprintable = #505050;#000000
    editlinestate = #000000;#000000
    bookmark = #ffffff;#ff8080
    bookmarkfound = #000000;#99ffe4
    editrightmargin = #505050;#000000
    editbg = #ffffff;#000000
    editframe = #505050;#000000
    editframeactive = #000000;#000000
    editframedrag = #ff8080;#000000

[viewer]
    _default_ = #ffffff;#000000
    viewbold = #2563eb;#000000;bold
    viewunderline = #93c5fd;#000000;underline
    viewselected = #ffffff;#1e3a5f

[diffviewer]
    added = #000000;#99ffe4
    changedline = #000000;#60a5fa
    changednew = #000000;#99ffe4
    changed = #000000;#60a5fa
    removed = #ffffff;#ff8080
    error = #ffffff;#ff8080
