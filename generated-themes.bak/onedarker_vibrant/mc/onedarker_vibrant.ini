[skin]
    description = onedarker_vibrant - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #d5dae6;#16181a
    selected = #d5dae6;#d147ff
    marked = #e8d154;#16181a;bold
    markselect = #e8d154;#d147ff;bold
    gauge = #d5dae6;#252d30
    input = #d5dae6;#252d30
    inputmark = #d5dae6;#d147ff
    inputunchanged = #b4bcc8;#252d30
    disabled = #b4bcc8;#252d30
    reverse = #16181a;#d5dae6
    commandlinemark = #d5dae6;#d147ff
    header = #e8d154;#16181a;bold
    shadow = #b4bcc8;#16181a

[dialog]
    _default_ = #d5dae6;#252d30
    dfocus = #16181a;#d147ff;bold
    dhotnormal = #e8d154;#252d30
    dhotfocus = #e8d154;#d147ff;bold
    dtitle = #e8d154;#252d30;bold

[error]
    _default_ = #d5dae6;#ff5d8f
    errdfocus = #16181a;#e8d154;bold
    errdhotnormal = #e8d154;#ff5d8f
    errdhotfocus = #e8d154;#d147ff;bold
    errdtitle = #e8d154;#ff5d8f;bold

[filehighlight]
    directory = #2fa5f0;#16181a;bold
    executable = #5dd75d;#16181a;bold
    symlink = #1abde0;#16181a
    hardlink = #1abde0;#16181a
    stalelink = #ff5d8f;#16181a
    device = #e8d154;#16181a
    special = #1abde0;#16181a
    core = #ff5d8f;#16181a
    temp = #b4bcc8;#16181a
    archive = #e8d154;#16181a
    doc = #5dd75d;#16181a
    source = #ff5d8f;#16181a
    media = #ff5d8f;#16181a
    graph = #ff5d8f;#16181a
    database = #e8d154;#16181a

[menu]
    _default_ = #d5dae6;#252d30
    menusel = #d5dae6;#d147ff
    menuhot = #e8d154;#252d30
    menuhotsel = #e8d154;#d147ff
    menuinactive = #b4bcc8;#252d30

[popupmenu]
    _default_ = #d5dae6;#252d30
    menusel = #d5dae6;#d147ff
    menutitle = #e8d154;#252d30;bold

[buttonbar]
    hotkey = #e8d154;#252d30;bold
    button = #d5dae6;#252d30

[statusbar]
    _default_ = #16181a;#1abde0

[help]
    _default_ = #d5dae6;#252d30
    helpitalic = #e8d154;#252d30;italic
    helpbold = #e8d154;#252d30;bold
    helplink = #1abde0;#252d30;underline
    helpslink = #d5dae6;#1abde0
    helptitle = #e8d154;#252d30;bold

[editor]
    _default_ = #d5dae6;#16181a
    editbold = #e8d154;#16181a;bold
    editmarked = #d5dae6;#d147ff
    editwhitespace = #b4bcc8;#16181a
    editnonprintable = #b4bcc8;#16181a
    editlinestate = #16181a;#252d30
    bookmark = #d5dae6;#ff5d8f
    bookmarkfound = #16181a;#5dd75d
    editrightmargin = #b4bcc8;#252d30
    editbg = #d5dae6;#16181a
    editframe = #b4bcc8;#16181a
    editframeactive = #16181a;#16181a
    editframedrag = #ff5d8f;#16181a

[viewer]
    _default_ = #d5dae6;#16181a
    viewbold = #e8d154;#16181a;bold
    viewunderline = #1abde0;#16181a;underline
    viewselected = #d5dae6;#d147ff

[diffviewer]
    added = #16181a;#5dd75d
    changedline = #16181a;#2fa5f0
    changednew = #16181a;#5dd75d
    changed = #16181a;#2fa5f0
    removed = #d5dae6;#ff5d8f
    error = #d5dae6;#ff5d8f
