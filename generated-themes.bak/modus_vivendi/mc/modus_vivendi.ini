[skin]
    description = modus_vivendi - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #ffffff;#000000
    selected = #ffffff;#303030
    marked = #efef00;#000000;bold
    markselect = #efef00;#303030;bold
    gauge = #ffffff;#505050
    input = #ffffff;#505050
    inputmark = #ffffff;#303030
    inputunchanged = #989898;#505050
    disabled = #989898;#505050
    reverse = #000000;#ffffff
    commandlinemark = #ffffff;#303030
    header = #6ae4b9;#000000;bold
    shadow = #989898;#000000

[dialog]
    _default_ = #ffffff;#505050
    dfocus = #000000;#303030;bold
    dhotnormal = #efef00;#505050
    dhotfocus = #efef00;#303030;bold
    dtitle = #6ae4b9;#505050;bold

[error]
    _default_ = #ffffff;#ff5f5f
    errdfocus = #000000;#efef00;bold
    errdhotnormal = #efef00;#ff5f5f
    errdhotfocus = #efef00;#303030;bold
    errdtitle = #efef00;#ff5f5f;bold

[filehighlight]
    directory = #feacd0;#000000;bold
    executable = #79a8ff;#000000;bold
    symlink = #ff7f86;#000000
    hardlink = #ff7f86;#000000
    stalelink = #ff5f5f;#000000
    device = #efef00;#000000
    special = #ff7f86;#000000
    core = #ff5f5f;#000000
    temp = #989898;#000000
    archive = #00bcff;#000000
    doc = #79a8ff;#000000
    source = #b6a0ff;#000000
    media = #b6a0ff;#000000
    graph = #b6a0ff;#000000
    database = #6ae4b9;#000000

[menu]
    _default_ = #ffffff;#505050
    menusel = #ffffff;#303030
    menuhot = #efef00;#505050
    menuhotsel = #efef00;#303030
    menuinactive = #989898;#505050

[popupmenu]
    _default_ = #ffffff;#505050
    menusel = #ffffff;#303030
    menutitle = #6ae4b9;#505050;bold

[buttonbar]
    hotkey = #efef00;#505050;bold
    button = #ffffff;#505050

[statusbar]
    _default_ = #000000;#ff7f86

[help]
    _default_ = #ffffff;#505050
    helpitalic = #efef00;#505050;italic
    helpbold = #6ae4b9;#505050;bold
    helplink = #ff7f86;#505050;underline
    helpslink = #ffffff;#ff7f86
    helptitle = #6ae4b9;#505050;bold

[editor]
    _default_ = #ffffff;#000000
    editbold = #efef00;#000000;bold
    editmarked = #ffffff;#303030
    editwhitespace = #989898;#000000
    editnonprintable = #989898;#000000
    editlinestate = #000000;#505050
    bookmark = #ffffff;#ff5f5f
    bookmarkfound = #000000;#a0e0a0
    editrightmargin = #989898;#505050
    editbg = #ffffff;#000000
    editframe = #989898;#000000
    editframeactive = #000000;#000000
    editframedrag = #ff5f5f;#000000

[viewer]
    _default_ = #ffffff;#000000
    viewbold = #efef00;#000000;bold
    viewunderline = #ff7f86;#000000;underline
    viewselected = #ffffff;#303030

[diffviewer]
    added = #000000;#a0e0a0
    changedline = #000000;#efef80
    changednew = #000000;#a0e0a0
    changed = #000000;#efef80
    removed = #ffffff;#ffbfbf
    error = #ffffff;#ff5f5f
