[skin]
    description = akari-night - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #e6ded3;#25231f
    selected = #e6ded3;#51422e
    marked = #e26a3b;#25231f;bold
    markselect = #e26a3b;#51422e;bold
    gauge = #e6ded3;#323333
    input = #e6ded3;#323333
    inputmark = #e6ded3;#51422e
    inputunchanged = #9babb9;#323333
    disabled = #9babb9;#323333
    reverse = #25231f;#e6ded3
    commandlinemark = #e6ded3;#51422e
    header = #d4a05a;#25231f;bold
    shadow = #9babb9;#25231f

[dialog]
    _default_ = #e6ded3;#323333
    dfocus = #25231f;#51422e;bold
    dhotnormal = #e26a3b;#323333
    dhotfocus = #e26a3b;#51422e;bold
    dtitle = #d4a05a;#323333;bold

[error]
    _default_ = #e6ded3;#d25046
    errdfocus = #25231f;#e26a3b;bold
    errdhotnormal = #e26a3b;#d25046
    errdhotfocus = #e26a3b;#51422e;bold
    errdtitle = #e26a3b;#d25046;bold

[filehighlight]
    directory = #8e7ba0;#25231f;bold
    executable = #7faf6a;#25231f;bold
    symlink = #e4c397;#25231f
    hardlink = #e4c397;#25231f
    stalelink = #d25046;#25231f
    device = #e26a3b;#25231f
    special = #e4c397;#25231f
    core = #d25046;#25231f
    temp = #9babb9;#25231f
    archive = #8ca6a1;#25231f
    doc = #7faf6a;#25231f
    source = #e26a3b;#25231f
    media = #e26a3b;#25231f
    graph = #e26a3b;#25231f
    database = #d4a05a;#25231f

[menu]
    _default_ = #e6ded3;#323333
    menusel = #e6ded3;#51422e
    menuhot = #e26a3b;#323333
    menuhotsel = #e26a3b;#51422e
    menuinactive = #9babb9;#323333

[popupmenu]
    _default_ = #e6ded3;#323333
    menusel = #e6ded3;#51422e
    menutitle = #d4a05a;#323333;bold

[buttonbar]
    hotkey = #e26a3b;#323333;bold
    button = #e6ded3;#323333

[statusbar]
    _default_ = #25231f;#e4c397

[help]
    _default_ = #e6ded3;#323333
    helpitalic = #e26a3b;#323333;italic
    helpbold = #d4a05a;#323333;bold
    helplink = #e4c397;#323333;underline
    helpslink = #e6ded3;#e4c397
    helptitle = #d4a05a;#323333;bold

[editor]
    _default_ = #e6ded3;#25231f
    editbold = #e26a3b;#25231f;bold
    editmarked = #e6ded3;#51422e
    editwhitespace = #9babb9;#25231f
    editnonprintable = #9babb9;#25231f
    editlinestate = #25231f;#323333
    bookmark = #e6ded3;#d25046
    bookmarkfound = #25231f;#7faf6a
    editrightmargin = #9babb9;#323333
    editbg = #e6ded3;#25231f
    editframe = #9babb9;#25231f
    editframeactive = #25231f;#25231f
    editframedrag = #d25046;#25231f

[viewer]
