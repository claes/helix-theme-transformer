[skin]
    description = eiffel - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #000000;#ffffff
    selected = #000000;#c3dcff
    marked = #a0785a;#ffffff;bold
    markselect = #a0785a;#c3dcff;bold
    gauge = #000000;#ededed
    input = #000000;#ededed
    inputmark = #000000;#c3dcff
    inputunchanged = #00b418;#ededed
    disabled = #00b418;#ededed
    reverse = #ffffff;#000000
    commandlinemark = #000000;#c3dcff
    header = #a0785a;#ffffff;bold
    shadow = #00b418;#ffffff

[dialog]
    _default_ = #000000;#ededed
    dfocus = #ffffff;#c3dcff;bold
    dhotnormal = #a0785a;#ededed
    dhotfocus = #a0785a;#c3dcff;bold
    dtitle = #a0785a;#ededed;bold

[error]
    _default_ = #000000;#990000
    errdfocus = #ffffff;#a0785a;bold
    errdhotnormal = #a0785a;#990000
    errdhotfocus = #a0785a;#c3dcff;bold
    errdtitle = #a0785a;#990000;bold

[filehighlight]
    directory = #0206ff;#ffffff;bold
    executable = #d80800;#ffffff;bold
    symlink = #1c02ff;#ffffff
    hardlink = #1c02ff;#ffffff
    stalelink = #990000;#ffffff
    device = #a0785a;#ffffff
    special = #1c02ff;#ffffff
    core = #990000;#ffffff
    temp = #00b418;#ffffff
    archive = #cd0000;#ffffff
    doc = #d80800;#ffffff
    source = #000000;#ffffff
    media = #000000;#ffffff
    graph = #000000;#ffffff
    database = #a0785a;#ffffff

[menu]
    _default_ = #000000;#ededed
    menusel = #000000;#c3dcff
    menuhot = #a0785a;#ededed
    menuhotsel = #a0785a;#c3dcff
    menuinactive = #00b418;#ededed

[popupmenu]
    _default_ = #000000;#ededed
    menusel = #000000;#c3dcff
    menutitle = #a0785a;#ededed;bold

[buttonbar]
    hotkey = #a0785a;#ededed;bold
    button = #000000;#ededed

[statusbar]
    _default_ = #ffffff;#1c02ff

[help]
    _default_ = #000000;#ededed
    helpitalic = #a0785a;#ededed;italic
    helpbold = #a0785a;#ededed;bold
    helplink = #1c02ff;#ededed;underline
    helpslink = #000000;#1c02ff
    helptitle = #a0785a;#ededed;bold

[editor]
    _default_ = #000000;#ffffff
    editbold = #a0785a;#ffffff;bold
    editmarked = #000000;#c3dcff
    editwhitespace = #00b418;#ffffff
    editnonprintable = #00b418;#ffffff
    editlinestate = #ffffff;#ededed
    bookmark = #000000;#990000
    bookmarkfound = #ffffff;#00b418
    editrightmargin = #00b418;#ededed
    editbg = #000000;#ffffff
    editframe = #00b418;#ffffff
    editframeactive = #000000;#ffffff
    editframedrag = #990000;#ffffff

[viewer]
    _default_ = #000000;#ffffff
    viewbold = #a0785a;#ffffff;bold
    viewunderline = #1c02ff;#ffffff;underline
    viewselected = #000000;#c3dcff

[diffviewer]
    added = #ffffff;#00b418
    changedline = #ffffff;#0000a2
    changednew = #ffffff;#00b418
    changed = #ffffff;#0000a2
    removed = #000000;#990000
    error = #000000;#990000
