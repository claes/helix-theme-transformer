[skin]
    description = onedark - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #abb2bf;#282c34
    selected = #abb2bf;#3b4048
    marked = #e5c07b;#282c34;bold
    markselect = #e5c07b;#3b4048;bold
    gauge = #abb2bf;#2c323c
    input = #abb2bf;#2c323c
    inputmark = #abb2bf;#3b4048
    inputunchanged = #5c6370;#2c323c
    disabled = #5c6370;#2c323c
    reverse = #282c34;#abb2bf
    commandlinemark = #abb2bf;#3b4048
    header = #e5c07b;#282c34;bold
    shadow = #5c6370;#282c34

[dialog]
    _default_ = #abb2bf;#2c323c
    dfocus = #282c34;#3b4048;bold
    dhotnormal = #e5c07b;#2c323c
    dhotfocus = #e5c07b;#3b4048;bold
    dtitle = #e5c07b;#2c323c;bold

[error]
    _default_ = #abb2bf;#e06c75
    errdfocus = #282c34;#e5c07b;bold
    errdhotnormal = #e5c07b;#e06c75
    errdhotfocus = #e5c07b;#3b4048;bold
    errdtitle = #e5c07b;#e06c75;bold

[filehighlight]
