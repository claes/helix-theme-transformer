    special = #61afef;#282c34
    core = #e06c75;#282c34
    temp = #5c6370;#282c34
    archive = #d19a66;#282c34
    doc = #98c379;#282c34
    source = #e06c75;#282c34
    media = #e06c75;#282c34
    graph = #e06c75;#282c34
    database = #e5c07b;#282c34

[menu]
    _default_ = #abb2bf;#2c323c
    menusel = #abb2bf;#3b4048
    menuhot = #e5c07b;#2c323c
