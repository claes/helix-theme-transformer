[skin]
    description = dark-synthwave - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #ffffff;#000000
    selected = #ffffff;#001069
    marked = #ffab40;#000000;bold
    markselect = #ffab40;#001069;bold
    gauge = #ffffff;#000000
    input = #ffffff;#000000
    inputmark = #ffffff;#001069
    inputunchanged = #848bbd;#000000
    disabled = #848bbd;#000000
    reverse = #000000;#ffffff
    commandlinemark = #ffffff;#001069
    header = #fe4450;#000000;bold
    shadow = #848bbd;#000000

[dialog]
    _default_ = #ffffff;#000000
    dfocus = #000000;#001069;bold
    dhotnormal = #ffab40;#000000
    dhotfocus = #ffab40;#001069;bold
    dtitle = #fe4450;#000000;bold

[error]
    _default_ = #ffffff;#ff5252
    errdfocus = #000000;#ffab40;bold
    errdhotnormal = #ffab40;#ff5252
    errdhotfocus = #ffab40;#001069;bold
    errdtitle = #ffab40;#ff5252;bold

[filehighlight]
    directory = #36f9f6;#000000;bold
    executable = #ff8b39;#000000;bold
    symlink = #72f1b8;#000000
    hardlink = #72f1b8;#000000
    stalelink = #ff5252;#000000
    device = #ffab40;#000000
    special = #72f1b8;#000000
    core = #ff5252;#000000
    temp = #848bbd;#000000
    archive = #f97e72;#000000
    doc = #ff8b39;#000000
    source = #fede5d;#000000
    media = #fede5d;#000000
    graph = #fede5d;#000000
    database = #fe4450;#000000

[menu]
    _default_ = #ffffff;#000000
    menusel = #ffffff;#001069
    menuhot = #ffab40;#000000
    menuhotsel = #ffab40;#001069
    menuinactive = #848bbd;#000000

[popupmenu]
    _default_ = #ffffff;#000000
    menusel = #ffffff;#001069
    menutitle = #fe4450;#000000;bold

[buttonbar]
    hotkey = #ffab40;#000000;bold
    button = #ffffff;#000000

[statusbar]
    _default_ = #000000;#72f1b8

[help]
    _default_ = #ffffff;#000000
    helpitalic = #ffab40;#000000;italic
    helpbold = #fe4450;#000000;bold
    helplink = #72f1b8;#000000;underline
    helpslink = #ffffff;#72f1b8
    helptitle = #fe4450;#000000;bold

[editor]
    _default_ = #ffffff;#000000
    editbold = #ffab40;#000000;bold
    editmarked = #ffffff;#001069
    editwhitespace = #848bbd;#000000
    editnonprintable = #848bbd;#000000
    editlinestate = #000000;#000000
    bookmark = #ffffff;#ff5252
    bookmarkfound = #000000;#ff8b39
    editrightmargin = #848bbd;#000000
    editbg = #ffffff;#000000
    editframe = #848bbd;#000000
    editframeactive = #ffffff;#000000
    editframedrag = #ff5252;#000000

[viewer]
    _default_ = #ffffff;#000000
    viewbold = #ffab40;#000000;bold
    viewunderline = #72f1b8;#000000;underline
    viewselected = #ffffff;#001069

[diffviewer]
    added = #000000;#ff8b39
    changedline = #000000;#ffab40
    changednew = #000000;#ff8b39
    changed = #000000;#ffab40
    removed = #ffffff;#ff5252
    error = #ffffff;#ff5252
