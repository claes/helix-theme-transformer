[skin]
    description = seoul256-light-soft - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #14161b;#d0d0d0
    selected = #14161b;#d7d7af
    marked = #ffd787;#d0d0d0;bold
    markselect = #ffd787;#d7d7af;bold
    gauge = #14161b;#d7d7af
    input = #14161b;#d7d7af
    inputmark = #14161b;#d7d7af
    inputunchanged = #5f875f;#d7d7af
    disabled = #5f875f;#d7d7af
    reverse = #d0d0d0;#14161b
    commandlinemark = #14161b;#d7d7af
    header = #875f00;#d0d0d0;bold
    shadow = #5f875f;#d0d0d0

[dialog]
    _default_ = #14161b;#d7d7af
    dfocus = #d0d0d0;#d7d7af;bold
    dhotnormal = #ffd787;#d7d7af
    dhotfocus = #ffd787;#d7d7af;bold
    dtitle = #875f00;#d7d7af;bold

[error]
    _default_ = #14161b;#d70000
    errdfocus = #d0d0d0;#ffd787;bold
    errdhotnormal = #ffd787;#d70000
    errdhotfocus = #ffd787;#d7d7af;bold
    errdtitle = #ffd787;#d70000;bold

[filehighlight]
    directory = #5f5f00;#d0d0d0;bold
    executable = #008787;#d0d0d0;bold
    symlink = #5f5f00;#d0d0d0
    hardlink = #5f5f00;#d0d0d0
    stalelink = #d70000;#d0d0d0
    device = #ffd787;#d0d0d0
    special = #5f5f00;#d0d0d0
    core = #d70000;#d0d0d0
    temp = #5f875f;#d0d0d0
    archive = #875f5f;#d0d0d0
    doc = #008787;#d0d0d0
    source = #d75f87;#d0d0d0
    media = #d75f87;#d0d0d0
    graph = #d75f87;#d0d0d0
    database = #875f00;#d0d0d0

[menu]
    _default_ = #14161b;#d7d7af
    menusel = #14161b;#d7d7af
    menuhot = #ffd787;#d7d7af
    menuhotsel = #ffd787;#d7d7af
    menuinactive = #5f875f;#d7d7af

[popupmenu]
    _default_ = #14161b;#d7d7af
    menusel = #14161b;#d7d7af
    menutitle = #875f00;#d7d7af;bold

[buttonbar]
    hotkey = #ffd787;#d7d7af;bold
    button = #14161b;#d7d7af

[statusbar]
    _default_ = #d0d0d0;#5f5f00

[help]
    _default_ = #14161b;#d7d7af
    helpitalic = #ffd787;#d7d7af;italic
    helpbold = #875f00;#d7d7af;bold
    helplink = #5f5f00;#d7d7af;underline
    helpslink = #14161b;#5f5f00
    helptitle = #875f00;#d7d7af;bold

[editor]
    _default_ = #14161b;#d0d0d0
    editbold = #ffd787;#d0d0d0;bold
    editmarked = #14161b;#d7d7af
    editwhitespace = #5f875f;#d0d0d0
    editnonprintable = #5f875f;#d0d0d0
    editlinestate = #d0d0d0;#d7d7af
    bookmark = #14161b;#d70000
    bookmarkfound = #d0d0d0;#87af87
    editrightmargin = #5f875f;#d7d7af
    editbg = #14161b;#d0d0d0
    editframe = #5f875f;#d0d0d0
    editframeactive = #3a3a3a;#d0d0d0
    editframedrag = #d70000;#d0d0d0

[viewer]
    _default_ = #14161b;#d0d0d0
    viewbold = #ffd787;#d0d0d0;bold
    viewunderline = #5f5f00;#d0d0d0;underline
    viewselected = #14161b;#d7d7af

[diffviewer]
    added = #d0d0d0;#87af87
    changedline = #d0d0d0;#5f87d7
    changednew = #d0d0d0;#87af87
    changed = #d0d0d0;#5f87d7
    removed = #14161b;#d7005f
    error = #14161b;#d70000
