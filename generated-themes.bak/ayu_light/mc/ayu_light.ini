    helptitle = #399ee6;#e7eaed;bold

[editor]
    _default_ = #5c6166;#fafafa
    editbold = #ffaa33;#fafafa;bold
    editmarked = #5c6166;#d8d8d7
    editwhitespace = #828c9a;#fafafa
    editnonprintable = #828c9a;#fafafa
    editlinestate = #fafafa;#e7eaed
    bookmark = #5c6166;#f07171
    bookmarkfound = #fafafa;#86b300
    editrightmargin = #828c9a;#e7eaed
    editbg = #5c6166;#fafafa
    editframe = #828c9a;#fafafa
