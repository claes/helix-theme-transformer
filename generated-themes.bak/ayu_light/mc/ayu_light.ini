[skin]
    description = ayu_light - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #5c6166;#fafafa
    selected = #5c6166;#d8d8d7
    marked = #ffaa33;#fafafa;bold
    markselect = #ffaa33;#d8d8d7;bold
    gauge = #5c6166;#e7eaed
    input = #5c6166;#e7eaed
    inputmark = #5c6166;#d8d8d7
    inputunchanged = #828c9a;#e7eaed
    disabled = #828c9a;#e7eaed
    reverse = #fafafa;#5c6166
    commandlinemark = #5c6166;#d8d8d7
    header = #399ee6;#fafafa;bold
    shadow = #828c9a;#fafafa

[dialog]
    _default_ = #5c6166;#e7eaed
    dfocus = #fafafa;#d8d8d7;bold
    dhotnormal = #ffaa33;#e7eaed
    dhotfocus = #ffaa33;#d8d8d7;bold
    dtitle = #399ee6;#e7eaed;bold

[error]
    _default_ = #5c6166;#f07171
    errdfocus = #fafafa;#ffaa33;bold
    errdhotnormal = #ffaa33;#f07171
    errdhotfocus = #ffaa33;#d8d8d7;bold
    errdtitle = #ffaa33;#f07171;bold

[filehighlight]
    directory = #ffaa33;#fafafa;bold
    executable = #86b300;#fafafa;bold
    symlink = #fa8d3e;#fafafa
    hardlink = #fa8d3e;#fafafa
    stalelink = #f07171;#fafafa
    device = #ffaa33;#fafafa
    special = #fa8d3e;#fafafa
    core = #f07171;#fafafa
    temp = #828c9a;#fafafa
    archive = #a37acc;#fafafa
    doc = #86b300;#fafafa
    source = #fa8d3e;#fafafa
    media = #fa8d3e;#fafafa
    graph = #fa8d3e;#fafafa
    database = #399ee6;#fafafa

[menu]
    _default_ = #5c6166;#e7eaed
    menusel = #5c6166;#d8d8d7
    menuhot = #ffaa33;#e7eaed
    menuhotsel = #ffaa33;#d8d8d7
    menuinactive = #828c9a;#e7eaed

[popupmenu]
    _default_ = #5c6166;#e7eaed
    menusel = #5c6166;#d8d8d7
    menutitle = #399ee6;#e7eaed;bold

[buttonbar]
    hotkey = #ffaa33;#e7eaed;bold
    button = #5c6166;#e7eaed

[statusbar]
    _default_ = #fafafa;#fa8d3e

[help]
    _default_ = #5c6166;#e7eaed
    helpitalic = #ffaa33;#e7eaed;italic
    helpbold = #399ee6;#e7eaed;bold
    helplink = #fa8d3e;#e7eaed;underline
