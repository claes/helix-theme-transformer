    viewbold = #ffaa33;#fafafa;bold
    viewunderline = #fa8d3e;#fafafa;underline
    viewselected = #5c6166;#d8d8d7

[diffviewer]
    added = #fafafa;#86b300
    changedline = #fafafa;#ffaa33
    changednew = #fafafa;#86b300
    changed = #fafafa;#ffaa33
    removed = #5c6166;#f07171
    error = #5c6166;#f07171
