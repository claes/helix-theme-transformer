[skin]
    description = seoul256-light - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #14161b;#dadada
    selected = #14161b;#d7d7af
    marked = #ffd787;#dadada;bold
    markselect = #ffd787;#d7d7af;bold
    gauge = #14161b;#d7d7af
    input = #14161b;#d7d7af
    inputmark = #14161b;#d7d7af
    inputunchanged = #5f875f;#d7d7af
    disabled = #5f875f;#d7d7af
    reverse = #dadada;#14161b
    commandlinemark = #14161b;#d7d7af
    header = #875f00;#dadada;bold
    shadow = #5f875f;#dadada

[dialog]
    _default_ = #14161b;#d7d7af
    dfocus = #dadada;#d7d7af;bold
    dhotnormal = #ffd787;#d7d7af
    dhotfocus = #ffd787;#d7d7af;bold
    dtitle = #875f00;#d7d7af;bold

[error]
    _default_ = #14161b;#d70000
    errdfocus = #dadada;#ffd787;bold
    errdhotnormal = #ffd787;#d70000
    errdhotfocus = #ffd787;#d7d7af;bold
    errdtitle = #ffd787;#d70000;bold

[filehighlight]
    directory = #5f5f00;#dadada;bold
    executable = #008787;#dadada;bold
    symlink = #5f5f00;#dadada
    hardlink = #5f5f00;#dadada
    stalelink = #d70000;#dadada
    device = #ffd787;#dadada
    special = #5f5f00;#dadada
    core = #d70000;#dadada
    temp = #5f875f;#dadada
    archive = #875f5f;#dadada
    doc = #008787;#dadada
    source = #d75f87;#dadada
    media = #d75f87;#dadada
    graph = #d75f87;#dadada
    database = #875f00;#dadada

[menu]
    _default_ = #14161b;#d7d7af
    menusel = #14161b;#d7d7af
    menuhot = #ffd787;#d7d7af
    menuhotsel = #ffd787;#d7d7af
    menuinactive = #5f875f;#d7d7af

[popupmenu]
    _default_ = #14161b;#d7d7af
    menusel = #14161b;#d7d7af
    menutitle = #875f00;#d7d7af;bold

[buttonbar]
    hotkey = #ffd787;#d7d7af;bold
    button = #14161b;#d7d7af

[statusbar]
    _default_ = #dadada;#5f5f00

[help]
    _default_ = #14161b;#d7d7af
    helpitalic = #ffd787;#d7d7af;italic
    helpbold = #875f00;#d7d7af;bold
    helplink = #5f5f00;#d7d7af;underline
    helpslink = #14161b;#5f5f00
    helptitle = #875f00;#d7d7af;bold

[editor]
    _default_ = #14161b;#dadada
    editbold = #ffd787;#dadada;bold
    editmarked = #14161b;#d7d7af
    editwhitespace = #5f875f;#dadada
    editnonprintable = #5f875f;#dadada
    editlinestate = #dadada;#d7d7af
    bookmark = #14161b;#d70000
    bookmarkfound = #dadada;#87af87
    editrightmargin = #5f875f;#d7d7af
    editbg = #14161b;#dadada
    editframe = #5f875f;#dadada
    editframeactive = #3a3a3a;#dadada
    editframedrag = #d70000;#dadada

[viewer]
    _default_ = #14161b;#dadada
    viewbold = #ffd787;#dadada;bold
    viewunderline = #5f5f00;#dadada;underline
    viewselected = #14161b;#d7d7af

[diffviewer]
    added = #dadada;#87af87
    changedline = #dadada;#5f87d7
    changednew = #dadada;#87af87
    changed = #dadada;#5f87d7
    removed = #14161b;#d7005f
    error = #14161b;#d70000
