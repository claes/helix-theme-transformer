[skin]
    description = monokai_pro_spectrum - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #f7f1ff;#222222
    selected = #f7f1ff;#525053
    marked = #fd9353;#222222;bold
    markselect = #fd9353;#525053;bold
    gauge = #f7f1ff;#525053
    input = #f7f1ff;#525053
    inputmark = #f7f1ff;#525053
    inputunchanged = #69676c;#525053
    disabled = #69676c;#525053
    reverse = #222222;#f7f1ff
    commandlinemark = #f7f1ff;#525053
    header = #7bd88f;#222222;bold
    shadow = #69676c;#222222

[dialog]
    _default_ = #f7f1ff;#525053
    dfocus = #222222;#525053;bold
    dhotnormal = #fd9353;#525053
    dhotfocus = #fd9353;#525053;bold
    dtitle = #7bd88f;#525053;bold

[error]
    _default_ = #f7f1ff;#fc618d
    errdfocus = #222222;#fd9353;bold
    errdhotnormal = #fd9353;#fc618d
    errdhotfocus = #fd9353;#525053;bold
    errdtitle = #fd9353;#fc618d;bold

[filehighlight]
    directory = #7bd88f;#222222;bold
    executable = #fce566;#222222;bold
    symlink = #f59762;#222222
    hardlink = #f59762;#222222
    stalelink = #fc618d;#222222
    device = #fd9353;#222222
    special = #f59762;#222222
    core = #fc618d;#222222
    temp = #69676c;#222222
    archive = #948ae3;#222222
    doc = #fce566;#222222
    source = #fc618d;#222222
    media = #fc618d;#222222
    graph = #fc618d;#222222
    database = #7bd88f;#222222

[menu]
    _default_ = #f7f1ff;#525053
    menusel = #f7f1ff;#525053
    menuhot = #fd9353;#525053
    menuhotsel = #fd9353;#525053
    menuinactive = #69676c;#525053

[popupmenu]
    _default_ = #f7f1ff;#525053
    menusel = #f7f1ff;#525053
    menutitle = #7bd88f;#525053;bold

[buttonbar]
    hotkey = #fd9353;#525053;bold
    button = #f7f1ff;#525053

[statusbar]
    _default_ = #222222;#f59762

[help]
    _default_ = #f7f1ff;#525053
    helpitalic = #fd9353;#525053;italic
    helpbold = #7bd88f;#525053;bold
    helplink = #f59762;#525053;underline
    helpslink = #f7f1ff;#f59762
    helptitle = #7bd88f;#525053;bold

[editor]
