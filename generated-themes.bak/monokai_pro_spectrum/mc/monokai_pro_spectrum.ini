    editbold = #fd9353;#222222;bold
    editmarked = #f7f1ff;#525053
    editwhitespace = #69676c;#222222
    editnonprintable = #69676c;#222222
    editlinestate = #222222;#525053
    bookmark = #f7f1ff;#fc618d
    bookmarkfound = #222222;#7bd88f
    editrightmargin = #69676c;#525053
    editbg = #f7f1ff;#222222
    editframe = #69676c;#222222
    editframeactive = #fce566;#222222
    editframedrag = #fc618d;#222222

[viewer]
