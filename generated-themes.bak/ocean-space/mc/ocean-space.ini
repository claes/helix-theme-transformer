    inputmark = #d5ced9;#414a5b
    inputunchanged = #6e7178;#00b491
    disabled = #6e7178;#00b491
    reverse = #0f111a;#d5ced9
    commandlinemark = #d5ced9;#414a5b
    header = #f39c12;#0f111a;bold
    shadow = #6e7178;#0f111a

[dialog]
    _default_ = #d5ced9;#00b491
    dfocus = #0f111a;#414a5b;bold
    dhotnormal = #f2f27a;#00b491
    dhotfocus = #f2f27a;#414a5b;bold
    dtitle = #f39c12;#00b491;bold

[error]
