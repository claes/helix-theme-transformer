[skin]
    description = noctis - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #b1cace;#00262a
    selected = #b1cace;#0d6772
    marked = #ffd800;#00262a;bold
    markselect = #ffd800;#0d6772;bold
    gauge = #b1cace;#0d6772
    input = #b1cace;#0d6772
    inputmark = #b1cace;#0d6772
    inputunchanged = #5b858b;#0d6772
    disabled = #5b858b;#0d6772
    reverse = #00262a;#b1cace
    commandlinemark = #b1cace;#0d6772
    header = #ffa864;#00262a;bold
    shadow = #5b858b;#00262a

[dialog]
    _default_ = #b1cace;#0d6772
    dfocus = #00262a;#0d6772;bold
    dhotnormal = #ffd800;#0d6772
    dhotfocus = #ffd800;#0d6772;bold
    dtitle = #ffa864;#0d6772;bold

[error]
    _default_ = #b1cace;#e34e1b
