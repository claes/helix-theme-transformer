[skin]
    description = autumn - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #f3f2cc;#232323
    selected = #f3f2cc;#404040
    marked = #ffff9f;#232323;bold
    markselect = #ffff9f;#404040;bold
    gauge = #f3f2cc;#323232
    input = #f3f2cc;#323232
    inputmark = #f3f2cc;#404040
    inputunchanged = #646f69;#323232
    disabled = #646f69;#323232
    reverse = #232323;#f3f2cc
    commandlinemark = #f3f2cc;#404040
    header = #f3f2cc;#232323;bold
    shadow = #646f69;#232323

[dialog]
    _default_ = #f3f2cc;#323232
    dfocus = #232323;#404040;bold
    dhotnormal = #ffff9f;#323232
    dhotfocus = #ffff9f;#404040;bold
    dtitle = #f3f2cc;#323232;bold

[error]
    _default_ = #f3f2cc;#f05e48
    errdfocus = #232323;#ffff9f;bold
    errdhotnormal = #ffff9f;#f05e48
    errdhotfocus = #ffff9f;#404040;bold
    errdtitle = #ffff9f;#f05e48;bold

[filehighlight]
    directory = #fad566;#232323;bold
    executable = #99be70;#232323;bold
    symlink = #fad566;#232323
    hardlink = #fad566;#232323
    stalelink = #f05e48;#232323
    device = #ffff9f;#232323
    special = #fad566;#232323
    core = #f05e48;#232323
    temp = #646f69;#232323
    archive = #86c1b9;#232323
    doc = #99be70;#232323
    source = #f05e48;#232323
    media = #f05e48;#232323
    graph = #f05e48;#232323
    database = #f3f2cc;#232323

[menu]
    _default_ = #f3f2cc;#323232
    menusel = #f3f2cc;#404040
    menuhot = #ffff9f;#323232
    menuhotsel = #ffff9f;#404040
    menuinactive = #646f69;#323232

[popupmenu]
    _default_ = #f3f2cc;#323232
    menusel = #f3f2cc;#404040
    menutitle = #f3f2cc;#323232;bold

[buttonbar]
    hotkey = #ffff9f;#323232;bold
    button = #f3f2cc;#323232

[statusbar]
    _default_ = #232323;#fad566

[help]
    _default_ = #f3f2cc;#323232
    helpitalic = #ffff9f;#323232;italic
    helpbold = #f3f2cc;#323232;bold
    helplink = #fad566;#323232;underline
    helpslink = #f3f2cc;#fad566
    helptitle = #f3f2cc;#323232;bold

[editor]
    _default_ = #f3f2cc;#232323
    editbold = #ffff9f;#232323;bold
    editmarked = #f3f2cc;#404040
    editwhitespace = #646f69;#232323
    editnonprintable = #646f69;#232323
    editlinestate = #232323;#323232
    bookmark = #f3f2cc;#f05e48
    bookmarkfound = #232323;#99be70
    editrightmargin = #646f69;#323232
    editbg = #f3f2cc;#232323
    editframe = #646f69;#232323
    editframeactive = #212121;#232323
    editframedrag = #f05e48;#232323

[viewer]
    _default_ = #f3f2cc;#232323
    viewbold = #ffff9f;#232323;bold
    viewunderline = #fad566;#232323;underline
    viewselected = #f3f2cc;#404040

[diffviewer]
    added = #232323;#99be70
    changedline = #232323;#646f69
    changednew = #232323;#99be70
    changed = #232323;#646f69
    removed = #f3f2cc;#f05e48
    error = #f3f2cc;#f05e48
