[skin]
    description = seoul256-light-hard - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #14161b;#eeeeee
    selected = #14161b;#d7d7af
    marked = #ffd787;#eeeeee;bold
    markselect = #ffd787;#d7d7af;bold
    gauge = #14161b;#d7d7af
    input = #14161b;#d7d7af
    inputmark = #14161b;#d7d7af
    inputunchanged = #5f875f;#d7d7af
    disabled = #5f875f;#d7d7af
    reverse = #eeeeee;#14161b
    commandlinemark = #14161b;#d7d7af
    header = #875f00;#eeeeee;bold
    shadow = #5f875f;#eeeeee

[dialog]
    _default_ = #14161b;#d7d7af
    dfocus = #eeeeee;#d7d7af;bold
    dhotnormal = #ffd787;#d7d7af
    dhotfocus = #ffd787;#d7d7af;bold
    dtitle = #875f00;#d7d7af;bold

[error]
    _default_ = #14161b;#d70000
    errdfocus = #eeeeee;#ffd787;bold
    errdhotnormal = #ffd787;#d70000
    errdhotfocus = #ffd787;#d7d7af;bold
    errdtitle = #ffd787;#d70000;bold

[filehighlight]
    directory = #5f5f00;#eeeeee;bold
    executable = #008787;#eeeeee;bold
    symlink = #5f5f00;#eeeeee
    hardlink = #5f5f00;#eeeeee
    stalelink = #d70000;#eeeeee
    device = #ffd787;#eeeeee
    special = #5f5f00;#eeeeee
    core = #d70000;#eeeeee
    temp = #5f875f;#eeeeee
    archive = #875f5f;#eeeeee
    doc = #008787;#eeeeee
    source = #d75f87;#eeeeee
    media = #d75f87;#eeeeee
    graph = #d75f87;#eeeeee
    database = #875f00;#eeeeee

[menu]
    _default_ = #14161b;#d7d7af
    menusel = #14161b;#d7d7af
    menuhot = #ffd787;#d7d7af
    menuhotsel = #ffd787;#d7d7af
    menuinactive = #5f875f;#d7d7af

[popupmenu]
    _default_ = #14161b;#d7d7af
    menusel = #14161b;#d7d7af
    menutitle = #875f00;#d7d7af;bold

[buttonbar]
    hotkey = #ffd787;#d7d7af;bold
    button = #14161b;#d7d7af

[statusbar]
    _default_ = #eeeeee;#5f5f00

[help]
    _default_ = #14161b;#d7d7af
    helpitalic = #ffd787;#d7d7af;italic
    helpbold = #875f00;#d7d7af;bold
    helplink = #5f5f00;#d7d7af;underline
    helpslink = #14161b;#5f5f00
    helptitle = #875f00;#d7d7af;bold

[editor]
    _default_ = #14161b;#eeeeee
    editbold = #ffd787;#eeeeee;bold
    editmarked = #14161b;#d7d7af
    editwhitespace = #5f875f;#eeeeee
    editnonprintable = #5f875f;#eeeeee
    editlinestate = #eeeeee;#d7d7af
    bookmark = #14161b;#d70000
    bookmarkfound = #eeeeee;#87af87
    editrightmargin = #5f875f;#d7d7af
    editbg = #14161b;#eeeeee
    editframe = #5f875f;#eeeeee
    editframeactive = #3a3a3a;#eeeeee
    editframedrag = #d70000;#eeeeee

[viewer]
    _default_ = #14161b;#eeeeee
    viewbold = #ffd787;#eeeeee;bold
    viewunderline = #5f5f00;#eeeeee;underline
    viewselected = #14161b;#d7d7af

[diffviewer]
    added = #eeeeee;#87af87
    changedline = #eeeeee;#5f87d7
    changednew = #eeeeee;#87af87
    changed = #eeeeee;#5f87d7
    removed = #14161b;#d7005f
    error = #14161b;#d70000
