[skin]
    description = yellowed - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #ffffff;#242424
    selected = #ffffff;#3f3f3f
    marked = #ff9c00;#242424;bold
    markselect = #ff9c00;#3f3f3f;bold
    gauge = #ffffff;#2a2a2a
    input = #ffffff;#2a2a2a
    inputmark = #ffffff;#3f3f3f
    inputunchanged = #6b6b6b;#2a2a2a
    disabled = #6b6b6b;#2a2a2a
    reverse = #242424;#ffffff
    commandlinemark = #ffffff;#3f3f3f
    header = #ffffff;#242424;bold
    shadow = #6b6b6b;#242424

[dialog]
    _default_ = #ffffff;#2a2a2a
    dfocus = #242424;#3f3f3f;bold
    dhotnormal = #ff9c00;#2a2a2a
    dhotfocus = #ff9c00;#3f3f3f;bold
    dtitle = #ffffff;#2a2a2a;bold

[error]
    _default_ = #ffffff;#ff0000
    errdfocus = #242424;#ff9c00;bold
    errdhotnormal = #ff9c00;#ff0000
    errdhotfocus = #ff9c00;#3f3f3f;bold
    errdtitle = #ff9c00;#ff0000;bold

[filehighlight]
    directory = #ffffff;#242424;bold
    executable = #378b1d;#242424;bold
    symlink = #ffd900;#242424
    hardlink = #ffd900;#242424
    stalelink = #ff0000;#242424
    device = #ff9c00;#242424
    special = #ffd900;#242424
    core = #ff0000;#242424
    temp = #6b6b6b;#242424
    archive = #ffd900;#242424
    doc = #378b1d;#242424
    source = #ffd900;#242424
    media = #ffd900;#242424
    graph = #ffd900;#242424
    database = #ffffff;#242424

[menu]
    _default_ = #ffffff;#2a2a2a
    menusel = #ffffff;#3f3f3f
    menuhot = #ff9c00;#2a2a2a
    menuhotsel = #ff9c00;#3f3f3f
    menuinactive = #6b6b6b;#2a2a2a

[popupmenu]
    _default_ = #ffffff;#2a2a2a
    menusel = #ffffff;#3f3f3f
    menutitle = #ffffff;#2a2a2a;bold

[buttonbar]
    hotkey = #ff9c00;#2a2a2a;bold
    button = #ffffff;#2a2a2a

[statusbar]
    _default_ = #242424;#ffd900

[help]
    _default_ = #ffffff;#2a2a2a
    helpitalic = #ff9c00;#2a2a2a;italic
    helpbold = #ffffff;#2a2a2a;bold
    helplink = #ffd900;#2a2a2a;underline
    helpslink = #ffffff;#ffd900
    helptitle = #ffffff;#2a2a2a;bold

[editor]
    _default_ = #ffffff;#242424
    editbold = #ff9c00;#242424;bold
    editmarked = #ffffff;#3f3f3f
    editwhitespace = #6b6b6b;#242424
    editnonprintable = #6b6b6b;#242424
    editlinestate = #242424;#2a2a2a
    bookmark = #ffffff;#ff0000
    bookmarkfound = #242424;#378b1d
    editrightmargin = #6b6b6b;#2a2a2a
    editbg = #ffffff;#242424
    editframe = #6b6b6b;#242424
    editframeactive = #f4f4f4;#242424
    editframedrag = #ff0000;#242424

[viewer]
    _default_ = #ffffff;#242424
    viewbold = #ff9c00;#242424;bold
    viewunderline = #ffd900;#242424;underline
    viewselected = #ffffff;#3f3f3f

[diffviewer]
    added = #242424;#378b1d
    changedline = #242424;#008dff
    changednew = #242424;#378b1d
    changed = #242424;#008dff
    removed = #ffffff;#ff0000
    error = #ffffff;#ff0000
