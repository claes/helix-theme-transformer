[skin]
    description = curzon - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #bfdbfe;#000000
    selected = #bfdbfe;#4f46e5
    marked = #ffcd1c;#000000;bold
    markselect = #ffcd1c;#4f46e5;bold
    gauge = #bfdbfe;#000000
    input = #bfdbfe;#000000
    inputmark = #bfdbfe;#4f46e5
    inputunchanged = #697c81;#000000
    disabled = #697c81;#000000
    reverse = #000000;#bfdbfe
    commandlinemark = #bfdbfe;#4f46e5
    header = #ffffff;#000000;bold
    shadow = #697c81;#000000

[dialog]
    _default_ = #bfdbfe;#000000
    dfocus = #000000;#4f46e5;bold
    dhotnormal = #ffcd1c;#000000
    dhotfocus = #ffcd1c;#4f46e5;bold
    dtitle = #ffffff;#000000;bold

[error]
    _default_ = #bfdbfe;#f43f5e
    errdfocus = #000000;#ffcd1c;bold
    errdhotnormal = #ffcd1c;#f43f5e
    errdhotfocus = #ffcd1c;#4f46e5;bold
