[skin]
    description = spacebones_light - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #655370;#fbf8ef
    selected = #655370;#e7e7fc
    marked = #da8b55;#fbf8ef;bold
    markselect = #da8b55;#e7e7fc;bold
    gauge = #655370;#d1dcdf
    input = #655370;#d1dcdf
    inputmark = #655370;#e7e7fc
    inputunchanged = #a49da5;#d1dcdf
    disabled = #a49da5;#d1dcdf
    reverse = #fbf8ef;#655370
    commandlinemark = #655370;#e7e7fc
    header = #6c3163;#fbf8ef;bold
    shadow = #a49da5;#fbf8ef

[dialog]
    _default_ = #655370;#d1dcdf
    dfocus = #fbf8ef;#e7e7fc;bold
    dhotnormal = #da8b55;#d1dcdf
    dhotfocus = #da8b55;#e7e7fc;bold
    dtitle = #6c3163;#d1dcdf;bold

[error]
    _default_ = #655370;#e0211d
    errdfocus = #fbf8ef;#da8b55;bold
    errdhotnormal = #da8b55;#e0211d
