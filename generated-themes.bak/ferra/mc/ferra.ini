    inputmark = #fecdb2;#4d424b
    inputunchanged = #6f5d63;#383539
    disabled = #6f5d63;#383539
    reverse = #2b292d;#fecdb2
    commandlinemark = #fecdb2;#4d424b
    header = #f6b6c9;#2b292d;bold
    shadow = #6f5d63;#2b292d

[dialog]
