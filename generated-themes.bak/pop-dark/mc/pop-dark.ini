    editbold = #ff9500;#3e3b39;bold
    editmarked = #dedede;#8deef9
    editwhitespace = #a0b4a7;#3e3b39
    editnonprintable = #a0b4a7;#3e3b39
    editlinestate = #3e3b39;#4c4643
    bookmark = #dedede;#ff2200
    bookmarkfound = #3e3b39;#4dd44d
    editrightmargin = #a0b4a7;#4c4643
    editbg = #dedede;#3e3b39
