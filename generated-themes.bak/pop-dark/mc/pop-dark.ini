[skin]
    description = pop-dark - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #dedede;#3e3b39
    selected = #dedede;#8deef9
    marked = #ff9500;#3e3b39;bold
    markselect = #ff9500;#8deef9;bold
    gauge = #dedede;#4c4643
    input = #dedede;#4c4643
    inputmark = #dedede;#8deef9
    inputunchanged = #a0b4a7;#4c4643
    disabled = #a0b4a7;#4c4643
    reverse = #3e3b39;#dedede
    commandlinemark = #dedede;#8deef9
    header = #f78c6c;#3e3b39;bold
    shadow = #a0b4a7;#3e3b39

[dialog]
    _default_ = #dedede;#4c4643
    dfocus = #3e3b39;#8deef9;bold
    dhotnormal = #ff9500;#4c4643
    dhotfocus = #ff9500;#8deef9;bold
    dtitle = #f78c6c;#4c4643;bold

[error]
    _default_ = #dedede;#ff2200
    errdfocus = #3e3b39;#ff9500;bold
    errdhotnormal = #ff9500;#ff2200
    errdhotfocus = #ff9500;#8deef9;bold
    errdtitle = #ff9500;#ff2200;bold

[filehighlight]
    directory = #8deef9;#3e3b39;bold
    executable = #73c48f;#3e3b39;bold
    symlink = #ff9500;#3e3b39
    hardlink = #ff9500;#3e3b39
    stalelink = #ff2200;#3e3b39
    device = #ff9500;#3e3b39
    special = #ff9500;#3e3b39
    core = #ff2200;#3e3b39
    temp = #a0b4a7;#3e3b39
    archive = #f78c6c;#3e3b39
    doc = #73c48f;#3e3b39
    source = #8deef9;#3e3b39
    media = #8deef9;#3e3b39
    graph = #8deef9;#3e3b39
    database = #f78c6c;#3e3b39

[menu]
    _default_ = #dedede;#4c4643
    menusel = #dedede;#8deef9
    menuhot = #ff9500;#4c4643
    menuhotsel = #ff9500;#8deef9
    menuinactive = #a0b4a7;#4c4643

[popupmenu]
    _default_ = #dedede;#4c4643
    menusel = #dedede;#8deef9
    menutitle = #f78c6c;#4c4643;bold

[buttonbar]
    hotkey = #ff9500;#4c4643;bold
    button = #dedede;#4c4643

[statusbar]
    _default_ = #3e3b39;#ff9500

[help]
    _default_ = #dedede;#4c4643
