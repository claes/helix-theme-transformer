[skin]
    description = kinda_nvim_light - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #b6bfbc;#00120c
    selected = #b6bfbc;#002e1f
    marked = #b8a26c;#00120c;bold
    markselect = #b8a26c;#002e1f;bold
    gauge = #b6bfbc;#00120c
    input = #b6bfbc;#00120c
    inputmark = #b6bfbc;#002e1f
    inputunchanged = #526b82;#00120c
    disabled = #526b82;#00120c
    reverse = #00120c;#b6bfbc
    commandlinemark = #b6bfbc;#002e1f
    header = #12b27d;#00120c;bold
    shadow = #526b82;#00120c

[dialog]
