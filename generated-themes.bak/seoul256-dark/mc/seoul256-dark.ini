[skin]
    description = seoul256-dark - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #d0d0d0;#3a3a3a
    selected = #d0d0d0;#875f5f
    marked = #ffd787;#3a3a3a;bold
    markselect = #ffd787;#875f5f;bold
    gauge = #d0d0d0;#d7d7af
    input = #d0d0d0;#d7d7af
    inputmark = #d0d0d0;#875f5f
    inputunchanged = #5f875f;#d7d7af
    disabled = #5f875f;#d7d7af
    reverse = #3a3a3a;#d0d0d0
    commandlinemark = #d0d0d0;#875f5f
    header = #d8af5f;#3a3a3a;bold
    shadow = #5f875f;#3a3a3a

[dialog]
    _default_ = #d0d0d0;#d7d7af
    dfocus = #3a3a3a;#875f5f;bold
    dhotnormal = #ffd787;#d7d7af
    dhotfocus = #ffd787;#875f5f;bold
    dtitle = #d8af5f;#d7d7af;bold

[error]
    _default_ = #d0d0d0;#d70000
    errdfocus = #3a3a3a;#ffd787;bold
    errdhotnormal = #ffd787;#d70000
    errdhotfocus = #ffd787;#875f5f;bold
    errdtitle = #ffd787;#d70000;bold

[filehighlight]
    directory = #d7d7af;#3a3a3a;bold
    executable = #87afaf;#3a3a3a;bold
    symlink = #d7d7af;#3a3a3a
    hardlink = #d7d7af;#3a3a3a
    stalelink = #d70000;#3a3a3a
    device = #ffd787;#3a3a3a
    special = #d7d7af;#3a3a3a
    core = #d70000;#3a3a3a
    temp = #5f875f;#3a3a3a
    archive = #ffd787;#3a3a3a
    doc = #87afaf;#3a3a3a
    source = #d75f87;#3a3a3a
    media = #d75f87;#3a3a3a
    graph = #d75f87;#3a3a3a
    database = #d8af5f;#3a3a3a

[menu]
    _default_ = #d0d0d0;#d7d7af
    menusel = #d0d0d0;#875f5f
    menuhot = #ffd787;#d7d7af
    menuhotsel = #ffd787;#875f5f
    menuinactive = #5f875f;#d7d7af

[popupmenu]
    _default_ = #d0d0d0;#d7d7af
    menusel = #d0d0d0;#875f5f
    menutitle = #d8af5f;#d7d7af;bold

[buttonbar]
    hotkey = #ffd787;#d7d7af;bold
    button = #d0d0d0;#d7d7af

[statusbar]
    _default_ = #3a3a3a;#d7d7af

[help]
    _default_ = #d0d0d0;#d7d7af
    helpitalic = #ffd787;#d7d7af;italic
    helpbold = #d8af5f;#d7d7af;bold
    helplink = #d7d7af;#d7d7af;underline
    helpslink = #d0d0d0;#d7d7af
    helptitle = #d8af5f;#d7d7af;bold

[editor]
    _default_ = #d0d0d0;#3a3a3a
    editbold = #ffd787;#3a3a3a;bold
    editmarked = #d0d0d0;#875f5f
    editwhitespace = #5f875f;#3a3a3a
    editnonprintable = #5f875f;#3a3a3a
    editlinestate = #3a3a3a;#d7d7af
    bookmark = #d0d0d0;#d70000
    bookmarkfound = #3a3a3a;#87af87
    editrightmargin = #5f875f;#d7d7af
    editbg = #d0d0d0;#3a3a3a
    editframe = #5f875f;#3a3a3a
    editframeactive = #d0d0d0;#3a3a3a
    editframedrag = #d70000;#3a3a3a

[viewer]
    _default_ = #d0d0d0;#3a3a3a
    viewbold = #ffd787;#3a3a3a;bold
    viewunderline = #d7d7af;#3a3a3a;underline
    viewselected = #d0d0d0;#875f5f

[diffviewer]
    added = #3a3a3a;#87af87
    changedline = #3a3a3a;#5f87d7
    changednew = #3a3a3a;#87af87
    changed = #3a3a3a;#5f87d7
    removed = #d0d0d0;#d7005f
    error = #d0d0d0;#d70000
