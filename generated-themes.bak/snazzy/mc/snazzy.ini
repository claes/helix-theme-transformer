[skin]
    description = snazzy - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #eff0eb;#282a36
    selected = #eff0eb;#4d4f66
    marked = #f3f99d;#282a36;bold
    markselect = #f3f99d;#4d4f66;bold
    gauge = #eff0eb;#21222c
    input = #eff0eb;#21222c
    inputmark = #eff0eb;#4d4f66
    inputunchanged = #a39e9b;#21222c
    disabled = #a39e9b;#21222c
    reverse = #282a36;#eff0eb
    commandlinemark = #eff0eb;#4d4f66
    header = #b1d7c7;#282a36;bold
    shadow = #a39e9b;#282a36

[dialog]
    _default_ = #eff0eb;#21222c
    dfocus = #282a36;#4d4f66;bold
    dhotnormal = #f3f99d;#21222c
    dhotfocus = #f3f99d;#4d4f66;bold
    dtitle = #b1d7c7;#21222c;bold

[error]
    _default_ = #eff0eb;#ff5c57
