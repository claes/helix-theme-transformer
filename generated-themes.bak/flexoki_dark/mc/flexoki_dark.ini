[skin]
    description = flexoki_dark - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #100f0f;#fffcf0
    selected = #100f0f;#dad8ce
    marked = #ad8301;#fffcf0;bold
    markselect = #ad8301;#dad8ce;bold
    gauge = #100f0f;#f2f0e5
    input = #100f0f;#f2f0e5
    inputmark = #100f0f;#dad8ce
    inputunchanged = #b7b5ac;#f2f0e5
    disabled = #b7b5ac;#f2f0e5
    reverse = #fffcf0;#100f0f
    commandlinemark = #100f0f;#dad8ce
    header = #ad8301;#fffcf0;bold
    shadow = #b7b5ac;#fffcf0

[dialog]
    _default_ = #100f0f;#f2f0e5
    dfocus = #fffcf0;#dad8ce;bold
    dhotnormal = #ad8301;#f2f0e5
    dhotfocus = #ad8301;#dad8ce;bold
    dtitle = #ad8301;#f2f0e5;bold

[error]
    _default_ = #100f0f;#af3029
