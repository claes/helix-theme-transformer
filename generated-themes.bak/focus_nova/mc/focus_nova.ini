    helptitle = #f9e2af;#3b3b4d;bold

[editor]
    _default_ = #dcdcdc;#1e1e2e
    editbold = #f9e2af;#1e1e2e;bold
    editmarked = #dcdcdc;#4b4b5e
    editwhitespace = #7a7a89;#1e1e2e
    editnonprintable = #7a7a89;#1e1e2e
    editlinestate = #1e1e2e;#3b3b4d
    bookmark = #dcdcdc;#ff6e7f
    bookmarkfound = #1e1e2e;#c0fca0
    editrightmargin = #7a7a89;#3b3b4d
    editbg = #dcdcdc;#1e1e2e
    editframe = #7a7a89;#1e1e2e
    editframeactive = #2e2e3e;#1e1e2e
    editframedrag = #ff6e7f;#1e1e2e

[viewer]
