[skin]
    description = focus_nova - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #dcdcdc;#1e1e2e
    selected = #dcdcdc;#4b4b5e
    marked = #f9e2af;#1e1e2e;bold
    markselect = #f9e2af;#4b4b5e;bold
    gauge = #dcdcdc;#3b3b4d
    input = #dcdcdc;#3b3b4d
    inputmark = #dcdcdc;#4b4b5e
    inputunchanged = #7a7a89;#3b3b4d
    disabled = #7a7a89;#3b3b4d
    reverse = #1e1e2e;#dcdcdc
    commandlinemark = #dcdcdc;#4b4b5e
    header = #f9e2af;#1e1e2e;bold
    shadow = #7a7a89;#1e1e2e

[dialog]
    _default_ = #dcdcdc;#3b3b4d
    dfocus = #1e1e2e;#4b4b5e;bold
    dhotnormal = #f9e2af;#3b3b4d
    dhotfocus = #f9e2af;#4b4b5e;bold
    dtitle = #f9e2af;#3b3b4d;bold

[error]
    _default_ = #dcdcdc;#ff6e7f
    errdfocus = #1e1e2e;#f9e2af;bold
    errdhotnormal = #f9e2af;#ff6e7f
    errdhotfocus = #f9e2af;#4b4b5e;bold
    errdtitle = #f9e2af;#ff6e7f;bold

[filehighlight]
    directory = #c0fca0;#1e1e2e;bold
    executable = #c0fca0;#1e1e2e;bold
    symlink = #bb9af7;#1e1e2e
    hardlink = #bb9af7;#1e1e2e
    stalelink = #ff6e7f;#1e1e2e
    device = #f9e2af;#1e1e2e
    special = #bb9af7;#1e1e2e
    core = #ff6e7f;#1e1e2e
    temp = #7a7a89;#1e1e2e
    archive = #cba6f7;#1e1e2e
    doc = #c0fca0;#1e1e2e
    source = #ff6e7f;#1e1e2e
    media = #ff6e7f;#1e1e2e
    graph = #ff6e7f;#1e1e2e
    database = #f9e2af;#1e1e2e

[menu]
    _default_ = #dcdcdc;#3b3b4d
    menusel = #dcdcdc;#4b4b5e
    menuhot = #f9e2af;#3b3b4d
    menuhotsel = #f9e2af;#4b4b5e
    menuinactive = #7a7a89;#3b3b4d

[popupmenu]
    _default_ = #dcdcdc;#3b3b4d
    menusel = #dcdcdc;#4b4b5e
    menutitle = #f9e2af;#3b3b4d;bold

[buttonbar]
