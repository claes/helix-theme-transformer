[skin]
    description = zed_onedark - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #c8ccd4;#282c33
    selected = #c8ccd4;#3b4048
    marked = #dfc184;#282c33;bold
    markselect = #dfc184;#3b4048;bold
    gauge = #c8ccd4;#2f343e
    input = #c8ccd4;#2f343e
    inputmark = #c8ccd4;#3b4048
    inputunchanged = #5d636f;#2f343e
    disabled = #5d636f;#2f343e
    reverse = #282c33;#c8ccd4
    commandlinemark = #c8ccd4;#3b4048
    header = #6eb4bf;#282c33;bold
    shadow = #5d636f;#282c33

[dialog]
    _default_ = #c8ccd4;#2f343e
    dfocus = #282c33;#3b4048;bold
    dhotnormal = #dfc184;#2f343e
    dhotfocus = #dfc184;#3b4048;bold
    dtitle = #6eb4bf;#2f343e;bold

[error]
