[skin]
    description = emacs - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #000000;#ffffff
    selected = #000000;#ffec8b
    marked = #ff8c00;#ffffff;bold
    markselect = #ff8c00;#ffec8b;bold
    gauge = #000000;#bfbfbf
    input = #000000;#bfbfbf
    inputmark = #000000;#ffec8b
    inputunchanged = #b22222;#bfbfbf
    disabled = #b22222;#bfbfbf
    reverse = #ffffff;#000000
    commandlinemark = #000000;#ffec8b
    header = #228b22;#ffffff;bold
    shadow = #b22222;#ffffff

[dialog]
    _default_ = #000000;#bfbfbf
    dfocus = #ffffff;#ffec8b;bold
    dhotnormal = #ff8c00;#bfbfbf
    dhotfocus = #ff8c00;#ffec8b;bold
    dtitle = #228b22;#bfbfbf;bold

[error]
    _default_ = #000000;#ff0000
    errdfocus = #ffffff;#ff8c00;bold
    errdhotnormal = #ff8c00;#ff0000
    errdhotfocus = #ff8c00;#ffec8b;bold
    errdtitle = #ff8c00;#ff0000;bold

[filehighlight]
    directory = #0000ff;#ffffff;bold
    executable = #8b2252;#ffffff;bold
    symlink = #0000ff;#ffffff
    hardlink = #0000ff;#ffffff
    stalelink = #ff0000;#ffffff
    device = #ff8c00;#ffffff
    special = #0000ff;#ffffff
    core = #ff0000;#ffffff
    temp = #b22222;#ffffff
    archive = #008b8b;#ffffff
    doc = #8b2252;#ffffff
    source = #a020f0;#ffffff
    media = #a020f0;#ffffff
    graph = #a020f0;#ffffff
    database = #228b22;#ffffff

[menu]
    _default_ = #000000;#bfbfbf
    menusel = #000000;#ffec8b
    menuhot = #ff8c00;#bfbfbf
    menuhotsel = #ff8c00;#ffec8b
    menuinactive = #b22222;#bfbfbf

[popupmenu]
    _default_ = #000000;#bfbfbf
    menusel = #000000;#ffec8b
    menutitle = #228b22;#bfbfbf;bold

[buttonbar]
    hotkey = #ff8c00;#bfbfbf;bold
    button = #000000;#bfbfbf

[statusbar]
    _default_ = #ffffff;#0000ff

[help]
    _default_ = #000000;#bfbfbf
    helpitalic = #ff8c00;#bfbfbf;italic
    helpbold = #228b22;#bfbfbf;bold
    helplink = #0000ff;#bfbfbf;underline
    helpslink = #000000;#0000ff
    helptitle = #228b22;#bfbfbf;bold

[editor]
    _default_ = #000000;#ffffff
    editbold = #ff8c00;#ffffff;bold
    editmarked = #000000;#ffec8b
    editwhitespace = #b22222;#ffffff
    editnonprintable = #b22222;#ffffff
    editlinestate = #ffffff;#bfbfbf
    bookmark = #000000;#ff0000
    bookmarkfound = #ffffff;#00cd00
    editrightmargin = #b22222;#bfbfbf
    editbg = #000000;#ffffff
    editframe = #b22222;#ffffff
    editframeactive = #ffffff;#ffffff
    editframedrag = #ff0000;#ffffff

[viewer]
    _default_ = #000000;#ffffff
    viewbold = #ff8c00;#ffffff;bold
    viewunderline = #0000ff;#ffffff;underline
    viewselected = #000000;#ffec8b

[diffviewer]
    added = #ffffff;#00cd00
    changedline = #ffffff;#ee9a00
    changednew = #ffffff;#00cd00
    changed = #ffffff;#ee9a00
    removed = #000000;#ee0000
    error = #000000;#ff0000
