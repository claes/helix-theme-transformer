[skin]
    description = nyxvamp-veil - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #1e1e2e;#f7f7ff
    selected = #1e1e2e;#e8d5ff
    marked = #c2410c;#f7f7ff;bold
    markselect = #c2410c;#e8d5ff;bold
    gauge = #1e1e2e;#e8e8f0
    input = #1e1e2e;#e8e8f0
    inputmark = #1e1e2e;#e8d5ff
    inputunchanged = #5a5570;#e8e8f0
    disabled = #5a5570;#e8e8f0
    reverse = #f7f7ff;#1e1e2e
    commandlinemark = #1e1e2e;#e8d5ff
    header = #6b46c1;#f7f7ff;bold
    shadow = #5a5570;#f7f7ff

[dialog]
    _default_ = #1e1e2e;#e8e8f0
    dfocus = #f7f7ff;#e8d5ff;bold
    dhotnormal = #c2410c;#e8e8f0
    dhotfocus = #c2410c;#e8d5ff;bold
    dtitle = #6b46c1;#e8e8f0;bold

[error]
    _default_ = #1e1e2e;#9f1239
    errdfocus = #f7f7ff;#c2410c;bold
    errdhotnormal = #c2410c;#9f1239
    errdhotfocus = #c2410c;#e8d5ff;bold
    errdtitle = #c2410c;#9f1239;bold

[filehighlight]
    directory = #96cdfb;#f7f7ff;bold
    executable = #b8860b;#f7f7ff;bold
    symlink = #9655ff;#f7f7ff
    hardlink = #9655ff;#f7f7ff
    stalelink = #9f1239;#f7f7ff
    device = #c2410c;#f7f7ff
    special = #9655ff;#f7f7ff
    core = #9f1239;#f7f7ff
    temp = #5a5570;#f7f7ff
    archive = #c2410c;#f7f7ff
    doc = #b8860b;#f7f7ff
    source = #9655ff;#f7f7ff
    media = #9655ff;#f7f7ff
    graph = #9655ff;#f7f7ff
    database = #6b46c1;#f7f7ff

[menu]
    _default_ = #1e1e2e;#e8e8f0
    menusel = #1e1e2e;#e8d5ff
    menuhot = #c2410c;#e8e8f0
    menuhotsel = #c2410c;#e8d5ff
    menuinactive = #5a5570;#e8e8f0

[popupmenu]
    _default_ = #1e1e2e;#e8e8f0
    menusel = #1e1e2e;#e8d5ff
    menutitle = #6b46c1;#e8e8f0;bold

[buttonbar]
    hotkey = #c2410c;#e8e8f0;bold
    button = #1e1e2e;#e8e8f0

[statusbar]
    _default_ = #f7f7ff;#9655ff

[help]
    _default_ = #1e1e2e;#e8e8f0
    helpitalic = #c2410c;#e8e8f0;italic
    helpbold = #6b46c1;#e8e8f0;bold
    helplink = #9655ff;#e8e8f0;underline
    helpslink = #1e1e2e;#9655ff
    helptitle = #6b46c1;#e8e8f0;bold

[editor]
    _default_ = #1e1e2e;#f7f7ff
    editbold = #c2410c;#f7f7ff;bold
    editmarked = #1e1e2e;#e8d5ff
    editwhitespace = #5a5570;#f7f7ff
    editnonprintable = #5a5570;#f7f7ff
    editlinestate = #f7f7ff;#e8e8f0
    bookmark = #1e1e2e;#9f1239
    bookmarkfound = #f7f7ff;#a6da95
    editrightmargin = #5a5570;#e8e8f0
    editbg = #1e1e2e;#f7f7ff
    editframe = #5a5570;#f7f7ff
    editframeactive = #f7f7ff;#f7f7ff
    editframedrag = #9f1239;#f7f7ff

[viewer]
    _default_ = #1e1e2e;#f7f7ff
    viewbold = #c2410c;#f7f7ff;bold
    viewunderline = #9655ff;#f7f7ff;underline
    viewselected = #1e1e2e;#e8d5ff

[diffviewer]
    added = #f7f7ff;#a6da95
    changedline = #f7f7ff;#e5c890
    changednew = #f7f7ff;#a6da95
    changed = #f7f7ff;#e5c890
    removed = #1e1e2e;#e78284
    error = #1e1e2e;#9f1239
