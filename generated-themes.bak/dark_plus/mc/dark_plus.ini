[skin]
    description = dark_plus - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #d4d4d4;#1e1e1e
    selected = #d4d4d4;#3a3d41
    marked = #cca700;#1e1e1e;bold
    markselect = #cca700;#3a3d41;bold
    gauge = #d4d4d4;#007acc
    input = #d4d4d4;#007acc
    inputmark = #d4d4d4;#3a3d41
    inputunchanged = #6a9955;#007acc
    disabled = #6a9955;#007acc
    reverse = #1e1e1e;#d4d4d4
    commandlinemark = #d4d4d4;#3a3d41
    header = #4ec9b0;#1e1e1e;bold
    shadow = #6a9955;#1e1e1e

[dialog]
    _default_ = #d4d4d4;#007acc
    dfocus = #1e1e1e;#3a3d41;bold
    dhotnormal = #cca700;#007acc
    dhotfocus = #cca700;#3a3d41;bold
    dtitle = #4ec9b0;#007acc;bold

[error]
    _default_ = #d4d4d4;#ff1212
    errdfocus = #1e1e1e;#cca700;bold
    errdhotnormal = #cca700;#ff1212
    errdhotfocus = #cca700;#3a3d41;bold
    errdtitle = #cca700;#ff1212;bold

[filehighlight]
    directory = #dcdcaa;#1e1e1e;bold
    executable = #ce9178;#1e1e1e;bold
    symlink = #75beff;#1e1e1e
    hardlink = #75beff;#1e1e1e
    stalelink = #ff1212;#1e1e1e
    device = #cca700;#1e1e1e
    special = #75beff;#1e1e1e
    core = #ff1212;#1e1e1e
    temp = #6a9955;#1e1e1e
    archive = #b5cea8;#1e1e1e
    doc = #ce9178;#1e1e1e
    source = #569cd6;#1e1e1e
    media = #569cd6;#1e1e1e
    graph = #569cd6;#1e1e1e
    database = #4ec9b0;#1e1e1e

[menu]
    _default_ = #d4d4d4;#007acc
    menusel = #d4d4d4;#3a3d41
    menuhot = #cca700;#007acc
    menuhotsel = #cca700;#3a3d41
    menuinactive = #6a9955;#007acc

[popupmenu]
    _default_ = #d4d4d4;#007acc
    menusel = #d4d4d4;#3a3d41
    menutitle = #4ec9b0;#007acc;bold

[buttonbar]
    hotkey = #cca700;#007acc;bold
    button = #d4d4d4;#007acc

[statusbar]
    _default_ = #1e1e1e;#75beff

[help]
    _default_ = #d4d4d4;#007acc
    helpitalic = #cca700;#007acc;italic
    helpbold = #4ec9b0;#007acc;bold
    helplink = #75beff;#007acc;underline
    helpslink = #d4d4d4;#75beff
    helptitle = #4ec9b0;#007acc;bold

[editor]
    _default_ = #d4d4d4;#1e1e1e
    editbold = #cca700;#1e1e1e;bold
    editmarked = #d4d4d4;#3a3d41
    editwhitespace = #6a9955;#1e1e1e
    editnonprintable = #6a9955;#1e1e1e
    editlinestate = #1e1e1e;#007acc
    bookmark = #d4d4d4;#ff1212
    bookmarkfound = #1e1e1e;#487e02
    editrightmargin = #6a9955;#007acc
    editbg = #d4d4d4;#1e1e1e
    editframe = #6a9955;#1e1e1e
    editframeactive = #a6a6a6;#1e1e1e
    editframedrag = #ff1212;#1e1e1e

[viewer]
    _default_ = #d4d4d4;#1e1e1e
    viewbold = #cca700;#1e1e1e;bold
    viewunderline = #75beff;#1e1e1e;underline
    viewselected = #d4d4d4;#3a3d41

[diffviewer]
    added = #1e1e1e;#487e02
    changedline = #1e1e1e;#1b81a8
    changednew = #1e1e1e;#487e02
    changed = #1e1e1e;#1b81a8
    removed = #d4d4d4;#f14c4c
    error = #d4d4d4;#ff1212
