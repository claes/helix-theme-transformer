[skin]
    description = omicron_dark - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #cccccc;#000000
    selected = #cccccc;#aaaaaa
    marked = #eedd33;#000000;bold
    markselect = #eedd33;#aaaaaa;bold
    gauge = #cccccc;#111111
    input = #cccccc;#111111
    inputmark = #cccccc;#aaaaaa
    inputunchanged = #cc77cc;#111111
    disabled = #cc77cc;#111111
    reverse = #000000;#cccccc
    commandlinemark = #cccccc;#aaaaaa
    header = #eedd33;#000000;bold
    shadow = #cc77cc;#000000

[dialog]
    _default_ = #cccccc;#111111
    dfocus = #000000;#aaaaaa;bold
    dhotnormal = #eedd33;#111111
    dhotfocus = #eedd33;#aaaaaa;bold
    dtitle = #eedd33;#111111;bold

[error]
    _default_ = #cccccc;#ff2200
    errdfocus = #000000;#eedd33;bold
    errdhotnormal = #eedd33;#ff2200
    errdhotfocus = #eedd33;#aaaaaa;bold
    errdtitle = #eedd33;#ff2200;bold

[filehighlight]
    directory = #cccccc;#000000;bold
    executable = #00dd77;#000000;bold
    symlink = #0077ff;#000000
    hardlink = #0077ff;#000000
    stalelink = #ff2200;#000000
    device = #eedd33;#000000
    special = #0077ff;#000000
    core = #ff2200;#000000
    temp = #cc77cc;#000000
    archive = #00dd77;#000000
    doc = #00dd77;#000000
    source = #cccccc;#000000
    media = #cccccc;#000000
    graph = #cccccc;#000000
    database = #eedd33;#000000

[menu]
    _default_ = #cccccc;#111111
    menusel = #cccccc;#aaaaaa
    menuhot = #eedd33;#111111
    menuhotsel = #eedd33;#aaaaaa
    menuinactive = #cc77cc;#111111

[popupmenu]
    _default_ = #cccccc;#111111
    menusel = #cccccc;#aaaaaa
    menutitle = #eedd33;#111111;bold

[buttonbar]
    hotkey = #eedd33;#111111;bold
    button = #cccccc;#111111

[statusbar]
    _default_ = #000000;#0077ff

[help]
    _default_ = #cccccc;#111111
    helpitalic = #eedd33;#111111;italic
    helpbold = #eedd33;#111111;bold
    helplink = #0077ff;#111111;underline
    helpslink = #cccccc;#0077ff
    helptitle = #eedd33;#111111;bold

[editor]
    _default_ = #cccccc;#000000
    editbold = #eedd33;#000000;bold
    editmarked = #cccccc;#aaaaaa
    editwhitespace = #cc77cc;#000000
    editnonprintable = #cc77cc;#000000
    editlinestate = #000000;#111111
    bookmark = #cccccc;#ff2200
    bookmarkfound = #000000;#33aa33
    editrightmargin = #cc77cc;#111111
    editbg = #cccccc;#000000
    editframe = #cc77cc;#000000
    editframeactive = #111111;#000000
    editframedrag = #ff2200;#000000

[viewer]
    _default_ = #cccccc;#000000
    viewbold = #eedd33;#000000;bold
    viewunderline = #0077ff;#000000;underline
    viewselected = #cccccc;#aaaaaa

[diffviewer]
    added = #000000;#33aa33
    changedline = #000000;#aaaa33
    changednew = #000000;#33aa33
    changed = #000000;#aaaa33
    removed = #cccccc;#bb3333
    error = #cccccc;#ff2200
