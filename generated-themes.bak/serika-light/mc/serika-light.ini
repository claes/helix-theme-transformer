[skin]
    description = serika-light - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #323437;#d1d0c5
    selected = #323437;#aaaeb3
    marked = #9a7d0e;#d1d0c5;bold
    markselect = #9a7d0e;#aaaeb3;bold
    gauge = #323437;#797e86
    input = #323437;#797e86
    inputmark = #323437;#aaaeb3
    inputunchanged = #646669;#797e86
    disabled = #646669;#797e86
    reverse = #d1d0c5;#323437
    commandlinemark = #323437;#aaaeb3
    header = #9a7d0e;#d1d0c5;bold
    shadow = #646669;#d1d0c5

[dialog]
    _default_ = #323437;#797e86
    dfocus = #d1d0c5;#aaaeb3;bold
    dhotnormal = #9a7d0e;#797e86
    dhotfocus = #9a7d0e;#aaaeb3;bold
    dtitle = #9a7d0e;#797e86;bold

[error]
    _default_ = #323437;#da3333
    errdfocus = #d1d0c5;#9a7d0e;bold
    errdhotnormal = #9a7d0e;#da3333
    errdhotfocus = #9a7d0e;#aaaeb3;bold
    errdtitle = #9a7d0e;#da3333;bold

[filehighlight]
