    core = #da3333;#d1d0c5
    temp = #646669;#d1d0c5
    archive = #5a4066;#d1d0c5
    doc = #323437;#d1d0c5
    source = #621d28;#d1d0c5
    media = #621d28;#d1d0c5
    graph = #621d28;#d1d0c5
    database = #9a7d0e;#d1d0c5

[menu]
    _default_ = #323437;#797e86
    menusel = #323437;#aaaeb3
    menuhot = #9a7d0e;#797e86
