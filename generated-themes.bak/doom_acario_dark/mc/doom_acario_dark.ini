[skin]
    description = doom_acario_dark - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #c3dbe5;#0d0e16
    selected = #c3dbe5;#1e1e33
    marked = #d8b941;#0d0e16;bold
    markselect = #d8b941;#1e1e33;bold
    gauge = #c3dbe5;#464a56
    input = #c3dbe5;#464a56
    inputmark = #c3dbe5;#1e1e33
    inputunchanged = #767676;#464a56
    disabled = #767676;#464a56
    reverse = #0d0e16;#c3dbe5
    commandlinemark = #c3dbe5;#1e1e33
    header = #3679d8;#0d0e16;bold
    shadow = #767676;#0d0e16

[dialog]
    _default_ = #c3dbe5;#464a56
    dfocus = #0d0e16;#1e1e33;bold
    dhotnormal = #d8b941;#464a56
    dhotfocus = #d8b941;#1e1e33;bold
    dtitle = #3679d8;#464a56;bold

[error]
