    helptitle = #b9aeda;#1b1b1d;bold

[editor]
    _default_ = #c9c7cd;#0f1014
    editbold = #e5c890;#0f1014;bold
    editmarked = #c9c7cd;#3e3e43
    editwhitespace = #808080;#0f1014
    editnonprintable = #808080;#0f1014
    editlinestate = #0f1014;#1b1b1d
    bookmark = #c9c7cd;#fca5a5
    bookmarkfound = #0f1014;#9dc6ac
    editrightmargin = #808080;#1b1b1d
    editbg = #c9c7cd;#0f1014
    editframe = #808080;#0f1014
