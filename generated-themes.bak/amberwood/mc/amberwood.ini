[skin]
    description = amberwood - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #c9c7cd;#0f1014
    selected = #c9c7cd;#3e3e43
    marked = #e5c890;#0f1014;bold
    markselect = #e5c890;#3e3e43;bold
    gauge = #c9c7cd;#1b1b1d
    input = #c9c7cd;#1b1b1d
    inputmark = #c9c7cd;#3e3e43
    inputunchanged = #808080;#1b1b1d
    disabled = #808080;#1b1b1d
    reverse = #0f1014;#c9c7cd
    commandlinemark = #c9c7cd;#3e3e43
    header = #b9aeda;#0f1014;bold
    shadow = #808080;#0f1014

[dialog]
    _default_ = #c9c7cd;#1b1b1d
    dfocus = #0f1014;#3e3e43;bold
    dhotnormal = #e5c890;#1b1b1d
    dhotfocus = #e5c890;#3e3e43;bold
    dtitle = #b9aeda;#1b1b1d;bold

[error]
    _default_ = #c9c7cd;#fca5a5
    errdfocus = #0f1014;#e5c890;bold
    errdhotnormal = #e5c890;#fca5a5
    errdhotfocus = #e5c890;#3e3e43;bold
    errdtitle = #e5c890;#fca5a5;bold

[filehighlight]
    directory = #e5c890;#0f1014;bold
    executable = #9898a6;#0f1014;bold
    symlink = #e5c890;#0f1014
    hardlink = #e5c890;#0f1014
    stalelink = #fca5a5;#0f1014
    device = #e5c890;#0f1014
    special = #e5c890;#0f1014
    core = #fca5a5;#0f1014
    temp = #808080;#0f1014
    archive = #e9c46a;#0f1014
    doc = #9898a6;#0f1014
    source = #8eb6f5;#0f1014
    media = #8eb6f5;#0f1014
    graph = #8eb6f5;#0f1014
    database = #b9aeda;#0f1014

[menu]
    _default_ = #c9c7cd;#1b1b1d
    menusel = #c9c7cd;#3e3e43
    menuhot = #e5c890;#1b1b1d
    menuhotsel = #e5c890;#3e3e43
    menuinactive = #808080;#1b1b1d

[popupmenu]
    _default_ = #c9c7cd;#1b1b1d
    menusel = #c9c7cd;#3e3e43
    menutitle = #b9aeda;#1b1b1d;bold

[buttonbar]
    hotkey = #e5c890;#1b1b1d;bold
    button = #c9c7cd;#1b1b1d

[statusbar]
    _default_ = #0f1014;#e5c890

[help]
