[skin]
    description = modus_operandi_tritanopia - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #000000;#ffffff
    selected = #000000;#e0e0e0
    marked = #721045;#ffffff;bold
    markselect = #721045;#e0e0e0;bold
    gauge = #000000;#c8c8c8
    input = #000000;#c8c8c8
    inputmark = #000000;#e0e0e0
    inputunchanged = #702000;#c8c8c8
    disabled = #702000;#c8c8c8
    reverse = #ffffff;#000000
    commandlinemark = #000000;#e0e0e0
    header = #3548cf;#ffffff;bold
    shadow = #702000;#ffffff

[dialog]
    _default_ = #000000;#c8c8c8
    dfocus = #ffffff;#e0e0e0;bold
    dhotnormal = #721045;#c8c8c8
    dhotfocus = #721045;#e0e0e0;bold
    dtitle = #3548cf;#c8c8c8;bold

[error]
    _default_ = #000000;#b21100
    errdfocus = #ffffff;#721045;bold
    errdhotnormal = #721045;#b21100
    errdhotfocus = #721045;#e0e0e0;bold
    errdtitle = #721045;#b21100;bold

[filehighlight]
    directory = #3f578f;#ffffff;bold
    executable = #005e8b;#ffffff;bold
    symlink = #a0132f;#ffffff
    hardlink = #a0132f;#ffffff
    stalelink = #b21100;#ffffff
    device = #721045;#ffffff
    special = #a0132f;#ffffff
    core = #b21100;#ffffff
    temp = #702000;#ffffff
    archive = #00663f;#ffffff
    doc = #005e8b;#ffffff
    source = #a0132f;#ffffff
    media = #a0132f;#ffffff
    graph = #a0132f;#ffffff
    database = #3548cf;#ffffff

[menu]
    _default_ = #000000;#c8c8c8
    menusel = #000000;#e0e0e0
    menuhot = #721045;#c8c8c8
    menuhotsel = #721045;#e0e0e0
    menuinactive = #702000;#c8c8c8

[popupmenu]
    _default_ = #000000;#c8c8c8
    menusel = #000000;#e0e0e0
    menutitle = #3548cf;#c8c8c8;bold

[buttonbar]
    hotkey = #721045;#c8c8c8;bold
    button = #000000;#c8c8c8

[statusbar]
    _default_ = #ffffff;#a0132f

[help]
    _default_ = #000000;#c8c8c8
    helpitalic = #721045;#c8c8c8;italic
    helpbold = #3548cf;#c8c8c8;bold
    helplink = #a0132f;#c8c8c8;underline
    helpslink = #000000;#a0132f
    helptitle = #3548cf;#c8c8c8;bold

[editor]
    _default_ = #000000;#ffffff
    editbold = #721045;#ffffff;bold
    editmarked = #000000;#e0e0e0
    editwhitespace = #702000;#ffffff
    editnonprintable = #702000;#ffffff
    editlinestate = #ffffff;#c8c8c8
    bookmark = #000000;#b21100
    bookmarkfound = #ffffff;#005000
    editrightmargin = #702000;#c8c8c8
    editbg = #000000;#ffffff
    editframe = #702000;#ffffff
    editframeactive = #ffffff;#ffffff
    editframedrag = #b21100;#ffffff

[viewer]
    _default_ = #000000;#ffffff
    viewbold = #721045;#ffffff;bold
    viewunderline = #a0132f;#ffffff;underline
