[skin]
    description = kaolin-light - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #383e3f;#18181b
    selected = #383e3f;#2e403b
    marked = #dbac66;#18181b;bold
    markselect = #dbac66;#2e403b;bold
    gauge = #383e3f;#dfe1dc
    input = #383e3f;#dfe1dc
    inputmark = #383e3f;#2e403b
    inputunchanged = #545c5e;#dfe1dc
    disabled = #545c5e;#dfe1dc
    reverse = #18181b;#383e3f
    commandlinemark = #383e3f;#2e403b
    header = #cd9575;#18181b;bold
    shadow = #545c5e;#18181b

[dialog]
