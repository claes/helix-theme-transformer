[skin]
    description = kanagawa-lotus - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #181825;#fdfcfb
    selected = #181825;#b7c5d8
    marked = #ff8800;#fdfcfb;bold
    markselect = #ff8800;#b7c5d8;bold
    gauge = #181825;#eae3d7
    input = #181825;#eae3d7
    inputmark = #181825;#b7c5d8
    inputunchanged = #8f909c;#eae3d7
    disabled = #8f909c;#eae3d7
    reverse = #fdfcfb;#181825
    commandlinemark = #181825;#b7c5d8
    header = #006a6a;#fdfcfb;bold
    shadow = #8f909c;#fdfcfb

[dialog]
    _default_ = #181825;#eae3d7
    dfocus = #fdfcfb;#b7c5d8;bold
    dhotnormal = #ff8800;#eae3d7
    dhotfocus = #ff8800;#b7c5d8;bold
    dtitle = #006a6a;#eae3d7;bold

[error]
    _default_ = #181825;#e82424
    errdfocus = #fdfcfb;#ff8800;bold
    errdhotnormal = #ff8800;#e82424
    errdhotfocus = #ff8800;#b7c5d8;bold
    errdtitle = #ff8800;#e82424;bold

[filehighlight]
