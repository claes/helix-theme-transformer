    executable = #0d267d;#fdfcfb;bold
    symlink = #861657;#fdfcfb
    hardlink = #861657;#fdfcfb
    stalelink = #e82424;#fdfcfb
    device = #ff8800;#fdfcfb
    special = #861657;#fdfcfb
    core = #e82424;#fdfcfb
    temp = #8f909c;#fdfcfb
    archive = #861657;#fdfcfb
    doc = #0d267d;#fdfcfb
    source = #43098a;#fdfcfb
    media = #43098a;#fdfcfb
    graph = #43098a;#fdfcfb
    database = #006a6a;#fdfcfb

[menu]
    _default_ = #181825;#eae3d7
    menusel = #181825;#b7c5d8
    menuhot = #ff8800;#eae3d7
    menuhotsel = #ff8800;#b7c5d8
