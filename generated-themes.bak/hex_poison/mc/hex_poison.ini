[skin]
    description = hex_poison - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #656869;#1d1e1b
    selected = #656869;#4a9aa6
    marked = #ffbf00;#1d1e1b;bold
    markselect = #ffbf00;#4a9aa6;bold
    gauge = #656869;#0e0e0d
    input = #656869;#0e0e0d
    inputmark = #656869;#4a9aa6
    inputunchanged = #654642;#0e0e0d
    disabled = #654642;#0e0e0d
    reverse = #1d1e1b;#656869
    commandlinemark = #656869;#4a9aa6
    header = #9bc1bb;#1d1e1b;bold
    shadow = #654642;#1d1e1b

[dialog]
    _default_ = #656869;#0e0e0d
    dfocus = #1d1e1b;#4a9aa6;bold
    dhotnormal = #ffbf00;#0e0e0d
    dhotfocus = #ffbf00;#4a9aa6;bold
    dtitle = #9bc1bb;#0e0e0d;bold

[error]
    _default_ = #656869;#ff4000
    errdfocus = #1d1e1b;#ffbf00;bold
    errdhotnormal = #ffbf00;#ff4000
    errdhotfocus = #ffbf00;#4a9aa6;bold
    errdtitle = #ffbf00;#ff4000;bold

[filehighlight]
    directory = #c3c3bd;#1d1e1b;bold
    executable = #6e8789;#1d1e1b;bold
    symlink = #d85c60;#1d1e1b
    hardlink = #d85c60;#1d1e1b
    stalelink = #ff4000;#1d1e1b
    device = #ffbf00;#1d1e1b
    special = #d85c60;#1d1e1b
    core = #ff4000;#1d1e1b
    temp = #654642;#1d1e1b
    archive = #f78c5e;#1d1e1b
    doc = #6e8789;#1d1e1b
    source = #6e8789;#1d1e1b
    media = #6e8789;#1d1e1b
    graph = #6e8789;#1d1e1b
    database = #9bc1bb;#1d1e1b

[menu]
    _default_ = #656869;#0e0e0d
    menusel = #656869;#4a9aa6
    menuhot = #ffbf00;#0e0e0d
    menuhotsel = #ffbf00;#4a9aa6
    menuinactive = #654642;#0e0e0d

[popupmenu]
    _default_ = #656869;#0e0e0d
    menusel = #656869;#4a9aa6
    menutitle = #9bc1bb;#0e0e0d;bold

[buttonbar]
    hotkey = #ffbf00;#0e0e0d;bold
    button = #656869;#0e0e0d

[statusbar]
    _default_ = #1d1e1b;#d85c60

[help]
    _default_ = #656869;#0e0e0d
    helpitalic = #ffbf00;#0e0e0d;italic
    helpbold = #9bc1bb;#0e0e0d;bold
    helplink = #d85c60;#0e0e0d;underline
    helpslink = #656869;#d85c60
    helptitle = #9bc1bb;#0e0e0d;bold

[editor]
    _default_ = #656869;#1d1e1b
    editbold = #ffbf00;#1d1e1b;bold
    editmarked = #656869;#4a9aa6
    editwhitespace = #654642;#1d1e1b
    editnonprintable = #654642;#1d1e1b
    editlinestate = #1d1e1b;#0e0e0d
    bookmark = #656869;#ff4000
    bookmarkfound = #1d1e1b;#c9d400
    editrightmargin = #654642;#0e0e0d
    editbg = #656869;#1d1e1b
    editframe = #654642;#1d1e1b
    editframeactive = #d4d987;#1d1e1b
    editframedrag = #ff4000;#1d1e1b

[viewer]
    _default_ = #656869;#1d1e1b
    viewbold = #ffbf00;#1d1e1b;bold
    viewunderline = #d85c60;#1d1e1b;underline
    viewselected = #656869;#4a9aa6

[diffviewer]
    added = #1d1e1b;#c9d400
    changedline = #1d1e1b;#0078bd
    changednew = #1d1e1b;#c9d400
    changed = #1d1e1b;#0078bd
    removed = #656869;#ff4000
    error = #656869;#ff4000
