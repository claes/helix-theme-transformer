[skin]
    description = term16_light - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #ffffff;#000000
    selected = #ffffff;#0d0d0d
    marked = #ffffff;#000000;bold
    markselect = #ffffff;#0d0d0d;bold
    gauge = #ffffff;#0d0d0d
    input = #ffffff;#0d0d0d
    inputmark = #ffffff;#0d0d0d
    inputunchanged = #666666;#0d0d0d
    disabled = #666666;#0d0d0d
    reverse = #000000;#ffffff
    commandlinemark = #ffffff;#0d0d0d
    header = #ffffff;#000000;bold
    shadow = #666666;#000000

[dialog]
    _default_ = #ffffff;#0d0d0d
    dfocus = #000000;#0d0d0d;bold
    dhotnormal = #ffffff;#0d0d0d
    dhotfocus = #ffffff;#0d0d0d;bold
    dtitle = #ffffff;#0d0d0d;bold

[error]
    _default_ = #ffffff;#ffffff
    errdfocus = #000000;#ffffff;bold
    errdhotnormal = #ffffff;#ffffff
    errdhotfocus = #ffffff;#0d0d0d;bold
    errdtitle = #ffffff;#ffffff;bold

