    editbold = #d97917;#000000;bold
    editmarked = #c1c9d2;#3e4043
    editwhitespace = #697386;#000000
    editnonprintable = #697386;#000000
    editlinestate = #000000;#602864
    bookmark = #c1c9d2;#ed5f74
    bookmarkfound = #000000;#1ea672
    editrightmargin = #697386;#602864
    editbg = #c1c9d2;#000000
    editframe = #697386;#000000
