[statusbar]
    _default_ = #000000;#3a97d4

[help]
    _default_ = #c1c9d2;#602864
    helpitalic = #d97917;#602864;italic
    helpbold = #1ea672;#602864;bold
    helplink = #3a97d4;#602864;underline
