[skin]
    description = vim_dark_high_contrast - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #c1c9d2;#000000
    selected = #c1c9d2;#3e4043
    marked = #d97917;#000000;bold
    markselect = #d97917;#3e4043;bold
    gauge = #c1c9d2;#602864
    input = #c1c9d2;#602864
    inputmark = #c1c9d2;#3e4043
    inputunchanged = #697386;#602864
    disabled = #697386;#602864
    reverse = #000000;#c1c9d2
    commandlinemark = #c1c9d2;#3e4043
    header = #1ea672;#000000;bold
    shadow = #697386;#000000

[dialog]
    _default_ = #c1c9d2;#602864
    dfocus = #000000;#3e4043;bold
    dhotnormal = #d97917;#602864
    dhotfocus = #d97917;#3e4043;bold
    dtitle = #1ea672;#602864;bold

[error]
    _default_ = #c1c9d2;#ed5f74
    errdfocus = #000000;#d97917;bold
    errdhotnormal = #d97917;#ed5f74
    errdhotfocus = #d97917;#3e4043;bold
    errdtitle = #d97917;#ed5f74;bold

[filehighlight]
    directory = #7fd3ed;#000000;bold
    executable = #ed5f74;#000000;bold
    symlink = #3a97d4;#000000
    hardlink = #3a97d4;#000000
    stalelink = #ed5f74;#000000
    device = #d97917;#000000
    special = #3a97d4;#000000
    core = #ed5f74;#000000
    temp = #697386;#000000
    archive = #ed5f74;#000000
    doc = #ed5f74;#000000
    source = #d97917;#000000
    media = #d97917;#000000
    graph = #d97917;#000000
    database = #1ea672;#000000

[menu]
    _default_ = #c1c9d2;#602864
    menusel = #c1c9d2;#3e4043
    menuhot = #d97917;#602864
    menuhotsel = #d97917;#3e4043
    menuinactive = #697386;#602864

[popupmenu]
    _default_ = #c1c9d2;#602864
    menusel = #c1c9d2;#3e4043
    menutitle = #1ea672;#602864;bold

[buttonbar]
    hotkey = #d97917;#602864;bold
