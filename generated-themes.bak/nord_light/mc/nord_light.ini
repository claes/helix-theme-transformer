[skin]
    description = nord_light - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #2e3440;#eceff4
    selected = #2e3440;#8fbcbb
    marked = #ebcb8b;#eceff4;bold
    markselect = #ebcb8b;#8fbcbb;bold
    gauge = #2e3440;#d8dee9
    input = #2e3440;#d8dee9
    inputmark = #2e3440;#8fbcbb
    inputunchanged = #8fbcbb;#d8dee9
    disabled = #8fbcbb;#d8dee9
    reverse = #eceff4;#2e3440
    commandlinemark = #2e3440;#8fbcbb
    header = #5e81ac;#eceff4;bold
    shadow = #8fbcbb;#eceff4

[dialog]
    _default_ = #2e3440;#d8dee9
    dfocus = #eceff4;#8fbcbb;bold
    dhotnormal = #ebcb8b;#d8dee9
    dhotfocus = #ebcb8b;#8fbcbb;bold
    dtitle = #5e81ac;#d8dee9;bold

[error]
    _default_ = #2e3440;#bf616a
    errdfocus = #eceff4;#ebcb8b;bold
    errdhotnormal = #ebcb8b;#bf616a
    errdhotfocus = #ebcb8b;#8fbcbb;bold
    errdtitle = #ebcb8b;#bf616a;bold

[filehighlight]
    directory = #4c566a;#eceff4;bold
    executable = #a3be8c;#eceff4;bold
    symlink = #5e81ac;#eceff4
    hardlink = #5e81ac;#eceff4
    stalelink = #bf616a;#eceff4
    device = #ebcb8b;#eceff4
    special = #5e81ac;#eceff4
    core = #bf616a;#eceff4
    temp = #8fbcbb;#eceff4
    archive = #b48ead;#eceff4
    doc = #a3be8c;#eceff4
    source = #434c5e;#eceff4
    media = #434c5e;#eceff4
    graph = #434c5e;#eceff4
    database = #5e81ac;#eceff4

[menu]
    _default_ = #2e3440;#d8dee9
    menusel = #2e3440;#8fbcbb
    menuhot = #ebcb8b;#d8dee9
    menuhotsel = #ebcb8b;#8fbcbb
    menuinactive = #8fbcbb;#d8dee9

[popupmenu]
    _default_ = #2e3440;#d8dee9
    menusel = #2e3440;#8fbcbb
    menutitle = #5e81ac;#d8dee9;bold

[buttonbar]
    hotkey = #ebcb8b;#d8dee9;bold
    button = #2e3440;#d8dee9

[statusbar]
    _default_ = #eceff4;#5e81ac

[help]
    _default_ = #2e3440;#d8dee9
    helpitalic = #ebcb8b;#d8dee9;italic
    helpbold = #5e81ac;#d8dee9;bold
    helplink = #5e81ac;#d8dee9;underline
    helpslink = #2e3440;#5e81ac
    helptitle = #5e81ac;#d8dee9;bold

[editor]
    _default_ = #2e3440;#eceff4
    editbold = #ebcb8b;#eceff4;bold
    editmarked = #2e3440;#8fbcbb
    editwhitespace = #8fbcbb;#eceff4
    editnonprintable = #8fbcbb;#eceff4
    editlinestate = #eceff4;#d8dee9
    bookmark = #2e3440;#bf616a
    bookmarkfound = #eceff4;#a3be8c
    editrightmargin = #8fbcbb;#d8dee9
    editbg = #2e3440;#eceff4
    editframe = #8fbcbb;#eceff4
    editframeactive = #eceff4;#eceff4
    editframedrag = #bf616a;#eceff4

[viewer]
    _default_ = #2e3440;#eceff4
    viewbold = #ebcb8b;#eceff4;bold
    viewunderline = #5e81ac;#eceff4;underline
    viewselected = #2e3440;#8fbcbb

[diffviewer]
    added = #eceff4;#a3be8c
    changedline = #eceff4;#ebcb8b
    changednew = #eceff4;#a3be8c
    changed = #eceff4;#ebcb8b
    removed = #2e3440;#bf616a
    error = #2e3440;#bf616a
