    inputmark = #fefeff;#1b232e
    inputunchanged = #4e6a97;#2a3a54
    disabled = #4e6a97;#2a3a54
    reverse = #191d24;#fefeff
    commandlinemark = #fefeff;#1b232e
    header = #9983d7;#191d24;bold
    shadow = #4e6a97;#191d24

[dialog]
