[skin]
    description = earl_grey - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #a6a6a6;#101010
    selected = #a6a6a6;#3e3e3e
    marked = #e5c890;#101010;bold
    markselect = #e5c890;#3e3e3e;bold
    gauge = #a6a6a6;#1b1b1b
    input = #a6a6a6;#1b1b1b
    inputmark = #a6a6a6;#3e3e3e
    inputunchanged = #808080;#1b1b1b
    disabled = #808080;#1b1b1b
    reverse = #101010;#a6a6a6
    commandlinemark = #a6a6a6;#3e3e3e
    header = #e5c890;#101010;bold
    shadow = #808080;#101010

[dialog]
    _default_ = #a6a6a6;#1b1b1b
    dfocus = #101010;#3e3e3e;bold
    dhotnormal = #e5c890;#1b1b1b
    dhotfocus = #e5c890;#3e3e3e;bold
    dtitle = #e5c890;#1b1b1b;bold

[error]
    _default_ = #a6a6a6;#e78284
    errdfocus = #101010;#e5c890;bold
    errdhotnormal = #e5c890;#e78284
    errdhotfocus = #e5c890;#3e3e3e;bold
    errdtitle = #e5c890;#e78284;bold

[filehighlight]
    directory = #a6a6a6;#101010;bold
    executable = #90b99f;#101010;bold
    symlink = #808080;#101010
    hardlink = #808080;#101010
    stalelink = #e78284;#101010
    device = #e5c890;#101010
    special = #808080;#101010
    core = #e78284;#101010
    temp = #808080;#101010
    archive = #a6a6a6;#101010
    doc = #90b99f;#101010
    source = #b59efc;#101010
    media = #b59efc;#101010
    graph = #b59efc;#101010
    database = #e5c890;#101010

[menu]
    _default_ = #a6a6a6;#1b1b1b
    menusel = #a6a6a6;#3e3e3e
    menuhot = #e5c890;#1b1b1b
    menuhotsel = #e5c890;#3e3e3e
    menuinactive = #808080;#1b1b1b

[popupmenu]
    _default_ = #a6a6a6;#1b1b1b
    menusel = #a6a6a6;#3e3e3e
    menutitle = #e5c890;#1b1b1b;bold

[buttonbar]
    hotkey = #e5c890;#1b1b1b;bold
    button = #a6a6a6;#1b1b1b

[statusbar]
    _default_ = #101010;#808080

[help]
    _default_ = #a6a6a6;#1b1b1b
    helpitalic = #e5c890;#1b1b1b;italic
    helpbold = #e5c890;#1b1b1b;bold
    helplink = #808080;#1b1b1b;underline
    helpslink = #a6a6a6;#808080
    helptitle = #e5c890;#1b1b1b;bold

[editor]
    _default_ = #a6a6a6;#101010
    editbold = #e5c890;#101010;bold
    editmarked = #a6a6a6;#3e3e3e
    editwhitespace = #808080;#101010
    editnonprintable = #808080;#101010
    editlinestate = #101010;#1b1b1b
    bookmark = #a6a6a6;#e78284
    bookmarkfound = #101010;#90b99f
    editrightmargin = #808080;#1b1b1b
    editbg = #a6a6a6;#101010
    editframe = #808080;#101010
    editframeactive = #000000;#101010
    editframedrag = #e78284;#101010

[viewer]
    _default_ = #a6a6a6;#101010
    viewbold = #e5c890;#101010;bold
    viewunderline = #808080;#101010;underline
    viewselected = #a6a6a6;#3e3e3e

[diffviewer]
    added = #101010;#90b99f
    changedline = #101010;#a6a6a6
    changednew = #101010;#90b99f
    changed = #101010;#a6a6a6
    removed = #a6a6a6;#e78284
    error = #a6a6a6;#e78284
