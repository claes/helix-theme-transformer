[skin]
    description = base16_default_light - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #383838;#f8f8f8
    selected = #383838;#d8d8d8
    marked = #dc9656;#f8f8f8;bold
    markselect = #dc9656;#d8d8d8;bold
    gauge = #383838;#e8e8e8
    input = #383838;#e8e8e8
    inputmark = #383838;#d8d8d8
    inputunchanged = #b8b8b8;#e8e8e8
    disabled = #b8b8b8;#e8e8e8
    reverse = #f8f8f8;#383838
    commandlinemark = #383838;#d8d8d8
    header = #f7ca88;#f8f8f8;bold
    shadow = #b8b8b8;#f8f8f8

[dialog]
    _default_ = #383838;#e8e8e8
    dfocus = #f8f8f8;#d8d8d8;bold
    dhotnormal = #dc9656;#e8e8e8
    dhotfocus = #dc9656;#d8d8d8;bold
    dtitle = #f7ca88;#e8e8e8;bold

[error]
    _default_ = #383838;#ab4642
    errdfocus = #f8f8f8;#dc9656;bold
    errdhotnormal = #dc9656;#ab4642
    errdhotfocus = #dc9656;#d8d8d8;bold
    errdtitle = #dc9656;#ab4642;bold

[filehighlight]
    directory = #7cafc2;#f8f8f8;bold
