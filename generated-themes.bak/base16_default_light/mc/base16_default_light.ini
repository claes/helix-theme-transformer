    device = #dc9656;#f8f8f8
    special = #7cafc2;#f8f8f8
    core = #ab4642;#f8f8f8
    temp = #b8b8b8;#f8f8f8
    archive = #dc9656;#f8f8f8
    doc = #a1b56c;#f8f8f8
    source = #ba8baf;#f8f8f8
    media = #ba8baf;#f8f8f8
    graph = #ba8baf;#f8f8f8
    database = #f7ca88;#f8f8f8

[menu]
    _default_ = #383838;#e8e8e8
    menusel = #383838;#d8d8d8
