[skin]
    description = heisenberg - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #32c9fa;#000000
    selected = #32c9fa;#1b0334
    marked = #cecd19;#000000;bold
    markselect = #cecd19;#1b0334;bold
    gauge = #32c9fa;#121212
    input = #32c9fa;#121212
    inputmark = #32c9fa;#1b0334
    inputunchanged = #bd5173;#121212
    disabled = #bd5173;#121212
    reverse = #000000;#32c9fa
    commandlinemark = #32c9fa;#1b0334
    header = #32c9fa;#000000;bold
    shadow = #bd5173;#000000

[dialog]
    _default_ = #32c9fa;#121212
    dfocus = #000000;#1b0334;bold
    dhotnormal = #cecd19;#121212
    dhotfocus = #cecd19;#1b0334;bold
    dtitle = #32c9fa;#121212;bold

[error]
    _default_ = #32c9fa;#c32101
    errdfocus = #000000;#cecd19;bold
    errdhotnormal = #cecd19;#c32101
    errdhotfocus = #cecd19;#1b0334;bold
    errdtitle = #cecd19;#c32101;bold

[filehighlight]
    directory = #00ff80;#000000;bold
    executable = #32c9fa;#000000;bold
    symlink = #00ff80;#000000
    hardlink = #00ff80;#000000
    stalelink = #c32101;#000000
    device = #cecd19;#000000
    special = #00ff80;#000000
    core = #c32101;#000000
    temp = #bd5173;#000000
    archive = #f7b90c;#000000
    doc = #32c9fa;#000000
    source = #009669;#000000
    media = #009669;#000000
    graph = #009669;#000000
    database = #32c9fa;#000000

[menu]
    _default_ = #32c9fa;#121212
    menusel = #32c9fa;#1b0334
    menuhot = #cecd19;#121212
    menuhotsel = #cecd19;#1b0334
    menuinactive = #bd5173;#121212

[popupmenu]
    _default_ = #32c9fa;#121212
    menusel = #32c9fa;#1b0334
    menutitle = #32c9fa;#121212;bold

[buttonbar]
    hotkey = #cecd19;#121212;bold
    button = #32c9fa;#121212

[statusbar]
    _default_ = #000000;#00ff80

[help]
    _default_ = #32c9fa;#121212
    helpitalic = #cecd19;#121212;italic
    helpbold = #32c9fa;#121212;bold
    helplink = #00ff80;#121212;underline
    helpslink = #32c9fa;#00ff80
    helptitle = #32c9fa;#121212;bold

[editor]
    _default_ = #32c9fa;#000000
    editbold = #cecd19;#000000;bold
    editmarked = #32c9fa;#1b0334
    editwhitespace = #bd5173;#000000
    editnonprintable = #bd5173;#000000
    editlinestate = #000000;#121212
    bookmark = #32c9fa;#c32101
    bookmarkfound = #000000;#00ff80
    editrightmargin = #bd5173;#121212
    editbg = #32c9fa;#000000
    editframe = #bd5173;#000000
    editframeactive = #000000;#000000
    editframedrag = #c32101;#000000

[viewer]
    _default_ = #32c9fa;#000000
    viewbold = #cecd19;#000000;bold
    viewunderline = #00ff80;#000000;underline
    viewselected = #32c9fa;#1b0334

[diffviewer]
    added = #000000;#00ff80
    changedline = #000000;#ff8f40
    changednew = #000000;#00ff80
    changed = #000000;#ff8f40
    removed = #32c9fa;#c32101
    error = #32c9fa;#c32101
