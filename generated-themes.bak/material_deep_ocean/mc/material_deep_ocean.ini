    commandlinemark = #a6accd;#1f2233
    header = #c792ea;#0f111a;bold
    shadow = #464b5d;#0f111a

[dialog]
    _default_ = #a6accd;#0f111a
    dfocus = #0f111a;#1f2233;bold
    dhotnormal = #ffcb6b;#0f111a
    dhotfocus = #ffcb6b;#1f2233;bold
    dtitle = #c792ea;#0f111a;bold

[error]
