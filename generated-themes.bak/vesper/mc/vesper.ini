[skin]
    description = vesper - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #ffffff;#101010
    selected = #ffffff;#666666
    marked = #ffc799;#101010;bold
    markselect = #ffc799;#666666;bold
    gauge = #ffffff;#1c1c1c
    input = #ffffff;#1c1c1c
    inputmark = #ffffff;#666666
    inputunchanged = #8b8b8b;#1c1c1c
    disabled = #8b8b8b;#1c1c1c
    reverse = #101010;#ffffff
    commandlinemark = #ffffff;#666666
    header = #ffc799;#101010;bold
    shadow = #8b8b8b;#101010

[dialog]
    _default_ = #ffffff;#1c1c1c
    dfocus = #101010;#666666;bold
    dhotnormal = #ffc799;#1c1c1c
    dhotfocus = #ffc799;#666666;bold
    dtitle = #ffc799;#1c1c1c;bold

[error]
    _default_ = #ffffff;#ff8080
    errdfocus = #101010;#ffc799;bold
    errdhotnormal = #ffc799;#ff8080
    errdhotfocus = #ffc799;#666666;bold
    errdtitle = #ffc799;#ff8080;bold

[filehighlight]
    directory = #ffc799;#101010;bold
    executable = #99ffe4;#101010;bold
    symlink = #ffc799;#101010
    hardlink = #ffc799;#101010
    stalelink = #ff8080;#101010
    device = #ffc799;#101010
    special = #ffc799;#101010
    core = #ff8080;#101010
    temp = #8b8b8b;#101010
    archive = #ffc799;#101010
    doc = #99ffe4;#101010
    source = #a0a0a0;#101010
    media = #a0a0a0;#101010
    graph = #a0a0a0;#101010
    database = #ffc799;#101010

[menu]
    _default_ = #ffffff;#1c1c1c
    menusel = #ffffff;#666666
    menuhot = #ffc799;#1c1c1c
    menuhotsel = #ffc799;#666666
    menuinactive = #8b8b8b;#1c1c1c

[popupmenu]
    _default_ = #ffffff;#1c1c1c
    menusel = #ffffff;#666666
    menutitle = #ffc799;#1c1c1c;bold

[buttonbar]
