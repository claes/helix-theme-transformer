    editmarked = #ffffff;#666666
    editwhitespace = #8b8b8b;#101010
    editnonprintable = #8b8b8b;#101010
    editlinestate = #101010;#1c1c1c
    bookmark = #ffffff;#ff8080
    bookmarkfound = #101010;#99ffe4
    editrightmargin = #8b8b8b;#1c1c1c
    editbg = #ffffff;#101010
    editframe = #8b8b8b;#101010
