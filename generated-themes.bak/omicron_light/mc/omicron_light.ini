[skin]
    description = omicron_light - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #333333;#eeeeee
    selected = #333333;#555555
    marked = #bbaa00;#eeeeee;bold
    markselect = #bbaa00;#555555;bold
    gauge = #333333;#dddddd
    input = #333333;#dddddd
    inputmark = #333333;#555555
    inputunchanged = #770077;#dddddd
    disabled = #770077;#dddddd
    reverse = #eeeeee;#333333
    commandlinemark = #333333;#555555
    header = #bbaa00;#eeeeee;bold
    shadow = #770077;#eeeeee

[dialog]
    _default_ = #333333;#dddddd
    dfocus = #eeeeee;#555555;bold
    dhotnormal = #bbaa00;#dddddd
    dhotfocus = #bbaa00;#555555;bold
    dtitle = #bbaa00;#dddddd;bold

[error]
    _default_ = #333333;#ff0000
    errdfocus = #eeeeee;#bbaa00;bold
    errdhotnormal = #bbaa00;#ff0000
    errdhotfocus = #bbaa00;#555555;bold
    errdtitle = #bbaa00;#ff0000;bold

[filehighlight]
    directory = #333333;#eeeeee;bold
    executable = #009933;#eeeeee;bold
    symlink = #0066aa;#eeeeee
    hardlink = #0066aa;#eeeeee
    stalelink = #ff0000;#eeeeee
    device = #bbaa00;#eeeeee
    special = #0066aa;#eeeeee
    core = #ff0000;#eeeeee
    temp = #770077;#eeeeee
    archive = #009933;#eeeeee
    doc = #009933;#eeeeee
    source = #333333;#eeeeee
    media = #333333;#eeeeee
    graph = #333333;#eeeeee
    database = #bbaa00;#eeeeee

[menu]
    _default_ = #333333;#dddddd
    menusel = #333333;#555555
    menuhot = #bbaa00;#dddddd
    menuhotsel = #bbaa00;#555555
    menuinactive = #770077;#dddddd

[popupmenu]
    _default_ = #333333;#dddddd
    menusel = #333333;#555555
    menutitle = #bbaa00;#dddddd;bold

[buttonbar]
    hotkey = #bbaa00;#dddddd;bold
    button = #333333;#dddddd

[statusbar]
    _default_ = #eeeeee;#0066aa

[help]
    _default_ = #333333;#dddddd
    helpitalic = #bbaa00;#dddddd;italic
    helpbold = #bbaa00;#dddddd;bold
    helplink = #0066aa;#dddddd;underline
    helpslink = #333333;#0066aa
    helptitle = #bbaa00;#dddddd;bold

[editor]
    _default_ = #333333;#eeeeee
    editbold = #bbaa00;#eeeeee;bold
    editmarked = #333333;#555555
    editwhitespace = #770077;#eeeeee
    editnonprintable = #770077;#eeeeee
    editlinestate = #eeeeee;#dddddd
    bookmark = #333333;#ff0000
    bookmarkfound = #eeeeee;#007700
    editrightmargin = #770077;#dddddd
    editbg = #333333;#eeeeee
    editframe = #770077;#eeeeee
    editframeactive = #eeeeee;#eeeeee
    editframedrag = #ff0000;#eeeeee

[viewer]
    _default_ = #333333;#eeeeee
    viewbold = #bbaa00;#eeeeee;bold
    viewunderline = #0066aa;#eeeeee;underline
    viewselected = #333333;#555555

[diffviewer]
    added = #eeeeee;#007700
    changedline = #eeeeee;#777700
    changednew = #eeeeee;#007700
    changed = #eeeeee;#777700
    removed = #333333;#880000
    error = #333333;#ff0000
