[skin]
    description = wolf-alabaster-light-mono - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #000000;#f7f7f7
    selected = #000000;#dde7ed
    marked = #ffbc5d;#f7f7f7;bold
    markselect = #ffbc5d;#dde7ed;bold
    gauge = #000000;#eeeeee
    input = #000000;#eeeeee
    inputmark = #000000;#dde7ed
    inputunchanged = #999999;#eeeeee
    disabled = #999999;#eeeeee
    reverse = #f7f7f7;#000000
    commandlinemark = #000000;#dde7ed
    header = #000000;#f7f7f7;bold
    shadow = #999999;#f7f7f7

[dialog]
    _default_ = #000000;#eeeeee
    dfocus = #f7f7f7;#dde7ed;bold
    dhotnormal = #ffbc5d;#eeeeee
    dhotfocus = #ffbc5d;#dde7ed;bold
    dtitle = #000000;#eeeeee;bold

[error]
    _default_ = #000000;#cc3333
    errdfocus = #f7f7f7;#ffbc5d;bold
    errdhotnormal = #ffbc5d;#cc3333
    errdhotfocus = #ffbc5d;#dde7ed;bold
    errdtitle = #ffbc5d;#cc3333;bold

[filehighlight]
    directory = #000000;#f7f7f7;bold
    executable = #000000;#f7f7f7;bold
    symlink = #000000;#f7f7f7
    hardlink = #000000;#f7f7f7
    stalelink = #cc3333;#f7f7f7
    device = #ffbc5d;#f7f7f7
    special = #000000;#f7f7f7
    core = #cc3333;#f7f7f7
    temp = #999999;#f7f7f7
    archive = #000000;#f7f7f7
    doc = #000000;#f7f7f7
    source = #000000;#f7f7f7
    media = #000000;#f7f7f7
    graph = #000000;#f7f7f7
    database = #000000;#f7f7f7

[menu]
    _default_ = #000000;#eeeeee
    menusel = #000000;#dde7ed
    menuhot = #ffbc5d;#eeeeee
    menuhotsel = #ffbc5d;#dde7ed
