[skin]
    description = jetbrains_dark - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #57aaf7;#1e1f22
    selected = #57aaf7;#ced0d6
    marked = #c29e4a;#1e1f22;bold
    markselect = #c29e4a;#ced0d6;bold
    gauge = #57aaf7;#2b2d30
    input = #57aaf7;#2b2d30
    inputmark = #57aaf7;#ced0d6
    inputunchanged = #7a7e85;#2b2d30
    disabled = #7a7e85;#2b2d30
    reverse = #1e1f22;#57aaf7
    commandlinemark = #57aaf7;#ced0d6
    header = #cf8e6d;#1e1f22;bold
    shadow = #7a7e85;#1e1f22

[dialog]
