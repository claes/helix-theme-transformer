[skin]
    description = seoul256-dark-hard - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #d0d0d0;#1c1c1c
    selected = #d0d0d0;#875f5f
    marked = #ffd787;#1c1c1c;bold
    markselect = #ffd787;#875f5f;bold
    gauge = #d0d0d0;#d7d7af
    input = #d0d0d0;#d7d7af
    inputmark = #d0d0d0;#875f5f
    inputunchanged = #5f875f;#d7d7af
    disabled = #5f875f;#d7d7af
    reverse = #1c1c1c;#d0d0d0
    commandlinemark = #d0d0d0;#875f5f
    header = #d8af5f;#1c1c1c;bold
    shadow = #5f875f;#1c1c1c

[dialog]
    _default_ = #d0d0d0;#d7d7af
    dfocus = #1c1c1c;#875f5f;bold
    dhotnormal = #ffd787;#d7d7af
    dhotfocus = #ffd787;#875f5f;bold
    dtitle = #d8af5f;#d7d7af;bold

[error]
    _default_ = #d0d0d0;#d70000
    errdfocus = #1c1c1c;#ffd787;bold
    errdhotnormal = #ffd787;#d70000
    errdhotfocus = #ffd787;#875f5f;bold
    errdtitle = #ffd787;#d70000;bold

[filehighlight]
    directory = #d7d7af;#1c1c1c;bold
    executable = #87afaf;#1c1c1c;bold
    symlink = #d7d7af;#1c1c1c
    hardlink = #d7d7af;#1c1c1c
    stalelink = #d70000;#1c1c1c
    device = #ffd787;#1c1c1c
    special = #d7d7af;#1c1c1c
    core = #d70000;#1c1c1c
    temp = #5f875f;#1c1c1c
    archive = #ffd787;#1c1c1c
    doc = #87afaf;#1c1c1c
    source = #d75f87;#1c1c1c
    media = #d75f87;#1c1c1c
    graph = #d75f87;#1c1c1c
    database = #d8af5f;#1c1c1c

[menu]
    _default_ = #d0d0d0;#d7d7af
    menusel = #d0d0d0;#875f5f
    menuhot = #ffd787;#d7d7af
    menuhotsel = #ffd787;#875f5f
    menuinactive = #5f875f;#d7d7af

[popupmenu]
    _default_ = #d0d0d0;#d7d7af
    menusel = #d0d0d0;#875f5f
    menutitle = #d8af5f;#d7d7af;bold

[buttonbar]
    hotkey = #ffd787;#d7d7af;bold
    button = #d0d0d0;#d7d7af

[statusbar]
    _default_ = #1c1c1c;#d7d7af

[help]
    _default_ = #d0d0d0;#d7d7af
    helpitalic = #ffd787;#d7d7af;italic
    helpbold = #d8af5f;#d7d7af;bold
    helplink = #d7d7af;#d7d7af;underline
    helpslink = #d0d0d0;#d7d7af
    helptitle = #d8af5f;#d7d7af;bold

[editor]
    _default_ = #d0d0d0;#1c1c1c
    editbold = #ffd787;#1c1c1c;bold
    editmarked = #d0d0d0;#875f5f
    editwhitespace = #5f875f;#1c1c1c
    editnonprintable = #5f875f;#1c1c1c
    editlinestate = #1c1c1c;#d7d7af
    bookmark = #d0d0d0;#d70000
    bookmarkfound = #1c1c1c;#87af87
    editrightmargin = #5f875f;#d7d7af
    editbg = #d0d0d0;#1c1c1c
    editframe = #5f875f;#1c1c1c
    editframeactive = #d0d0d0;#1c1c1c
    editframedrag = #d70000;#1c1c1c

[viewer]
    _default_ = #d0d0d0;#1c1c1c
    viewbold = #ffd787;#1c1c1c;bold
    viewunderline = #d7d7af;#1c1c1c;underline
    viewselected = #d0d0d0;#875f5f

[diffviewer]
    added = #1c1c1c;#87af87
    changedline = #1c1c1c;#5f87d7
    changednew = #1c1c1c;#87af87
    changed = #1c1c1c;#5f87d7
    removed = #d0d0d0;#d7005f
    error = #d0d0d0;#d70000
