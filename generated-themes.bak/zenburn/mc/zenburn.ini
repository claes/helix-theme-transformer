    helptitle = #dfdfbf;#313633;bold

[editor]
    _default_ = #dcdccc;#3f3f3f
    editbold = #e37170;#3f3f3f;bold
    editmarked = #dcdccc;#373737
    editwhitespace = #7f9f7f;#3f3f3f
    editnonprintable = #7f9f7f;#3f3f3f
    editlinestate = #3f3f3f;#313633
    bookmark = #dcdccc;#e37170
    bookmarkfound = #3f3f3f;#709080
    editrightmargin = #7f9f7f;#313633
    editbg = #dcdccc;#3f3f3f
