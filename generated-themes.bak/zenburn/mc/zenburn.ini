[skin]
    description = zenburn - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #dcdccc;#3f3f3f
    selected = #dcdccc;#373737
    marked = #e37170;#3f3f3f;bold
    markselect = #e37170;#373737;bold
    gauge = #dcdccc;#313633
    input = #dcdccc;#313633
    inputmark = #dcdccc;#373737
    inputunchanged = #7f9f7f;#313633
    disabled = #7f9f7f;#313633
    reverse = #3f3f3f;#dcdccc
    commandlinemark = #dcdccc;#373737
    header = #dfdfbf;#3f3f3f;bold
    shadow = #7f9f7f;#3f3f3f

[dialog]
    _default_ = #dcdccc;#313633
    dfocus = #3f3f3f;#373737;bold
    dhotnormal = #e37170;#313633
    dhotfocus = #e37170;#373737;bold
    dtitle = #dfdfbf;#313633;bold

[error]
    _default_ = #dcdccc;#e37170
    errdfocus = #3f3f3f;#e37170;bold
    errdhotnormal = #e37170;#e37170
    errdhotfocus = #e37170;#373737;bold
    errdtitle = #e37170;#e37170;bold

[filehighlight]
    directory = #efef8f;#3f3f3f;bold
    executable = #cc9393;#3f3f3f;bold
    symlink = #cfbfaf;#3f3f3f
    hardlink = #cfbfaf;#3f3f3f
    stalelink = #e37170;#3f3f3f
    device = #e37170;#3f3f3f
    special = #cfbfaf;#3f3f3f
    core = #e37170;#3f3f3f
    temp = #7f9f7f;#3f3f3f
    archive = #dca3a3;#3f3f3f
    doc = #cc9393;#3f3f3f
    source = #f0dfaf;#3f3f3f
    media = #f0dfaf;#3f3f3f
    graph = #f0dfaf;#3f3f3f
    database = #dfdfbf;#3f3f3f

[menu]
    _default_ = #dcdccc;#313633
    menusel = #dcdccc;#373737
    menuhot = #e37170;#313633
    menuhotsel = #e37170;#373737
    menuinactive = #7f9f7f;#313633

[popupmenu]
    _default_ = #dcdccc;#313633
    menusel = #dcdccc;#373737
    menutitle = #dfdfbf;#313633;bold

[buttonbar]
    hotkey = #e37170;#313633;bold
    button = #dcdccc;#313633

[statusbar]
    _default_ = #3f3f3f;#cfbfaf

[help]
    _default_ = #dcdccc;#313633
    helpitalic = #e37170;#313633;italic
    helpbold = #dfdfbf;#313633;bold
    helplink = #cfbfaf;#313633;underline
