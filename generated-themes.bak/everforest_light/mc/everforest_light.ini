    doc = #35a77c;#fdf6e3
    source = #f85552;#fdf6e3
    media = #f85552;#fdf6e3
    graph = #f85552;#fdf6e3
    database = #dfa000;#fdf6e3

[menu]
    _default_ = #5c6a72;#e6e2cc
    menusel = #5c6a72;#e6e2cc
