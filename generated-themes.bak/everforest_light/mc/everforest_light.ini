[skin]
    description = everforest_light - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #5c6a72;#fdf6e3
    selected = #5c6a72;#e6e2cc
    marked = #dfa000;#fdf6e3;bold
    markselect = #dfa000;#e6e2cc;bold
    gauge = #5c6a72;#e6e2cc
    input = #5c6a72;#e6e2cc
    inputmark = #5c6a72;#e6e2cc
    inputunchanged = #939f91;#e6e2cc
    disabled = #939f91;#e6e2cc
    reverse = #fdf6e3;#5c6a72
    commandlinemark = #5c6a72;#e6e2cc
    header = #dfa000;#fdf6e3;bold
    shadow = #939f91;#fdf6e3

[dialog]
    _default_ = #5c6a72;#e6e2cc
    dfocus = #fdf6e3;#e6e2cc;bold
    dhotnormal = #dfa000;#e6e2cc
    dhotfocus = #dfa000;#e6e2cc;bold
    dtitle = #dfa000;#e6e2cc;bold

[error]
    _default_ = #5c6a72;#f85552
    errdfocus = #fdf6e3;#dfa000;bold
    errdhotnormal = #dfa000;#f85552
    errdhotfocus = #dfa000;#e6e2cc;bold
    errdtitle = #dfa000;#f85552;bold

[filehighlight]
