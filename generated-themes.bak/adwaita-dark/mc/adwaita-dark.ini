[skin]
    description = adwaita-dark - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #deddda;#1c1c1f
    selected = #deddda;#193d66
    marked = #f8e45c;#1c1c1f;bold
    markselect = #f8e45c;#193d66;bold
    gauge = #deddda;#28282c
    input = #deddda;#28282c
    inputmark = #deddda;#193d66
    inputunchanged = #5e5c64;#28282c
    disabled = #5e5c64;#28282c
    reverse = #1c1c1f;#deddda
    commandlinemark = #deddda;#193d66
    header = #5bc8af;#1c1c1f;bold
    shadow = #5e5c64;#1c1c1f

[dialog]
    _default_ = #deddda;#28282c
    dfocus = #1c1c1f;#193d66;bold
    dhotnormal = #f8e45c;#28282c
    dhotfocus = #f8e45c;#193d66;bold
    dtitle = #5bc8af;#28282c;bold

[error]
    _default_ = #deddda;#c01c28
    errdfocus = #1c1c1f;#f8e45c;bold
    errdhotnormal = #f8e45c;#c01c28
    errdhotfocus = #f8e45c;#193d66;bold
    errdtitle = #f8e45c;#c01c28;bold

[filehighlight]
    directory = #62a0ea;#1c1c1f;bold
    executable = #5bc8af;#1c1c1f;bold
    symlink = #5bc8af;#1c1c1f
    hardlink = #5bc8af;#1c1c1f
    stalelink = #c01c28;#1c1c1f
    device = #f8e45c;#1c1c1f
    special = #5bc8af;#1c1c1f
    core = #c01c28;#1c1c1f
    temp = #5e5c64;#1c1c1f
    archive = #33b2a4;#1c1c1f
    doc = #5bc8af;#1c1c1f
    source = #ffa348;#1c1c1f
    media = #ffa348;#1c1c1f
    graph = #ffa348;#1c1c1f
    database = #5bc8af;#1c1c1f

[menu]
    _default_ = #deddda;#28282c
    menusel = #deddda;#193d66
    menuhot = #f8e45c;#28282c
    menuhotsel = #f8e45c;#193d66
    menuinactive = #5e5c64;#28282c

[popupmenu]
    _default_ = #deddda;#28282c
    menusel = #deddda;#193d66
    menutitle = #5bc8af;#28282c;bold

[buttonbar]
    hotkey = #f8e45c;#28282c;bold
    button = #deddda;#28282c

[statusbar]
    _default_ = #1c1c1f;#5bc8af

[help]
    _default_ = #deddda;#28282c
    helpitalic = #f8e45c;#28282c;italic
    helpbold = #5bc8af;#28282c;bold
    helplink = #5bc8af;#28282c;underline
    helpslink = #deddda;#5bc8af
    helptitle = #5bc8af;#28282c;bold

[editor]
    _default_ = #deddda;#1c1c1f
    editbold = #f8e45c;#1c1c1f;bold
    editmarked = #deddda;#193d66
    editwhitespace = #5e5c64;#1c1c1f
    editnonprintable = #5e5c64;#1c1c1f
    editlinestate = #1c1c1f;#28282c
    bookmark = #deddda;#c01c28
    bookmarkfound = #1c1c1f;#33b2a4
    editrightmargin = #5e5c64;#28282c
    editbg = #deddda;#1c1c1f
    editframe = #5e5c64;#1c1c1f
    editframeactive = #1c1c1f;#1c1c1f
    editframedrag = #c01c28;#1c1c1f

[viewer]
    _default_ = #deddda;#1c1c1f
    viewbold = #f8e45c;#1c1c1f;bold
    viewunderline = #5bc8af;#1c1c1f;underline
    viewselected = #deddda;#193d66

[diffviewer]
    added = #1c1c1f;#33b2a4
    changedline = #1c1c1f;#ff7800
    changednew = #1c1c1f;#33b2a4
    changed = #1c1c1f;#ff7800
    removed = #deddda;#f66151
    error = #deddda;#c01c28
