[skin]
    description = monokai_pro - generated by Helix Theme Transformer
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #fcfcfa;#2d2a2e
    selected = #fcfcfa;#5b595c
    marked = #fc9867;#2d2a2e;bold
    markselect = #fc9867;#5b595c;bold
    gauge = #fcfcfa;#5b595c
    input = #fcfcfa;#5b595c
    inputmark = #fcfcfa;#5b595c
    inputunchanged = #727072;#5b595c
    disabled = #727072;#5b595c
    reverse = #2d2a2e;#fcfcfa
    commandlinemark = #fcfcfa;#5b595c
    header = #a9dc76;#2d2a2e;bold
    shadow = #727072;#2d2a2e

[dialog]
    _default_ = #fcfcfa;#5b595c
    dfocus = #2d2a2e;#5b595c;bold
    dhotnormal = #fc9867;#5b595c
    dhotfocus = #fc9867;#5b595c;bold
    dtitle = #a9dc76;#5b595c;bold

[error]
    _default_ = #fcfcfa;#ff6188
    errdfocus = #2d2a2e;#fc9867;bold
    errdhotnormal = #fc9867;#ff6188
    errdhotfocus = #fc9867;#5b595c;bold
    errdtitle = #fc9867;#ff6188;bold

