[workspace]
members = [
    "crates/theme-ir",
    "crates/helix-theme",
    "crates/semantic-roles",
    "crates/palette16",
    "crates/exporters",
    "crates/helix-theme-transformer-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
toml = "0.8"
